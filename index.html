内在的学习动力，他们在离开学校后更有可能成为自主的终身学习者。我们理解目前社会如何看待考试的担忧。然而，我们必须认识到，为预期的思维转变播种是重要的，并需要时间让它萌芽。我们鼓励学生和家长把在校学习视为自我提升之旅，而不仅仅是与他人的竞争。", "bp": "", "b": false, "li": false}, {"t": "        我们从师生那里得到的反馈是，取消年中考试腾出了更多的时间和空间，来促进学生的全面发展和更有效的教学。即使取消年中考试，学生仍有足够的机会了解学习进度，并熟悉考试情况。", "bp": "", "b": false, "li": false}, {"t": "       教育部和学校会继续与家长和学生合作，帮助他们了解教育制度改革的理由。我们希望与作为教育伙伴的家长一起，推动社会观念的转变。这将有助于拓宽社会对成功的定义，使我们的年轻人能够真正做到学无止境。", "bp": "", "b": false, "li": false}, {"t": "    ", "bp": "", "b": false, "li": false}]}]}, {"bg": [{"t": "有家长在会考前请假，以专心辅导孩子备考。就如黄总理在国会所指出，对许多家长来说，教育就像一场“军备竞赛”，会因为担心孩子落后于他人，让孩子无休止地补习。", "bp": "", "b": false, "li": false}, {"t": "过去文凭被视为通往成功的灵丹妙药，但现在几乎每个人都毕业自高等学府，年轻人会感到自己无论求学或就业，都困在永无止境的激烈竞争当中。社交媒体也放大人们对社会分层加剧的担忧，带来无休止的攀比和嫉妒。", "bp": "", "b": false, "li": false}], "rows": [{"label": "社会问题：", "kind": "challenge", "paras": [{"t": "过度重视成绩，忽略孩子整体成长", "bp": "", "b": true, "li": true}, {"t": "     部分家长与学生将考试成绩视为唯一标准，忽略了品格、情绪管理与社交能力等的重要性。这种单一评价体系容易使学生承受沉重心理压力。", "bp": "", "b": false, "li": false}, {"t": "“怕输文化”加剧教育焦虑", "bp": "", "b": true, "li": true}, {"t": "     社会强调“不能落后”，导致补习风气盛行，孩子缺乏探索兴趣与自主学习的空间。", "bp": "", "b": false, "li": false}, {"t": "成功定义过于狭窄", "bp": "", "b": true, "li": true}, {"t": "     长期以来，成功往往与名校、文凭和高薪职业挂钩，使不同潜能的学生难以被肯定。", "bp": "", "b": false, "li": false}]}, {"label": "全面发展教育的重要性", "kind": "impact", "paras": [{"t": "教育的目的不是光鲜亮丽的成绩，而是人的成长。教育应重视全面发展。事实上，我们无法也不能仅凭成绩去评判孩子优秀与否，因为教育不该是割裂的取舍，而应是完整的滋养。民国时期的北大校长蔡元培也曾指出：“决定孩子一生的不是学习成绩，而是健全的人格。”如果孩子取得亮眼的成绩，却在情绪适应与心理健康方面付出巨大的隐性代价，这样的成功值得反思。一旦本末倒置，往往事与愿违。", "bp": "教育的目的不是光鲜亮丽的成绩，而是人的成长。", "b": false, "li": true}, {"t": "未来职业发展的需求。成绩不代表未来人生的成功。学历固然重要，但未来的职业更看重个人的态度、适应能力、学习能力与协作精神。单凭考试成绩，无法判断一个人是否具备长远发展的潜质。", "bp": "未来职业发展的需求。", "b": false, "li": true}, {"t": "应对未来挑战，培养心理韧性很重要。在瞬息万变且充满挫折的现实世界中，高分低能的“草莓族”往往难以生存。我们需要培养不仅能应对考试，更能从容面对生活风浪的年轻一代。这种“跌倒了再爬起来”的心理韧性是保护学生心理健康的“防波堤”，避免因一次学业失利而走向极端的悲剧发生。", "bp": "应对未来挑战", "b": false, "li": true}]}, {"label": "如何实施全面发展教育", "kind": "action", "paras": [{"t": "不只根据成绩来衡量孩子的进步和发展，减少对学业成绩的过度重视，用可转移的技能培养他们对学习的热爱和快乐，让他们有更多内在的学习动力，成为负责任的，可以自我管理的终身学习者，为学校之外的生活做好准备，", "bp": "不只根据成绩来衡量孩子的进步和发展", "b": false, "li": true}, {"t": "拓宽成功的定义。有些才能和成就无法通过全国考试展现，直接招生计划是肯定这些才能和成就的途径，也是教育部扩大成功定义的努力之一。所谓成功，不应仅凭学业成绩定义。黄总理以“教育不是负担，而是跳板”承诺，政府会进一步拓宽成功的定义，让每个孩子都有机会发现和发展自己的优势。公共部门已启动改革，不再以学业成绩作为唯一标准。一些就业岗位甚至完全不考虑文凭，比如政府科技局招聘工程师时，以编程和解决问题的能力为主要录取考量。", "bp": "拓宽成功的定义。", "b": false, "li": true}, {"t": "给更多自主学习的时间和机会。面对日益复杂的世界，我们的学生须保有好奇心，并自主地广泛学习。为了让学生做到这一点，中学和高中的居家学习日预留了学生自发学习时间，学生借此积极地学习个人感兴趣的事物，包括外语、乐器、程序编写等。减少考试次数，取消年中考试也是为了腾出更多的时间和空间，来促进学生的全面发展和更有效的教育。", "bp": "给更多自主学习的时间和机会。", "b": false, "li": true}, {"t": "在丰富多彩的学校活动中让学生的不同才能得到全方位的发展。课堂不仅限于四面墙内，课程辅助活动是培养学生领袖才能与团队协作精神的摇篮。通过体育、制服团体或表演艺术，学生能学习如何与人沟通、解决冲突。此外，德育在于行动（VIA）和外展训练营（OBS）等项目，能让学生走出校园，接触社会不同阶层。这种体验式学习能潜移默化地培养他们的同理心和社会责任感，补足书本知识无法提供的“软技能”，真正实现“立德树人”的教育目标。", "bp": "在丰富多彩的学校活动中让学生的不同才能得到全方位的发展。", "b": false, "li": true}]}, {"label": "参考词句", "kind": "ref", "paras": [{"t": "十年树木，百年树人\n意思是：培养人才是长远工程，教育须有耐心。", "bp": "十年树木，百年树人\n", "b": false, "li": false}, {"t": "因材施教\n意思是：根据学生不同能力与兴趣施行教育。", "bp": "因材施教\n", "b": false, "li": false}, {"t": "德才兼备\n意思是：既有品德也有才能，强调全面发展。", "bp": "德才兼备\n", "b": false, "li": false}, {"t": "厚德载物\n意思是：品德深厚，方能承担重任。", "bp": "厚德载物\n", "b": false, "li": false}, {"t": "学以致用\n意思是：学习的目的在于实践与应用。", "bp": "学以致用\n", "b": false, "li": false}, {"t": "不偏不倚\n意思是：公正平衡，不走极端。", "bp": "不偏不倚\n", "b": false, "li": false}, {"t": "天生我材必有用 ", "bp": "", "b": true, "li": false}, {"t": "意思是：每个人都有自己的长处，不应因成绩不理想而妄自菲薄。", "bp": "", "b": false, "li": false}, {"t": "每个人都是天才。但如果你用爬树的能力来判断一条鱼，它终其一生都会以为自己是愚蠢的。” ——爱因斯坦\n意思是：每个人都有独特的潜能与长处。如果用单一、不适合的标准（如只看学业成绩）来衡量所有学生，不仅不公平，还会扼杀孩子的自信心，导致他们无法发现真正的自我价值。", "bp": "每个人都是天才。但如果你用爬树的能力来判断一条鱼，它终其一生都会以为自己是愚蠢的。", "b": false, "li": false}], "items": [{"term": "十年树木，百年树人", "en": "It takes ten years to grow trees, but a hundred years to nurture people.", "ex": "教育改革的成果不会马上看到，十年树木，百年树人，社会必须有耐心。", "paras": [{"t": "十年树木，百年树人\n意思是：培养人才是长远工程，教育须有耐心。", "bp": "十年树木，百年树人\n", "b": false, "li": false}]}, {"term": "因材施教", "en": "to teach according to each student's ability and interest", "ex": "全面科目编班让学生按强项修读G1、G2或G3科目，真正做到因材施教。", "paras": [{"t": "因材施教\n意思是：根据学生不同能力与兴趣施行教育。", "bp": "因材施教\n", "b": false, "li": false}], "q": "因材施教"}, {"term": "德才兼备", "en": "to have both good character and ability", "ex": "学校不只要培养成绩好的学生，更要培养德才兼备的未来公民。", "paras": [{"t": "德才兼备\n意思是：既有品德也有才能，强调全面发展。", "bp": "德才兼备\n", "b": false, "li": false}], "q": "德才兼备"}, {"term": "厚德载物", "en": "Only those with great virtue can bear great responsibilities.", "ex": "一个领袖必须先修好品德，所谓厚德载物，才能承担带领团队的重任。", "paras": [{"t": "厚德载物\n意思是：品德深厚，方能承担重任。", "bp": "厚德载物\n", "b": false, "li": false}], "q": "厚德载物"}, {"term": "学以致用", "en": "to put what one has learnt into practice", "ex": "应用学习项目让学生用编程解决实际问题，做到学以致用。", "paras": [{"t": "学以致用\n意思是：学习的目的在于实践与应用。", "bp": "学以致用\n", "b": false, "li": false}], "q": "学以致用"}, {"term": "不偏不倚", "en": "impartial and balanced; without leaning to either extreme", "ex": "教育既要重视成绩，也要重视品格，不偏不倚，才能培养全面发展的学生。", "paras": [{"t": "不偏不倚\n意思是：公正平衡，不走极端。", "bp": "不偏不倚\n", "b": false, "li": false}], "q": "不偏不倚"}, {"term": "天生我材必有用", "en": "Every person is born with talents that will be of use.", "ex": "这次考试成绩不理想，但他擅长设计，天生我材必有用，不必妄自菲薄。", "paras": [{"t": "天生我材必有用 ", "bp": "", "b": true, "li": false}, {"t": "意思是：每个人都有自己的长处，不应因成绩不理想而妄自菲薄。", "bp": "", "b": false, "li": false}]}, {"term": "每个人都是天才", "en": "Everybody is a genius. But if you judge a fish by its ability to climb a tree, it will live its whole life believing that it is stupid. — attributed to Einstein", "ex": "如果只用分数衡量学生，就忽略了每个人都是天才，只是擅长的领域不同。", "paras": [{"t": "每个人都是天才。但如果你用爬树的能力来判断一条鱼，它终其一生都会以为自己是愚蠢的。” ——爱因斯坦\n意思是：每个人都有独特的潜能与长处。如果用单一、不适合的标准（如只看学业成绩）来衡量所有学生，不仅不公平，还会扼杀孩子的自信心，导致他们无法发现真正的自我价值。", "bp": "每个人都是天才。但如果你用爬树的能力来判断一条鱼，它终其一生都会以为自己是愚蠢的。", "b": false, "li": false}]}]}], "arts": [{"title": "《联合早报》允许孩子失败 全人教育培养好情商(删减版)", "paras": [{"t": "        何谓全面发展的孩子？他们必须有自我意识，能够通过自我学习来约束自己，有自律，但仍保有孩子的独特气质，甚至包括孩童应有的活泼调皮的一面。拥有这两种基本的先天能力与特征的孩子，会发展自己感兴趣，并逐渐学会扩大自己的世界，包容周围的人。这将最终帮助他们成为一个全面发展和快乐的人。", "bp": "", "b": false, "li": false}, {"t": "        随着技术和学习方法的推进，在培养孩子高智商的竞赛中，情商的培养往往被忽视。很多孩童非常缺乏情商，这是与世界互动和联系的能力，必须加强。", "bp": "", "b": false, "li": false}, {"t": "       此外，由于家庭环境的影响，现今孩子在面对挫折或冲突时，父母或长者成为他们很好的保护伞。在逆境中，如果过度依赖父母或成年人解决问题，那会剥夺孩子观察事物、识别和应对棘手情况的能力。因此，他们无法做出良好回应，处理好自身的情绪。教养孩子的过程中，必须允许他们经历失败。成功的定义应该是：“今天比昨天更好。”", "bp": "", "b": false, "li": false}, {"t": "         一山还有一山高。没有人应该拿自己跟别人比较。相反的，通过了解自己的优缺点，才可以在优点的基础精益求精，在缺点上努力改进，成为更好、更成功的自己。", "bp": "         一山还有一山高", "b": false, "li": false}, {"t": "       如何培养孩子全面发展？", "bp": "", "b": false, "li": false}, {"t": "       首先要培养孩子快乐。当问及任何一个父母希望孩子得到什么时，最常见的答案是希望孩子健康快乐。研究表明，快乐会影响儿童的创造力、认知发展和情感成熟度，快乐是一种习得情绪。", "bp": "", "b": false, "li": false}, {"t": "        在孩子心中埋下快乐种子的一种方法是建立信心——鼓励探索，为孩子提供说话或分享观点的机会和实践，让他们自由地发现自己，喜欢什么和不喜欢什么，并一直支持他们。另一方面，父母需要学会让自己快乐，父母的快乐会感染孩子。", "bp": "", "b": false, "li": false}, {"t": "         其次要允许孩子失败。在国际学生评估项目（PISA）的一项研究表明，与全球同龄人相比，本地青少年学生更害怕失败。78%受访者同意或非常同意以下说法：“当面对失败时，让我开始怀疑自己的未来计划”，这比全球平均水平54%高出许多。  ", "bp": "", "b": false, "li": false}, {"t": "       我们可能需要抛弃过时的怕输文化，专注于实施全面教育方式，让孩子为学校之外的生活做好准备，用可转移的技能培养对学习的热爱和快乐，把他们塑造成负责任和可以自我管理的终身学习者。”", "bp": "", "b": false, "li": false}, {"t": "        这意味着父母允许孩子失败——人孰能无过，应学习宽恕。失败是让人做得更好和付出更多努力的垫脚石。学习态度正确，成功随之而来。", "bp": "", "b": false, "li": false}, {"t": "        除此之外，了解孩子的心理健康也非常重要。父母永远无法知道孩子的内心思想，不过，可以鼓励他们多参加社交活动，帮助孩子发展同理心，通过情绪调节学会以健康的方式表达自己的思想与情绪。", "bp": "", "b": false, "li": false}, {"t": "       全人教育包括为孩子培养一个更广泛、更包容的网络，创造一个良好的平台和机会，让他们互动、理解和培养对不同的学习、传统和文化的宽容。社交活动也教会孩子更有责任心，这是自律的一个特征。", "bp": "", "b": false, "li": false}, {"t": "        只根据成绩来衡量孩子的进步和发展会损害他们的自尊、自信和自我价值。教育部已确定21世纪技能力框架，这对孩子的发展和为未来做准备至关重要，其核心价值观包括：尊重、责任、坚韧、正直、关怀与和谐。父母首先必须认识到，学习不是一刀切的，学习成绩并不能决定青少年成年后的结果。", "bp": "", "b": false, "li": false}]}]}], "dict": [{"w": "效率", "py": "xiào lǜ", "cn": "做事的速度和效果。", "en": "efficiency", "ex": "新加坡的教育系统以高效率闻名。"}, {"w": "精英主义", "py": "jīng yīng zhǔ yì", "cn": "重视并集中培养少数最优秀的人。", "en": "elitism", "ex": "过去的教育制度带有精英主义色彩，只重视最会考试的学生。"}, {"w": "分流", "py": "fēn liú", "cn": "按成绩把学生分到不同的源流。", "en": "streaming", "ex": "实行了40年的分流制度，在2024年正式取消。"}, {"w": "源流", "py": "yuán liú", "cn": "学生被分配到的学习路线，如快捷、普通。", "en": "stream (academic track)", "ex": "全面科目编班后，中学不再有快捷和普通源流之分。"}, {"w": "因材施教", "py": "yīn cái shī jiào", "cn": "根据学生的能力和兴趣来教。", "en": "to teach according to ability", "ex": "老师了解每个学生的强项，才能因材施教。"}, {"w": "流失率", "py": "liú shī lǜ", "cn": "中途离开学校的学生所占的比例。", "en": "dropout rate", "ex": "新加坡的学生流失率一向很低。"}, {"w": "副作用", "py": "fù zuò yòng", "cn": "伴随主要作用而来的坏影响。", "en": "side effect", "ex": "分流制度带来了标签化等副作用。"}, {"w": "标签化", "py": "biāo qiān huà", "cn": "给人贴上固定的、负面的名称。", "en": "labelling", "ex": "标签化会让学生看低自己，失去信心。"}, {"w": "阶层", "py": "jiē céng", "cn": "社会上地位、收入相近的一群人。", "en": "social class", "ex": "教育应该帮助不同阶层的孩子都有向上的机会。"}, {"w": "固化", "py": "gù huà", "cn": "变得固定，难以改变。", "en": "to become entrenched", "ex": "如果穷孩子总是读不好的学校，社会阶层就会固化。"}, {"w": "系统性", "py": "xì tǒng xìng", "cn": "全面的、有整体规划的。", "en": "systemic; systematic", "ex": "政府推行系统性的教育改革，从小学到中学都有调整。"}, {"w": "心理暗示", "py": "xīn lǐ àn shì", "cn": "不知不觉中影响一个人想法的信息。", "en": "psychological suggestion", "ex": "“你不聪明”的心理暗示会限制学生的发展。"}, {"w": "交集", "py": "jiāo jí", "cn": "互相接触、来往。", "en": "intersection; contact", "ex": "不同源流的学生过去鲜少有交集。"}, {"w": "凝聚力", "py": "níng jù lì", "cn": "让大家团结在一起的力量。", "en": "cohesion", "ex": "混合班级有助增强社会凝聚力。"}, {"w": "疲于奔命", "py": "pí yú bēn mìng", "cn": "忙得筋疲力尽。", "en": "exhausted from rushing about", "ex": "为了多拿一分，学生疲于奔命地补习。"}, {"w": "牺牲", "py": "xī shēng", "cn": "放弃自己的利益。", "en": "to sacrifice", "ex": "有些学生为了考试牺牲睡眠，影响健康。"}, {"w": "唯成绩论", "py": "wéi chéng jì lùn", "cn": "只看考试成绩来评价学生。", "en": "grades-only mentality", "ex": "唯成绩论让学习变成了刷题。"}, {"w": "刷题", "py": "shuā tí", "cn": "大量重复地做练习题。", "en": "drilling practice questions", "ex": "他每晚刷题到深夜，却越来越讨厌数学。"}, {"w": "扼杀", "py": "è shā", "cn": "压制，使不能存在或发展。", "en": "to stifle", "ex": "过多的考试会扼杀学生学习的兴趣。"}, {"w": "自主学习", "py": "zì zhǔ xué xí", "cn": "自己主动安排和推动学习。", "en": "self-directed learning", "ex": "居家学习日让学生有时间自主学习感兴趣的科目。"}, {"w": "混合班级", "py": "hùn hé bān jí", "cn": "把不同程度的学生编在同一个班。", "en": "mixed form class", "ex": "在混合班级里，学生一起上美术、音乐和体育课。"}, {"w": "积分", "py": "jī fēn", "cn": "按成绩计算出来的分数。", "en": "score", "ex": "来自不同积分段的学生被编入同一个班级。"}, {"w": "促进", "py": "cù jìn", "cn": "推动，使更快发展。", "en": "to promote", "ex": "共同上课能促进不同背景学生的交流。"}, {"w": "融合", "py": "róng hé", "cn": "不同的东西合在一起。", "en": "integration", "ex": "混合班级有助学生的社交融合。"}, {"w": "灵活选科", "py": "líng huó xuǎn kē", "cn": "根据强弱项自由选择科目的程度。", "en": "flexible subject choice", "ex": "灵活选科让擅长科学的学生修读G3科学。"}, {"w": "合并", "py": "hé bìng", "cn": "把几个合在一起。", "en": "to merge", "ex": "N水准和O水准考试将合并为统一的全国考试。"}, {"w": "报考", "py": "bào kǎo", "cn": "报名参加考试。", "en": "to register for an exam", "ex": "学生根据修读的程度报考相应的试卷。"}, {"w": "废除", "py": "fèi chú", "cn": "取消，不再使用。", "en": "to abolish", "ex": "PSLE废除了总分制，改用积分等级制。"}, {"w": "模糊化", "py": "mó hu huà", "cn": "让界线变得不那么清楚。", "en": "to blur", "ex": "积分等级制模糊化了分数的细微差别。"}, {"w": "恶性竞争", "py": "è xìng jìng zhēng", "cn": "对大家都有害的过度竞争。", "en": "cut-throat competition", "ex": "减少考试次数，可以减少学生之间的恶性竞争。"}, {"w": "择校", "py": "zé xiào", "cn": "选择学校。", "en": "choosing a school", "ex": "新制度让学生有更多择校空间。"}, {"w": "腾出", "py": "téng chū", "cn": "空出来（时间或空间）。", "en": "to free up", "ex": "取消年中考试腾出了更多上课时间。"}, {"w": "探究式学习", "py": "tàn jiū shì xué xí", "cn": "学生主动提问、调查、找答案的学习方法。", "en": "inquiry-based learning", "ex": "老师用探究式学习，让学生自己设计实验找答案。"}, {"w": "社会契约", "py": "shè huì qì yuē", "cn": "社会成员之间共同遵守的约定和期望。", "en": "social compact", "ex": "教育改革有助重塑新加坡的社会契约。"}, {"w": "壁垒", "py": "bì lěi", "cn": "阻隔，难以越过的界线。", "en": "barrier", "ex": "混合班级有助打破阶层之间的壁垒。"}, {"w": "包容性", "py": "bāo róng xìng", "cn": "接纳不同的人和意见的程度。", "en": "inclusiveness", "ex": "新加坡希望建立一个更具包容性的社会。"}, {"w": "终身学习者", "py": "zhōng shēn xué xí zhě", "cn": "一辈子不断学习的人。", "en": "lifelong learner", "ex": "教育的目标是培养终身学习者，而不只是考试高手。"}, {"w": "多元", "py": "duō yuán", "cn": "多样的，不单一的。", "en": "diverse", "ex": "社会对成功的定义将更加多元。"}, {"w": "工艺教育", "py": "gōng yì jiào yù", "cn": "培养技术技能的教育，如工艺教育学院（ITE）。", "en": "technical education", "ex": "工艺教育的升学途径越来越宽广。"}, {"w": "回报", "py": "huí bào", "cn": "付出后得到的报答或收获。", "en": "reward; return", "ex": "技能型人才也应获得应有的尊重和回报。"}, {"w": "全人教育", "py": "quán rén jiào yù", "cn": "重视德、智、体、美、群各方面发展的教育。", "en": "whole-person education", "ex": "全人教育不只看成绩，也重视品格和身心健康。"}, {"w": "摆脱", "py": "bǎi tuō", "cn": "脱离（不好的情况）。", "en": "to break free from", "ex": "教育改革希望摆脱对学术成绩的过度依赖。"}, {"w": "品格", "py": "pǐn gé", "cn": "一个人的品德和性格。", "en": "character", "ex": "学校重视培养学生正直、负责的品格。"}, {"w": "审美", "py": "shěn měi", "cn": "欣赏和辨别美的能力。", "en": "aesthetic appreciation", "ex": "美术课培养学生的审美能力。"}, {"w": "基石", "py": "jī shí", "cn": "基础，最重要的部分。", "en": "cornerstone", "ex": "核心价值观是新加坡教育改革的基石。"}, {"w": "坚毅", "py": "jiān yì", "cn": "坚定有毅力。", "en": "resilience; perseverance", "ex": "外展训练营培养学生坚毅的精神。"}, {"w": "正直", "py": "zhèng zhí", "cn": "诚实，公正。", "en": "integrity", "ex": "正直的人不会为了分数而作弊。"}, {"w": "和谐", "py": "hé xié", "cn": "配合得当，相处融洽。", "en": "harmony", "ex": "多元种族的新加坡特别重视种族和谐。"}, {"w": "网络霸凌", "py": "wǎng luò bà líng", "cn": "在网上欺负、羞辱别人。", "en": "cyberbullying", "ex": "品格与公民教育课讨论如何应对网络霸凌。"}, {"w": "社区服务", "py": "shè qū fú wù", "cn": "为社区做的义务工作。", "en": "community service", "ex": "学生参加社区服务，到乐龄中心陪伴长者。"}, {"w": "换位思考", "py": "huàn wèi sī kǎo", "cn": "站在别人的立场想问题。", "en": "to put oneself in others' shoes", "ex": "学会换位思考，就能减少同学之间的误会。"}, {"w": "同理心", "py": "tóng lǐ xīn", "cn": "能体会别人感受的心。", "en": "empathy", "ex": "探访弱势家庭，培养了学生的同理心。"}, {"w": "冲突", "py": "chōng tū", "cn": "矛盾，争执。", "en": "conflict", "ex": "在团队活动中，学生学习如何解决冲突。"}, {"w": "课程辅助活动", "py": "kè chéng fǔ zhù huó dòng", "cn": "学校的课外活动（CCA），如体育队、制服团体。", "en": "co-curricular activities (CCA)", "ex": "课程辅助活动让学生学习领导力和团队精神。"}, {"w": "制服团体", "py": "zhì fú tuán tǐ", "cn": "穿制服的学生团体，如国家学生军团。", "en": "uniformed group", "ex": "她参加制服团体，学会了守纪律。"}, {"w": "领导力", "py": "lǐng dǎo lì", "cn": "带领一群人完成目标的能力。", "en": "leadership", "ex": "担任队长让他的领导力大大提升。"}, {"w": "批判性思维", "py": "pī pàn xìng sī wéi", "cn": "会分析、质疑、判断的思考能力。", "en": "critical thinking", "ex": "有批判性思维的人能分辨真假新闻。"}, {"w": "全球意识", "py": "quán qiú yì shí", "cn": "关心和了解世界上发生的事。", "en": "global awareness", "ex": "阅读国际新闻能培养学生的全球意识。"}, {"w": "跨文化", "py": "kuà wén huà", "cn": "涉及不同文化之间的。", "en": "cross-cultural", "ex": "跨文化技能让学生在全球化的环境中工作。"}, {"w": "模拟联合国", "py": "mó nǐ lián hé guó", "cn": "学生扮演各国代表讨论国际问题的活动。", "en": "Model United Nations", "ex": "她在模拟联合国中代表日本发言。"}, {"w": "抗压能力", "py": "kàng yā néng lì", "cn": "面对压力时能保持稳定的能力。", "en": "ability to cope with stress", "ex": "户外探险教育有助提升学生的抗压能力。"}, {"w": "户外探险", "py": "hù wài tàn xiǎn", "cn": "在野外进行的挑战活动，如攀岩、划船。", "en": "outdoor adventure", "ex": "户外探险让学生学会互相扶持。"}, {"w": "外展训练中心", "py": "wài zhǎn xùn liàn zhōng xīn", "cn": "让学生到野外露营、接受挑战的训练中心（OBS）。", "en": "Outward Bound Singapore (OBS)", "ex": "所有中三学生都要到外展训练中心参加野外露营。"}, {"w": "挑战极限", "py": "tiǎo zhàn jí xiàn", "cn": "尝试超越自己能力的上限。", "en": "to push one's limits", "ex": "攀上高墙时，他第一次挑战极限，克服了恐惧。"}, {"w": "毅力", "py": "yì lì", "cn": "坚持到底的意志。", "en": "perseverance", "ex": "五天的露营培养了学生的毅力。"}, {"w": "同侪", "py": "tóng chái", "cn": "同年龄、同身份的人。", "en": "peers", "ex": "学校设立同侪支持小组，让同学互相关心。"}, {"w": "焦虑", "py": "jiāo lǜ", "cn": "心里着急、紧张不安。", "en": "anxiety", "ex": "考试前感到焦虑是正常的，但要学会调适。"}, {"w": "鉴赏", "py": "jiàn shǎng", "cn": "欣赏并评价。", "en": "appreciation", "ex": "参观博物馆能提升学生的艺术鉴赏能力。"}, {"w": "精神世界", "py": "jīng shén shì jiè", "cn": "一个人的思想和心灵。", "en": "inner world", "ex": "音乐和艺术能丰富我们的精神世界。"}, {"w": "学无止境", "py": "xué wú zhǐ jìng", "cn": "学习没有尽头。", "en": "learning never ends", "ex": "学无止境，毕业后我们仍要不断学习。"}, {"w": "茁壮成长", "py": "zhuó zhuàng chéng zhǎng", "cn": "健康、强壮地成长。", "en": "to grow and thrive", "ex": "老师希望每个学生都能茁壮成长。"}, {"w": "内在", "py": "nèi zài", "cn": "内心的，自身具有的。", "en": "intrinsic; inner", "ex": "有内在的学习动力，学生才会主动求知。"}, {"w": "动力", "py": "dòng lì", "cn": "推动人前进的力量。", "en": "motivation", "ex": "兴趣是学习最大的动力。"}, {"w": "萌芽", "py": "méng yá", "cn": "植物发芽；比喻事物刚开始发展。", "en": "to sprout", "ex": "新的教育观念已经播种，需要时间萌芽。"}, {"w": "自我提升", "py": "zì wǒ tí shēng", "cn": "让自己变得更好。", "en": "self-improvement", "ex": "把学习看作自我提升之旅，而不只是与人竞争。"}, {"w": "拓宽", "py": "tuò kuān", "cn": "使变宽。", "en": "to broaden", "ex": "政府希望拓宽社会对成功的定义。"}, {"w": "请假", "py": "qǐng jià", "cn": "向公司或学校申请暂时不上班、不上课。", "en": "to take leave", "ex": "有家长在会考前请假，在家陪孩子温习。"}, {"w": "军备竞赛", "py": "jūn bèi jìng sài", "cn": "国家之间比赛扩充武器；比喻无止境的竞争。", "en": "arms race", "ex": "补习成了家长之间的“军备竞赛”，大家都怕孩子落后。"}, {"w": "落后", "py": "luò hòu", "cn": "比别人差，跟不上。", "en": "to fall behind", "ex": "很多家长担心孩子落后于人，于是让孩子不停补习。"}, {"w": "灵丹妙药", "py": "líng dān miào yào", "cn": "能治百病的神奇药，比喻能解决一切问题的办法。", "en": "panacea; magic cure", "ex": "文凭不再是通往成功的灵丹妙药。"}, {"w": "高等学府", "py": "gāo děng xué fǔ", "cn": "大学等高等教育机构。", "en": "institution of higher learning", "ex": "现在几乎每个人都毕业自高等学府。"}, {"w": "永无止境", "py": "yǒng wú zhǐ jìng", "cn": "永远没有尽头。", "en": "endless", "ex": "年轻人觉得自己困在永无止境的竞争中。"}, {"w": "放大", "py": "fàng dà", "cn": "使变大，使更明显。", "en": "to amplify", "ex": "社交媒体放大了人们的焦虑和攀比心理。"}, {"w": "分层", "py": "fēn céng", "cn": "分成不同的层级。", "en": "stratification", "ex": "社会分层加剧，让人更担心孩子的前途。"}, {"w": "攀比", "py": "pān bǐ", "cn": "和别人比较，不肯落后。", "en": "to compare oneself with others", "ex": "在社交媒体上攀比成绩，只会带来压力。"}, {"w": "嫉妒", "py": "jí dù", "cn": "看到别人比自己好而心里不舒服。", "en": "jealousy", "ex": "过度攀比容易引起嫉妒。"}, {"w": "怕输文化", "py": "pà shū wén huà", "cn": "害怕失败、不肯落后于人的社会风气。", "en": "kiasu culture", "ex": "怕输文化让补习风气越来越盛行。"}, {"w": "补习", "py": "bǔ xí", "cn": "在课外额外上课温习。", "en": "tuition", "ex": "不少小学生每周补习好几次。"}, {"w": "挂钩", "py": "guà gōu", "cn": "联系在一起。", "en": "to be linked to", "ex": "成功不应只和名校、文凭挂钩。"}, {"w": "光鲜亮丽", "py": "guāng xiān liàng lì", "cn": "外表漂亮、耀眼。", "en": "glamorous; shiny", "ex": "教育的目的不是光鲜亮丽的成绩，而是人的成长。"}, {"w": "割裂", "py": "gē liè", "cn": "把整体分开，切断联系。", "en": "to split apart", "ex": "品格教育和学术教育不应被割裂开来。"}, {"w": "滋养", "py": "zī yǎng", "cn": "供给养分，使成长。", "en": "to nourish", "ex": "好的教育是对孩子身心的完整滋养。"}, {"w": "健全", "py": "jiàn quán", "cn": "完整、没有缺陷。", "en": "sound; well-rounded", "ex": "决定孩子一生的，是健全的人格。"}, {"w": "人格", "py": "rén gé", "cn": "一个人的品格和性格。", "en": "personality; character", "ex": "老师重视培养学生健全的人格。"}, {"w": "隐性代价", "py": "yǐn xìng dài jià", "cn": "不容易被看见的损失。", "en": "hidden cost", "ex": "只顾成绩，可能要付出心理健康的隐性代价。"}, {"w": "本末倒置", "py": "běn mò dào zhì", "cn": "把重要的和次要的弄颠倒了。", "en": "to put the cart before the horse", "ex": "为了分数而牺牲健康，是本末倒置。"}, {"w": "事与愿违", "py": "shì yǔ yuàn wéi", "cn": "事情的发展与愿望相反。", "en": "things turn out contrary to one's wishes", "ex": "父母逼得太紧，结果事与愿违，孩子反而讨厌读书。"}, {"w": "适应能力", "py": "shì yìng néng lì", "cn": "适应新环境、新变化的能力。", "en": "adaptability", "ex": "未来的职场更看重员工的适应能力。"}, {"w": "协作精神", "py": "xié zuò jīng shén", "cn": "愿意与人合作的态度。", "en": "spirit of collaboration", "ex": "小组专题作业能培养学生的协作精神。"}, {"w": "潜质", "py": "qián zhì", "cn": "潜在的素质和能力。", "en": "potential", "ex": "老师发现她有当领袖的潜质。"}, {"w": "瞬息万变", "py": "shùn xī wàn biàn", "cn": "在很短的时间里变化很多。", "en": "ever-changing", "ex": "在瞬息万变的世界里，学生要学会不断适应。"}, {"w": "挫折", "py": "cuò zhé", "cn": "失败，不顺利。", "en": "setback", "ex": "遇到挫折时，不要轻易放弃。"}, {"w": "高分低能", "py": "gāo fēn dī néng", "cn": "考试分数高，实际能力低。", "en": "high scores but low real-world ability", "ex": "只会考试不会做事，就是高分低能。"}, {"w": "草莓族", "py": "cǎo méi zú", "cn": "比喻外表光鲜、却经不起压力的年轻人。", "en": "\"strawberry generation\" (easily bruised under pressure)", "ex": "父母过度保护，孩子可能变成经不起挫折的草莓族。"}, {"w": "从容", "py": "cóng róng", "cn": "不慌不忙，很镇定。", "en": "calm and composed", "ex": "有心理韧性的学生能从容面对考试失利。"}, {"w": "风浪", "py": "fēng làng", "cn": "比喻艰难危险的遭遇。", "en": "storms (of life)", "ex": "教育要培养能面对生活风浪的年轻一代。"}, {"w": "心理韧性", "py": "xīn lǐ rèn xìng", "cn": "遇到困难后能重新站起来的心理力量。", "en": "psychological resilience", "ex": "心理韧性帮助学生在失败后重新振作。"}, {"w": "防波堤", "py": "fáng bō dī", "cn": "挡住海浪的堤坝；比喻保护的屏障。", "en": "breakwater; protective barrier", "ex": "心理韧性是保护学生心理健康的防波堤。"}, {"w": "失利", "py": "shī lì", "cn": "失败，没有成功。", "en": "to suffer a setback", "ex": "一次考试失利不代表人生失败。"}, {"w": "走向极端", "py": "zǒu xiàng jí duān", "cn": "做出非常偏激、危险的事。", "en": "to go to extremes", "ex": "学校及早辅导学生，避免他们因压力走向极端。"}, {"w": "可转移的技能", "py": "kě zhuǎn yí de jì néng", "cn": "能在不同场合、不同工作中使用的能力，如沟通、解决问题。", "en": "transferable skills", "ex": "沟通和解决问题都是可转移的技能。"}, {"w": "自我管理", "py": "zì wǒ guǎn lǐ", "cn": "自己安排和约束自己。", "en": "self-management", "ex": "中学生要学会自我管理时间。"}, {"w": "直接招生计划", "py": "zhí jiē zhāo shēng jì huà", "cn": "学校根据学生的特长（如体育、艺术）直接录取的计划（DSA）。", "en": "Direct School Admission (DSA)", "ex": "他通过直接招生计划，凭篮球特长进入理想中学。"}, {"w": "跳板", "py": "tiào bǎn", "cn": "比喻帮助人进一步发展的条件。", "en": "springboard", "ex": "教育不是负担，而是通往未来的跳板。"}, {"w": "政府科技局", "py": "zhèng fǔ kē jì jú", "cn": "新加坡政府负责数码科技的机构（GovTech）。", "en": "GovTech", "ex": "政府科技局招聘工程师时，最看重编程和解决问题的能力。"}, {"w": "录取", "py": "lù qǔ", "cn": "选定并接收（学生或员工）。", "en": "to admit; to accept", "ex": "学校录取学生不再只看考试成绩。"}, {"w": "居家学习日", "py": "jū jiā xué xí rì", "cn": "学生在家自主学习的日子。", "en": "Home-Based Learning day", "ex": "居家学习日里，她用时间学习弹吉他。"}, {"w": "程序编写", "py": "chéng xù biān xiě", "cn": "写电脑程序；编程。", "en": "programming", "ex": "他利用自发学习时间学习程序编写。"}, {"w": "全方位", "py": "quán fāng wèi", "cn": "各方面的。", "en": "all-round", "ex": "学校活动让学生的才能得到全方位的发展。"}, {"w": "摇篮", "py": "yáo lán", "cn": "比喻培养人才的地方。", "en": "cradle", "ex": "课程辅助活动是培养学生领袖才能的摇篮。"}, {"w": "体验式学习", "py": "tǐ yàn shì xué xí", "cn": "通过亲身参与和经历来学习。", "en": "experiential learning", "ex": "到乐龄中心服务是一种体验式学习。"}, {"w": "社会责任感", "py": "shè huì zé rèn gǎn", "cn": "觉得自己应该为社会做事的心。", "en": "sense of social responsibility", "ex": "参与社区服务能培养学生的社会责任感。"}, {"w": "立德树人", "py": "lì dé shù rén", "cn": "培养品德，教育成才。", "en": "to cultivate virtue and nurture talent", "ex": "学校的使命是立德树人，培养有品德的人才。"}, {"w": "自律", "py": "zì lǜ", "cn": "自己约束自己。", "en": "self-discipline", "ex": "自律的学生会主动完成功课，不需要父母催促。"}, {"w": "活泼", "py": "huó pō", "cn": "生动，不呆板。", "en": "lively", "ex": "孩子活泼调皮是天性，不必过分压制。"}, {"w": "调皮", "py": "tiáo pí", "cn": "顽皮，爱开玩笑。", "en": "mischievous", "ex": "全面发展的孩子仍然可以保有调皮的一面。"}, {"w": "包容", "py": "bāo róng", "cn": "宽容接纳。", "en": "to embrace; to be tolerant", "ex": "学会包容身边不同背景的同学。"}, {"w": "情商", "py": "qíng shāng", "cn": "管理情绪、与人相处的能力。", "en": "emotional intelligence (EQ)", "ex": "在追求高智商的竞赛中，情商的培养往往被忽视。"}, {"w": "保护伞", "py": "bǎo hù sǎn", "cn": "比喻保护人的力量。", "en": "protective umbrella", "ex": "父母不能永远做孩子的保护伞。"}, {"w": "逆境", "py": "nì jìng", "cn": "不顺利的处境。", "en": "adversity", "ex": "在逆境中学会自己解决问题，孩子才会成长。"}, {"w": "剥夺", "py": "bō duó", "cn": "强行夺走。", "en": "to deprive", "ex": "过度保护会剥夺孩子解决问题的机会。"}, {"w": "棘手", "py": "jí shǒu", "cn": "事情难办，不容易处理。", "en": "thorny; difficult", "ex": "孩子要学会自己应对棘手的情况。"}, {"w": "一山还有一山高", "py": "yī shān hái yǒu yī shān gāo", "cn": "比喻强中更有强中手，不必和别人比较。", "en": "there is always someone better", "ex": "一山还有一山高，与其和别人比，不如和昨天的自己比。"}, {"w": "精益求精", "py": "jīng yì qiú jīng", "cn": "已经很好了，还要求更好。", "en": "to strive for perfection", "ex": "在优点的基础上精益求精，就能成为更好的自己。"}, {"w": "创造力", "py": "chuàng zào lì", "cn": "想出新东西、新办法的能力。", "en": "creativity", "ex": "快乐能影响儿童的创造力和认知发展。"}, {"w": "感染", "py": "gǎn rǎn", "cn": "用情绪影响别人。", "en": "to infect (emotionally)", "ex": "父母的快乐会感染孩子。"}, {"w": "受访者", "py": "shòu fǎng zhě", "cn": "接受访问或调查的人。", "en": "respondent", "ex": "78%的受访者表示，失败让他们怀疑自己的未来计划。"}, {"w": "人孰能无过", "py": "rén shú néng wú guò", "cn": "人谁能没有过错呢？", "en": "to err is human", "ex": "人孰能无过，犯错后改正就好。"}, {"w": "宽恕", "py": "kuān shù", "cn": "原谅。", "en": "to forgive", "ex": "学会宽恕别人，也学会原谅自己的失败。"}, {"w": "垫脚石", "py": "diàn jiǎo shí", "cn": "比喻帮助人向上的东西。", "en": "stepping stone", "ex": "失败是通往成功的垫脚石。"}, {"w": "情绪调节", "py": "qíng xù tiáo jié", "cn": "控制和调整自己的情绪。", "en": "emotional regulation", "ex": "学会情绪调节，生气时就不会说出伤人的话。"}, {"w": "宽容", "py": "kuān róng", "cn": "心胸宽大，能容忍不同。", "en": "tolerance", "ex": "与不同文化的同学相处，能培养我们的宽容。"}, {"w": "自尊", "py": "zì zūn", "cn": "尊重自己，不愿被别人看不起。", "en": "self-esteem", "ex": "只用成绩衡量孩子，会伤害他们的自尊。"}, {"w": "一刀切", "py": "yī dāo qiē", "cn": "用同一种办法处理所有不同的情况。", "en": "one-size-fits-all", "ex": "学习方式不能一刀切，每个孩子都不同。"}], "quiz": [{"q": "新加坡过去的分流制度带来了哪些副作用？", "o": ["标签化、社会阶层固化，以及巨大的学业竞争压力", "学生流失率大幅上升", "教育质量明显下降", "学生没有机会参加课外活动"], "a": 0, "why": "重点：分流保证了教育质量和低流失率，但带来“标签化”效应、社会阶层固化和巨大的竞争压力。"}, {"q": "全面科目编班从哪一年起全面取消中学分流？科目按什么分级？", "o": ["2024年起；科目按难度分为G1（基础）、G2（标准）、G3（高级）", "2027年起；科目分为快捷、普通学术、普通工艺", "2023年起；科目分为AL1至AL8", "2024年起；科目分为N水准和O水准"], "a": 0, "why": "重点：不再有“快捷”“普通”之分；学生根据强项修读G3，弱项修读G1或G2。"}, {"q": "混合班级的主要目的是什么？", "o": ["让不同积分段的学生一起上美术、音乐、体育等课，促进社交融合", "让成绩好的学生帮助成绩差的学生补习", "减少每班的学生人数", "让学生自己选择班主任"], "a": 0, "why": "重点：混合班级促进社交融合，长远有助打破社会阶层壁垒，建立更具包容性和凝聚力的社会。"}, {"q": "2027年起，全国考试有什么改变？", "o": ["N水准和O水准合并为统一的“新加坡—剑桥中学教育证书（SEC）”考试", "取消所有全国考试", "O水准考试改为在中三举行", "学生只需考英文和数学"], "a": 0, "why": "重点：所有中四学生参加同一场全国考试，按修读的G1/G2/G3报考相应试卷。"}, {"q": "PSLE改用积分等级制（AL）的目的是什么？", "o": ["模糊化分数的细微差别，减少非必要的恶性竞争，让学生有更多择校空间", "让考试变得更难", "让学生的分数精确到小数点", "取消小学离校考试"], "a": 0, "why": "重点：废除T-score，分为AL1至AL8八个等级；例如230分和232分不再有区别。"}, {"q": "取消年中考试后，腾出的时间用来做什么？", "o": ["进行更具互动性的探究式学习，培养自主学习的习惯", "增加更多的测验和练习", "让学生提早放学去补习", "延长学校假期"], "a": 0, "why": "重点：焦点从“考试成绩”转移到“学习过程”；教育部强调，目的不是减轻压力，而是加强全人教育。"}, {"q": "“全面发展”的核心框架“21世纪技能”中，哪一项是教育改革的基石？", "o": ["核心价值观与品格（德）", "思维与适应能力（智）", "身体素质与心理韧性（体）", "审美与鉴赏能力（美）"], "a": 0, "why": "重点：核心价值观包括尊重、责任感、坚毅、正直、关爱、和谐；通过品格与公民教育（CCE）和德育在于行动（VIA）落实。"}, {"q": "学校怎样落实“体”——身体素质与心理韧性？", "o": ["所有中三学生参加外展训练中心的野外露营，并设立同侪支持结构", "让学生每天跑步五公里", "取消所有体育课", "只让体育队队员参加户外活动"], "a": 0, "why": "重点：户外探险教育培养毅力；心理健康教育教导学生如何应对焦虑。"}, {"q": "黄总理形容许多家长眼中的教育像什么？", "o": ["一场“军备竞赛”，担心孩子落后而无休止地补习", "一场轻松的旅行", "一份必须完成的作业", "一张通往成功的灵丹妙药"], "a": 0, "why": "重点：文凭曾被视为成功的灵丹妙药；如今年轻人觉得困在永无止境的竞争中，社交媒体也放大了攀比和嫉妒。"}, {"q": "下列哪一项【不是】资料提到的社会问题？", "o": ["学校课程太少，学生没有足够的功课", "过度重视成绩，忽略孩子整体成长", "“怕输文化”加剧教育焦虑", "成功的定义过于狭窄"], "a": 0, "why": "重点：三大社会问题——过度重视成绩、怕输文化与补习风气、成功只与名校文凭高薪挂钩。"}, {"q": "资料引用蔡元培的话说明什么？", "o": ["决定孩子一生的不是学习成绩，而是健全的人格", "学历是成功最重要的条件", "孩子越早补习越好", "只有北大毕业生才能成功"], "a": 0, "why": "重点：教育的目的是人的成长；若成绩亮眼却付出心理健康的代价，就是本末倒置。"}, {"q": "为什么说“高分低能”的“草莓族”难以在现实世界生存？", "o": ["他们只会应付考试，经不起挫折，缺乏心理韧性", "他们的成绩太差", "他们不愿意读大学", "他们太早出来工作"], "a": 0, "why": "重点：“跌倒了再爬起来”的心理韧性是保护学生心理健康的“防波堤”。"}, {"q": "下列哪一项是拓宽成功定义的例子？", "o": ["政府科技局招聘工程师时，以编程和解决问题的能力为主要录取考量", "大学只录取考试成绩最高的学生", "公共部门只看文凭聘请员工", "学校只奖励考第一名的学生"], "a": 0, "why": "重点：直接招生计划肯定考试以外的才能；黄总理说“教育不是负担，而是跳板”。"}, {"q": "PISA研究显示本地青少年对失败的态度怎样？", "o": ["比全球同龄人更害怕失败，78%同意失败会让他们怀疑未来计划（全球平均54%）", "比全球同龄人更不怕失败", "和全球平均水平一样", "只有少数学生害怕失败"], "a": 0, "why": "重点：要抛弃过时的怕输文化，允许孩子失败——失败是让人做得更好的垫脚石。"}]}, "t4": {"parts": [{"bg": [{"t": "新加坡政府在多年前就提出将国家打造成一个优雅社会的愿景，并开展了各种形式的礼貌与行善运动。然而，随着生活步伐的加快和竞争压力的增加，人们容易心浮气躁、事事以个人为中心。虽然政府致力于推动优雅社会，但社会中仍有不少不优雅的行为成为绊脚石。例如，近期社交媒体上流传一段地铁风波视频：一名男子因不满车厢内一孩童活泼乱跳，大声斥责甚至羞辱其母亲“算什么母亲”。此外，近年来社会上也频频发生公然欺负、辱骂他人的事件，肇事者态度嚣张高傲，这些缺乏公德心和同情心的行为引发了公众的强烈反感与深思。", "bp": "", "b": false, "li": false}], "rows": [{"label": "社会问题", "kind": "challenge", "paras": [{"t": "公共场所缺乏公德心：人们在用餐后留下杯盘狼藉的桌面，不主动归还碗碟；用纸巾霸占座位；高楼抛物及乱丢垃圾；在公共场合不排队甚至插队。", "bp": "公共场所缺乏公德心", "b": false, "li": true}, {"t": "公共交通上的不文明行为：在地铁或巴士上大声喧哗、口出污言秽语；坐在列车地板上或一人霸占多个座位；滥用优先座位（如闭目养神，不让座给有需要的人）。此外，电动代步工具使用者与行人争夺空间，也引发了不少摩擦。", "bp": "公共交通上的不文明行为", "b": false, "li": true}, {"t": "心态冷漠与自私自利：国人生活忙碌自顾不暇，导致社会出现冷漠、缺乏正义感（如明哲保身、袖手旁观）的现象。许多现代家庭生养少，孩子被溺爱，容易养成自私自我的性格。", "bp": "心态冷漠与自私自利", "b": false, "li": true}, {"t": "家庭内外“双重标准”：有些人在家里或私人空间里对冒犯行为（如缺乏尊重的举动）视而不见、淡化处理，让孩子误以为只要不在公共场合就可以为所欲为。私人领域缺乏明确约束，最终导致这些偏差行为反映到社会层面。", "bp": "家庭内外“双重标准”", "b": false, "li": true}, {"t": "自我认知偏差：调查显示，有43%的受访国人自认为待人亲切，觉得自己的行为比他人更加优雅，这种认知与实际社会现象存在落差。", "bp": "自我认知偏差", "b": false, "li": true}]}, {"label": "政府政策", "kind": "action", "paras": [{"t": "食客归还托盘和餐具计划：国家环境局强制规定在小贩中心、咖啡店和食阁用餐的公众必须自行归还托盘和清理桌面垃圾。政府提供补贴协助业者安装归还设备，并对违例者实施警告或罚款。", "bp": "食客归还托盘和餐具计划", "b": false, "li": true}, {"t": "新加坡行善运动与礼貌宣导：鼓励国人日行一善、乐善好施（如通过慈善晚宴鼓励慷慨解囊）。在地铁和巴士增添新标志与海报，或是通过广播提醒乘客放低音量、不要坐在地板上、注意礼让等。", "bp": "新加坡行善运动与礼貌宣导", "b": false, "li": true}, {"t": "完善基础设施彰显人文关怀：建设四通八达的有盖走廊、无障碍设施（如轮椅厕间、盲文按钮、长者友好步道）；公共交通系统增加USB充电口、轮椅专区以及为失智者设计的鲜明路标等，从硬件上为优雅社会提供支撑。", "bp": "完善基础设施彰显人文关怀", "b": false, "li": true}]}, {"label": "为何要打造优雅社会？", "kind": "impact", "paras": [{"t": "构建温情社会：打造一个充满温情、互助互爱的居住环境，减少社会摩擦。", "bp": "构建温情社会", "b": false, "li": true}, {"t": "提升国际形象：让新加坡在全球不仅以经济和安全著称，还能因国民素质美名远播。", "bp": "提升国际形象", "b": false, "li": true}, {"t": "发扬传统美德：传承和发扬“忠孝仁爱、礼义廉耻”等优良传统价值观。", "bp": "发扬传统美德", "b": false, "li": true}, {"t": "避免过度依赖法律：若单靠法律途径解决行人与代步工具等社会摩擦，必然造成繁文缛节，失去优雅社会的初衷。只有提升内在素质，才能水到渠成地维持秩序。", "bp": "避免过度依赖法律", "b": false, "li": true}]}, {"label": "如何打造优雅社会？", "kind": "action", "paras": [{"t": "加强家庭教育（立足之本）：公共场合的教养根源于家庭。父母必须在日常生活中以身作则，从小确立清晰的行为界限与后果机制。不可将不礼貌行为视为“家务事”而合理化，让孩子在耳濡目染中学会尊重与责任。", "bp": "加强家庭教育（立足之本）", "b": false, "li": true}, {"t": "学校融入德育与实践：学校应将公德心纳入品德与公民课程，提升学生的素质与修养，并让学生从小参与打扫卫生、用餐后归还碗碟等实践，使其成为一种自觉习惯。", "bp": "学校融入德育与实践", "b": false, "li": true}, {"t": "政府柔性劝说与正面强化（Positive Reinforcement）：在强制罚款之外，政府或机构（如职总富食客）应通过设立榜样和激励机制，引导公众自发地实践公德行为。", "bp": "政府柔性劝说与正面强化（Positive Reinforcement）", "b": false, "li": true}, {"t": "媒体宣传与引导：通过电视台、报刊等媒体制作专题节目或开辟专栏，大力宣传优雅社会的理念与应有的言行举止，引导社会舆论。", "bp": "媒体宣传与引导", "b": false, "li": true}, {"t": "互相体谅与温和沟通：在公共空间发生冲突（如拥挤车厢内的摩擦）时，一方应主动约束自身或孩童行为，另一方则应给予体谅，用温和的语气沟通，避免出言羞辱激化矛盾。", "bp": "互相体谅与温和沟通", "b": false, "li": true}]}, {"label": "可用词句", "kind": "ref", "paras": [{"t": "1.文明之光，始于足下，成于人心。", "bp": "", "b": false, "li": false}, {"t": "意思：文明从个人的小行动开始，真正的关键在于内心的自觉。", "bp": "", "b": false, "li": false}, {"t": "2.一人自律，是修养；人人自律，便是文明。", "bp": "", "b": false, "li": false}, {"t": "意思：一个人守规矩是个人品格；大家都守规矩，社会就文明。", "bp": "", "b": false, "li": false}, {"t": "3. 当规则内化为习惯，秩序便水到渠成。", "bp": "", "b": false, "li": false}, {"t": "意思：当人们自然而然遵守规则，社会秩序就会自然形成。", "bp": "", "b": false, "li": false}, {"t": "4. 文明不是口号，而是日常的坚持。", "bp": "", "b": false, "li": false}, {"t": "意思：文明不是说说而已，而是体现在每天的实际行动中。", "bp": "", "b": false, "li": false}, {"t": "5. 修身立德，是个人之本；众志成城，是国家之基。", "bp": "", "b": false, "li": false}, {"t": "意思：个人要先培养品德；国家的强大建立在全民团结之上。", "bp": "", "b": false, "li": false}, {"t": "6. 于细微处见精神，于平凡中见伟大。", "bp": "", "b": false, "li": false}, {"t": "意思：修养往往体现在小事中；伟大来自平凡的坚持。", "bp": "", "b": false, "li": false}, {"t": "7. 今日之自觉，成就明日之秩序。", "bp": "", "b": false, "li": false}, {"t": "意思：今天自觉守规矩，明天社会就更有秩序。", "bp": "", "b": false, "li": false}, {"t": "8. 推己及人，人心自然向善。人心向善，方能国泰民安。", "bp": "", "b": false, "li": false}, {"t": "意思:多为他人着想，社会就会善良；社会善良，国家就安定。", "bp": "", "b": false, "li": false}, {"t": "9. 不以善小而不为", "bp": "", "b": false, "li": false}, {"t": "意思：不要因为事情小就不去做。", "bp": "", "b": false, "li": false}, {"t": "10. 身体力行，胜于空谈说教。", "bp": "", "b": true, "li": false}, {"t": "意思：用行动实践比只说不做更有说服力。", "bp": "", "b": false, "li": false}], "items": [{"term": "文明之光", "en": "The light of civility begins with small steps and is completed in people's hearts.", "ex": "在地铁上主动让座、轻声说话，这些小事正说明：文明之光，始于足下，成于人心。", "box": "文明之光，始于足下，成于人心", "paras": [{"t": "1.文明之光，始于足下，成于人心。", "bp": "", "b": false, "li": false}, {"t": "意思：文明从个人的小行动开始，真正的关键在于内心的自觉。", "bp": "", "b": false, "li": false}]}, {"term": "一人自律", "en": "One person's self-discipline is personal refinement; everyone's self-discipline is civilisation.", "ex": "用餐后主动归还托盘看似小事，但一人自律，是修养；人人自律，便是文明。", "box": "一人自律，是修养；人人自律，便是文明", "paras": [{"t": "2.一人自律，是修养；人人自律，便是文明。", "bp": "", "b": false, "li": false}, {"t": "意思：一个人守规矩是个人品格；大家都守规矩，社会就文明。", "bp": "", "b": false, "li": false}]}, {"term": "当规则内化为习惯", "en": "When rules become habits, order follows naturally.", "ex": "如今许多国人吃完饭自然会归还托盘，可见当规则内化为习惯，秩序便水到渠成。", "box": "当规则内化为习惯，秩序便水到渠成", "paras": [{"t": "3. 当规则内化为习惯，秩序便水到渠成。", "bp": "", "b": false, "li": false}, {"t": "意思：当人们自然而然遵守规则，社会秩序就会自然形成。", "bp": "", "b": false, "li": false}]}, {"term": "文明不是口号", "en": "Civility is not a slogan but everyday persistence.", "ex": "礼貌运动办了多年，我们更要明白：文明不是口号，而是日常的坚持。", "box": "文明不是口号，而是日常的坚持", "paras": [{"t": "4. 文明不是口号，而是日常的坚持。", "bp": "", "b": false, "li": false}, {"t": "意思：文明不是说说而已，而是体现在每天的实际行动中。", "bp": "", "b": false, "li": false}]}, {"term": "修身立德", "en": "Cultivating virtue is the root of the individual; unity is the foundation of the nation.", "ex": "打造优雅社会，既要每个人修养品德，也要全民团结，正所谓修身立德，是个人之本；众志成城，是国家之基。", "box": "修身立德，是个人之本；众志成城，是国家之基", "paras": [{"t": "5. 修身立德，是个人之本；众志成城，是国家之基。", "bp": "", "b": false, "li": false}, {"t": "意思：个人要先培养品德；国家的强大建立在全民团结之上。", "bp": "", "b": false, "li": false}]}, {"term": "于细微处见精神", "en": "Character shows in small details; greatness shows in ordinary persistence.", "ex": "清洁工人每天默默打扫小贩中心，于细微处见精神，于平凡中见伟大。", "box": "于细微处见精神，于平凡中见伟大", "paras": [{"t": "6. 于细微处见精神，于平凡中见伟大。", "bp": "", "b": false, "li": false}, {"t": "意思：修养往往体现在小事中；伟大来自平凡的坚持。", "bp": "", "b": false, "li": false}]}, {"term": "今日之自觉", "en": "Today's self-awareness builds tomorrow's order.", "ex": "今天你在巴士站自觉排队，明天社会就多一分秩序，所谓今日之自觉，成就明日之秩序。", "box": "今日之自觉，成就明日之秩序", "paras": [{"t": "7. 今日之自觉，成就明日之秩序。", "bp": "", "b": false, "li": false}, {"t": "意思：今天自觉守规矩，明天社会就更有秩序。", "bp": "", "b": false, "li": false}]}, {"term": "推己及人", "en": "Treat others as you would like to be treated; when hearts turn to kindness, the nation is at peace.", "ex": "在拥挤的车厢里多体谅带孩子的母亲，就是推己及人。推己及人，人心自然向善。人心向善，方能国泰民安。", "box": "推己及人，人心自然向善。人心向善，方能国泰民安", "paras": [{"t": "8. 推己及人，人心自然向善。人心向善，方能国泰民安。", "bp": "", "b": false, "li": false}, {"t": "意思:多为他人着想，社会就会善良；社会善良，国家就安定。", "bp": "", "b": false, "li": false}]}, {"term": "不以善小而不为", "en": "Do not fail to do good just because it is small.", "ex": "帮邻居长者提菜、随手捡起地上的垃圾，都是不以善小而不为的表现。", "paras": [{"t": "9. 不以善小而不为", "bp": "", "b": false, "li": false}, {"t": "意思：不要因为事情小就不去做。", "bp": "", "b": false, "li": false}]}, {"term": "身体力行", "en": "Doing it yourself is more convincing than preaching.", "ex": "父母想教孩子守秩序，就要自己先排队，因为身体力行，胜于空谈说教。", "box": "身体力行，胜于空谈说教", "paras": [{"t": "10. 身体力行，胜于空谈说教。", "bp": "", "b": true, "li": false}, {"t": "意思：用行动实践比只说不做更有说服力。", "bp": "", "b": false, "li": false}]}]}], "arts": [{"title": "《联合早报》交流站：从地铁风波看公共教养", "paras": [{"t": "          近日，一段在地铁车厢内拍摄的视频在社交媒体上流传，引发广泛关注。视频中，一名男子因不满一名女子放任孩子在车厢内乱蹦乱跳，上前质问并斥责她“算什么母亲”。视频曝光后，网民的评论迅速呈现两极分化。", "bp": "", "b": false, "li": false}, {"t": "        有些网民支持男子的立场，认为家长在公共交通里有责任管束孩子，避免打扰他人；另一部分网民则提出，孩子的行为未必全是“管教不力”所致，有些孩子天性活泼好动，或可能存在自闭症等特殊情况，在拥挤嘈杂的车厢里，容易受到环境刺激，难以控制自身行为。在这种情况下，家长除了承受管教的压力，还可能陷入不被他人理解的困境。", "bp": "", "b": false, "li": false}, {"t": "           这起看似平常的争执，折射出城市公共空间的常见议题：地铁作为公共场所，须要人们共同维护秩序与乘车体验。孩子活泼本无可厚非，但在密闭车厢内奔跑跳动，容易干扰他人，这不仅关系到公共礼仪，也是家长应当承担的社会责任。", "bp": "", "b": false, "li": false}, {"t": "       然而，表达方式同样关键。视频中男子提高音量、出言羞辱的做法，并未真正解决问题，反而将焦点从行为转向情绪，加剧对立局面。在公共冲突中，若仅以指责回应，往往难以促进理解，只会激化矛盾。", "bp": "", "b": false, "li": false}, {"t": "         这段视频之所以引发热议，或许是因为它反映出我们身处的城市日益拥挤，而个人的边界意识也越发敏感。我们既希望个人空间不受侵扰，又不得不学习与不同背景、不同需求的人共同相处。", "bp": "", "b": false, "li": false}, {"t": "        因此，当面对类似情境，若一方能主动约束，而另一方能给予体谅，沟通时语气多一分温和，许多矛盾便能悄然化解。", "bp": "", "b": false, "li": false}, {"t": "《联合早报》交流站：从家里开始培养正确价值观\n", "bp": "", "b": true, "li": false}, {"t": "        《联合早报·交流站》于1月23日刊登的《从地铁风波看公共教养》一文中，讨论地铁上儿童行为、家长管教以及旁人介入方式，引发公众对公共秩序与沟通方式的反思。读后深有同感，也促使我进一步思考：公共场合的失序行为，根源往往并不只在当下冲突，而是在家庭与私人空间中更早形成的行为规范。", "bp": "", "b": false, "li": false}, {"t": "           社会普遍谴责诸如竖中指、偷拍他人等冒犯行为。然而，当类似行为发生在家中、亲属之间或朋友圈内时，往往被视为“家务事”，被淡化处理，甚至被合理化。久而久之，这种双重标准容易让孩子误以为，只要不在公共场合，缺乏尊重的行为便无伤大雅。", "bp": "", "b": false, "li": false}, {"t": "        对施加者而言，这些行为或许微不足道，但对受害者来说，却可能造成深刻的心理伤害，破坏人际关系，并在长期得不到正视与修复的情况下，留下持续的情绪创伤。由于私人领域常被视为非执法机关可介入的范围，受害者往往缺乏申诉与保护的管道，最终可能演变为焦虑、抑郁或社交退缩，而这些问题终究会反映到社会层面。", "bp": "", "b": false, "li": false}, {"t": "       孩子学习价值观，不仅来自学校教育，更重要的是来自家庭中的行为示范。当私人空间缺乏清晰的界限与后果机制时，对尊重与责任的教导便失去力量。现实中，人们往往对法律权威心存敬畏，却容易忽视家庭内部的规范，因为后者缺乏一致而明确的约束。", "bp": "", "b": false, "li": false}, {"t": "       因此，一个有礼、有分寸、有责任感的社会，其根基应从家庭与私人环境开始建立。家庭中的道德指引、行为纠正和真诚道歉，应延伸到公共行为之中。对身心健全的孩子而言，早期家庭教育尤为关键，让尊重与良好行为在起跑线上就建立，避免在日后形成难以弥补的行为偏差。凡是在公共场合不可接受的行为，也不应在私人领域被合理化，因为品格正是在这里形成，公民的价值判断亦由此奠基。", "bp": "", "b": false, "li": false}]}]}], "dict": [{"w": "愿景", "py": "yuàn jǐng", "cn": "对未来的美好期望和目标。", "en": "vision", "ex": "政府提出打造优雅社会的愿景。"}, {"w": "礼貌", "py": "lǐ mào", "cn": "待人谦虚、恭敬的态度和言行。", "en": "courtesy", "ex": "在公共场合说话要有礼貌。"}, {"w": "行善运动", "py": "xíng shàn yùn dòng", "cn": "鼓励人们做好事、帮助别人的全国活动。", "en": "Kindness Movement", "ex": "新加坡行善运动鼓励国人日行一善。"}, {"w": "生活步伐", "py": "shēng huó bù fá", "cn": "生活的节奏和速度。", "en": "pace of life", "ex": "城市的生活步伐越来越快，人也变得急躁。"}, {"w": "心浮气躁", "py": "xīn fú qì zào", "cn": "心情浮动，脾气急躁。", "en": "restless and impatient", "ex": "上班高峰时人人赶时间，很容易心浮气躁。"}, {"w": "以个人为中心", "py": "yǐ gè rén wéi zhōng xīn", "cn": "凡事只想到自己。", "en": "self-centred", "ex": "事事以个人为中心的人，很难体谅别人。"}, {"w": "致力", "py": "zhì lì", "cn": "把力量用在某方面。", "en": "to devote oneself to", "ex": "政府致力推动优雅社会。"}, {"w": "绊脚石", "py": "bàn jiǎo shí", "cn": "比喻阻碍前进的东西。", "en": "stumbling block", "ex": "不文明的行为是打造优雅社会的绊脚石。"}, {"w": "流传", "py": "liú chuán", "cn": "传下来，传开去。", "en": "to circulate", "ex": "一段地铁争吵的视频在网上流传。"}, {"w": "斥责", "py": "chì zé", "cn": "严厉地指出别人的错误。", "en": "to rebuke", "ex": "男子在车厢里大声斥责那位母亲。"}, {"w": "羞辱", "py": "xiū rǔ", "cn": "使人感到丢脸、难堪。", "en": "to humiliate", "ex": "当众羞辱别人只会激化矛盾。"}, {"w": "公然", "py": "gōng rán", "cn": "公开地，毫无顾忌地。", "en": "openly; brazenly", "ex": "有人在公共场所公然辱骂清洁工人。"}, {"w": "辱骂", "py": "rǔ mà", "cn": "用难听的话骂人。", "en": "to verbally abuse", "ex": "辱骂他人是缺乏教养的表现。"}, {"w": "肇事者", "py": "zhào shì zhě", "cn": "引起事端、闯祸的人。", "en": "perpetrator", "ex": "肇事者态度嚣张，引起网民强烈不满。"}, {"w": "嚣张", "py": "xiāo zhāng", "cn": "态度放肆，不讲道理。", "en": "arrogant; aggressive", "ex": "那名男子态度嚣张，完全不认错。"}, {"w": "高傲", "py": "gāo ào", "cn": "自以为了不起，看不起别人。", "en": "haughty", "ex": "她态度高傲，对服务员说话很不客气。"}, {"w": "公德心", "py": "gōng dé xīn", "cn": "在公共场所遵守规矩、为别人着想的心。", "en": "civic-mindedness", "ex": "随手乱丢垃圾是缺乏公德心的表现。"}, {"w": "同情心", "py": "tóng qíng xīn", "cn": "对别人的遭遇产生关心和怜悯的心。", "en": "compassion", "ex": "看到有人跌倒却不帮忙，就是缺乏同情心。"}, {"w": "反感", "py": "fǎn gǎn", "cn": "不喜欢，不满。", "en": "aversion; disgust", "ex": "插队的行为引起排队人群的反感。"}, {"w": "深思", "py": "shēn sī", "cn": "深入地思考。", "en": "deep reflection", "ex": "这起事件引发公众对公共教养的深思。"}, {"w": "杯盘狼藉", "py": "bēi pán láng jí", "cn": "杯子盘子乱七八糟地放着。", "en": "a mess of dirty dishes", "ex": "有些食客吃完就走，留下杯盘狼藉的桌面。"}, {"w": "霸占", "py": "bà zhàn", "cn": "强行占有。", "en": "to hog; to occupy by force", "ex": "有人用纸巾霸占座位，自己却去排队买食物。"}, {"w": "高楼抛物", "py": "gāo lóu pāo wù", "cn": "从高楼往下丢东西。", "en": "killer litter (throwing items from height)", "ex": "高楼抛物非常危险，可能伤及楼下行人。"}, {"w": "插队", "py": "chā duì", "cn": "不按次序排队，挤到前面。", "en": "to cut the queue", "ex": "在巴士站插队是不文明的行为。"}, {"w": "不文明", "py": "bù wén míng", "cn": "没有礼貌、不守公共秩序的。", "en": "uncivil", "ex": "在车厢里大声喧哗是不文明的行为。"}, {"w": "喧哗", "py": "xuān huá", "cn": "大声说笑吵闹。", "en": "to make a din", "ex": "在图书馆里大声喧哗会打扰别人。"}, {"w": "污言秽语", "py": "wū yán huì yǔ", "cn": "肮脏、下流的话。", "en": "foul language", "ex": "在公共场合说污言秽语，令人反感。"}, {"w": "滥用", "py": "làn yòng", "cn": "过度地、不恰当地使用。", "en": "to abuse; to misuse", "ex": "年轻人滥用优先座位，令真正有需要的人没有位子坐。"}, {"w": "优先座位", "py": "yōu xiān zuò wèi", "cn": "留给长者、孕妇等有需要的人坐的座位。", "en": "priority seat", "ex": "看见孕妇上车，他马上让出优先座位。"}, {"w": "闭目养神", "py": "bì mù yǎng shén", "cn": "闭上眼睛休息。", "en": "to rest with eyes closed", "ex": "有人坐在优先座位上闭目养神，假装看不见站着的长者。"}, {"w": "电动代步工具", "py": "diàn dòng dài bù gōng jù", "cn": "用电推动的滑板车、脚车等。", "en": "personal mobility device (PMD)", "ex": "电动代步工具在人行道上高速行驶，容易撞到行人。"}, {"w": "摩擦", "py": "mó cā", "cn": "比喻彼此之间的矛盾和冲突。", "en": "friction", "ex": "行人与代步工具使用者常常发生摩擦。"}, {"w": "冷漠", "py": "lěng mò", "cn": "对人对事不关心。", "en": "indifferent; apathetic", "ex": "看到有人需要帮忙却冷漠走开，令人心寒。"}, {"w": "自顾不暇", "py": "zì gù bù xiá", "cn": "连自己都照顾不过来。", "en": "too busy to look after oneself", "ex": "生活忙碌，许多人自顾不暇，无心关心别人。"}, {"w": "正义感", "py": "zhèng yì gǎn", "cn": "主持公道、维护正确的心。", "en": "sense of justice", "ex": "有正义感的路人站出来制止了欺凌行为。"}, {"w": "明哲保身", "py": "míng zhé bǎo shēn", "cn": "为了保护自己而回避是非。", "en": "to keep out of trouble to protect oneself", "ex": "看到有人被欺负，他选择明哲保身，不敢出声。"}, {"w": "袖手旁观", "py": "xiù shǒu páng guān", "cn": "在一旁看着，不帮忙。", "en": "to stand by and watch", "ex": "长者跌倒时，路人不应袖手旁观。"}, {"w": "溺爱", "py": "nì ài", "cn": "过分宠爱。", "en": "to spoil (a child)", "ex": "父母溺爱孩子，孩子容易变得自私任性。"}, {"w": "双重标准", "py": "shuāng chóng biāo zhǔn", "cn": "对同一件事用两种不同的标准。", "en": "double standard", "ex": "在家可以没礼貌、在外要守规矩，这是双重标准。"}, {"w": "冒犯", "py": "mào fàn", "cn": "言行不礼貌，得罪别人。", "en": "to offend", "ex": "随便拍别人的照片是一种冒犯。"}, {"w": "视而不见", "py": "shì ér bù jiàn", "cn": "看到了却当作没看见。" 被理解的困境。"}, {"w": "折射", "py": "zhé shè", "cn": "比喻反映出（某种现象）。", "en": "to reflect", "ex": "这起争执折射出城市公共空间的常见问题。"}, {"w": "无可厚非", "py": "wú kě hòu fēi", "cn": "没有什么可以过分指责的。", "en": "understandable; beyond reproach", "ex": "孩子活泼本无可厚非，但家长也要顾及他人。"}, {"w": "密闭", "py": "mì bì", "cn": "严密封闭的。", "en": "enclosed; sealed", "ex": "在密闭的车厢里奔跑，容易撞到别人。"}, {"w": "公共礼仪", "py": "gōng gòng lǐ yí", "cn": "在公共场合应遵守的礼貌规矩。", "en": "public etiquette", "ex": "在地铁里轻声说话是基本的公共礼仪。"}, {"w": "对立", "py": "duì lì", "cn": "互相对抗，站在相反的一面。", "en": "opposition; confrontation", "ex": "大声指责只会加剧双方的对立。"}, {"w": "指责", "py": "zhǐ zé", "cn": "指出错误并责备。", "en": "to blame; to criticise", "ex": "遇到冲突时，与其指责，不如好好沟通。"}, {"w": "热议", "py": "rè yì", "cn": "热烈地讨论。", "en": "heated discussion", "ex": "这段视频在网上引发热议。"}, {"w": "边界意识", "py": "biān jiè yì shí", "cn": "清楚个人空间和别人界线的意识。", "en": "awareness of personal boundaries", "ex": "城市拥挤，人们的边界意识越来越敏感。"}, {"w": "侵扰", "py": "qīn rǎo", "cn": "侵犯和打扰。", "en": "to intrude; to disturb", "ex": "我们都希望个人空间不受侵扰。"}, {"w": "化解", "py": "huà jiě", "cn": "消除，解决（矛盾）。", "en": "to defuse; to resolve", "ex": "温和的沟通能化解许多矛盾。"}, {"w": "竖中指", "py": "shù zhōng zhǐ", "cn": "伸出中指，一种侮辱别人的手势。", "en": "to show the middle finger", "ex": "竖中指是非常不尊重人的行为。"}, {"w": "偷拍", "py": "tōu pāi", "cn": "在别人不知道的情况下拍照或录影。", "en": "to take photos secretly", "ex": "偷拍他人侵犯了别人的隐私。"}, {"w": "谴责", "py": "qiǎn zé", "cn": "严厉地批评。", "en": "to condemn", "ex": "社会普遍谴责偷拍他人的行为。"}, {"w": "无伤大雅", "py": "wú shāng dà yǎ", "cn": "对整体没有什么妨害。", "en": "harmless; no big deal", "ex": "有些人以为在家里没礼貌无伤大雅，其实不然。"}, {"w": "施加者", "py": "shī jiā zhě", "cn": "做出某种行为、把影响加在别人身上的人。", "en": "the one who inflicts", "ex": "对施加者来说是玩笑，对受害者来说却可能是伤害。"}, {"w": "微不足道", "py": "wēi bù zú dào", "cn": "很小，不值得一提。", "en": "insignificant", "ex": "看似微不足道的冒犯，也可能伤害别人。"}, {"w": "创伤", "py": "chuāng shāng", "cn": "身体或心理受到的伤害。", "en": "trauma", "ex": "长期被冒犯可能留下情绪创伤。"}, {"w": "执法机关", "py": "zhí fǎ jī guān", "cn": "负责执行法律的机构，如警察。", "en": "law enforcement agency", "ex": "家庭内部的问题，执法机关往往难以介入。"}, {"w": "申诉", "py": "shēn sù", "cn": "向有关方面说明委屈，要求处理。", "en": "to lodge a complaint", "ex": "受害者往往缺乏申诉的管道。"}, {"w": "抑郁", "py": "yì yù", "cn": "心情沉重、不快乐的状态。", "en": "depression", "ex": "长期受到伤害，可能导致焦虑和抑郁。"}, {"w": "社交退缩", "py": "shè jiāo tuì suō", "cn": "害怕与人交往，躲避社交。", "en": "social withdrawal", "ex": "受到冒犯却得不到帮助，孩子可能出现社交退缩。"}, {"w": "敬畏", "py": "jìng wèi", "cn": "又尊敬又害怕。", "en": "awe; reverence", "ex": "人们对法律心存敬畏，却忽视家庭规范。"}, {"w": "权威", "py": "quán wēi", "cn": "使人信服的力量和地位。", "en": "authority", "ex": "法律有权威，家庭规矩也应该被重视。"}, {"w": "分寸", "py": "fēn cun", "cn": "说话做事恰当的限度。", "en": "sense of propriety", "ex": "有分寸的人懂得在公共场合控制音量。"}, {"w": "真诚", "py": "zhēn chéng", "cn": "真心实意。", "en": "sincere", "ex": "做错事后，要真诚地向对方道歉。"}, {"w": "起跑线", "py": "qǐ pǎo xiàn", "cn": "比喻人生的开始阶段。", "en": "starting line", "ex": "在人生的起跑线上，就要建立尊重与良好行为。"}, {"w": "弥补", "py": "mí bǔ", "cn": "把不足的地方补上。", "en": "to make up for", "ex": "行为偏差一旦形成，日后就难以弥补。"}, {"w": "奠基", "py": "diàn jī", "cn": "打下基础。", "en": "to lay the foundation", "ex": "公民的价值判断，在家庭中奠基。"}], "quiz": [{"q": "下列哪一项是资料提到的“公共场所缺乏公德心”的例子？", "o": ["用纸巾霸占座位、用餐后不归还碗碟、高楼抛物", "在地铁上看书", "在小贩中心排队买食物", "在有盖走廊上散步"], "a": 0, "why": "重点：公德心问题包括杯盘狼藉、用纸巾霸占座位、高楼抛物、乱丢垃圾、不排队或插队。"}, {"q": "资料指出“家庭内外双重标准”会造成什么后果？", "o": ["孩子误以为只要不在公共场合，就可以为所欲为", "孩子在家和在外都很有礼貌", "父母更容易管教孩子", "孩子在公共场合更守规矩"], "a": 0, "why": "重点：私人领域缺乏明确约束，偏差行为最终会反映到社会层面。"}, {"q": "调查显示，43%的受访国人对自己有什么看法？", "o": ["自认为待人亲切，行为比他人更优雅", "认为新加坡人非常不礼貌", "认为自己需要上礼貌课", "认为政府管得太多"], "a": 0, "why": "重点：这是一种“自我认知偏差”，与实际社会现象存在落差。"}, {"q": "国家环境局推行的“食客归还托盘和餐具计划”有什么内容？", "o": ["强制公众在小贩中心、咖啡店和食阁归还托盘、清理桌面垃圾，违例者会被警告或罚款", "鼓励食客自愿捐款给清洁工人", "规定小贩中心只能使用一次性餐具", "让清洁工人负责收拾所有托盘"], "a": 0, "why": "重点：政府也提供补贴协助业者安装归还设备。"}, {"q": "下列哪一项属于“完善基础设施彰显人文关怀”？", "o": ["有盖走廊、轮椅厕间、盲文按钮、为失智者设计的鲜明路标", "在地铁上播放礼让广播", "举办慈善晚宴", "对违例者罚款"], "a": 0, "why": "重点：从硬件上为优雅社会提供支撑。广播与海报属于礼貌宣导，罚款属于强制措施。"}, {"q": "资料认为为什么【不应】单靠法律解决社会摩擦？", "o": ["会造成繁文缛节，失去优雅社会的初衷；只有提升内在素质，才能水到渠成地维持秩序", "因为法律太宽松", "因为警察人手不足", "因为国人不怕罚款"], "a": 0, "why": "重点：打造优雅社会的四个原因——构建温情社会、提升国际形象、发扬传统美德、避免过度依赖法律。"}, {"q": "资料认为打造优雅社会的“立足之本”是什么？", "o": ["家庭教育——父母以身作则，从小确立清晰的行为界限与后果机制", "学校考试", "政府罚款", "媒体宣传"], "a": 0, "why": "重点：公共场合的教养根源于家庭；不可把不礼貌行为视为“家务事”而合理化。"}, {"q": "“职总富食客”用什么方法鼓励公众实践公德行为？", "o": ["设立榜样和激励机制，进行正面强化", "对所有食客收取清洁费", "在小贩中心安装监视器", "禁止食客在店内用餐"], "a": 0, "why": "重点：在强制罚款之外，政府和机构可以柔性劝说与正面强化（Positive Reinforcement）。"}, {"q": "地铁风波视频曝光后，部分网民为那位母亲说话，理由是什么？", "o": ["有些孩子天性活泼好动，或可能有自闭症等特殊情况，在嘈杂车厢里难以控制自己", "那名男子是地铁职员", "那位母亲已经向所有人道歉", "孩子当时在优先座位上休息"], "a": 0, "why": "重点：网民评论两极分化——一方认为家长有责任管束孩子，另一方则提醒要体谅家长的困境。"}, {"q": "作者对视频中男子的做法有什么看法？", "o": ["提高音量、出言羞辱并未解决问题，反而把焦点从行为转向情绪，加剧对立", "男子做得完全正确", "男子应该报警处理", "男子应该默默离开车厢"], "a": 0, "why": "重点：表达方式同样关键；若一方能主动约束、另一方给予体谅、语气多一分温和，许多矛盾便能化解。"}, {"q": "《从家里开始培养正确价值观》认为公共场合的失序行为，根源在哪里？", "o": ["家庭与私人空间中更早形成的行为规范", "学校的考试制度", "地铁太拥挤", "社交媒体的报道"], "a": 0, "why": "重点：凡是在公共场合不可接受的行为，也不应在私人领域被合理化，因为品格正是在家庭中形成的。"}, {"q": "为什么私人领域的冒犯行为对受害者特别伤害？", "o": ["私人领域常被视为执法机关不可介入的范围，受害者缺乏申诉与保护的管道", "因为家里没有监视器", "因为受害者都是陌生人", "因为这些行为都会登上新闻"], "a": 0, "why": "重点：长期得不到正视与修复，可能演变为焦虑、抑郁或社交退缩，最终反映到社会层面。"}]}, "t5": {"parts": [{"bg": [{"t": "燃烧化石燃料、工业生产和交通运输会产生温室气体，导致全球变暖、海平面上升和极端天气。科学家警告，如果不采取减排行动，生态灾害和经济损失将更加严重。", "bp": "", "b": false, "li": false}, {"t": "为应对这一问题，许多国家和企业承诺到2050年实现“净零排放”（Net Zero Emissions），即排放量与吸收量平衡，不再增加大气中的温室气体，以避免气温升高超过1.5°C。新加坡也承诺最迟在2050年实现全国净零排放，作为长期气候行动目标。", "bp": "", "b": false, "li": false}], "rows": [{"label": "新加坡面临的挑战", "kind": "challenge", "paras": [{"t": "气候与天气相关", "bp": "", "b": true, "li": true}, {"t": "新加坡气温持续上升，极端天气事件越来越频繁，包括高温、暴雨和雷暴。同时，海平面上升也增加了沿海地区的洪水风险，对城市和基础设施带来潜在威胁。", "bp": "", "b": false, "li": false}, {"t": "城市与基础设施相关", "bp": "", "b": true, "li": true}, {"t": "由于城市热岛效应，新加坡本地温度比周边地区更高，导致能源消耗增加。同时，气候波动对水资源供应造成挑战，城市必须依赖淡水生产和储备来保障用水安全。", "bp": "", "b": false, "li": false}, {"t": "生态与环境相关", "bp": "", "b": true, "li": true}, {"t": "新加坡的生态系统和生物多样性正面临压力。气候变化可能破坏自然生态，使环境不再像以前那样稳定，同时影响人类赖以生存的资源（空气、水、粮食等）。", "bp": "", "b": false, "li": false}, {"t": "经济与社会相关", "bp": "", "b": true, "li" 燃油车，减少二氧化碳排放，对环境更友好。", "bp": "10. 电动车", "b": false, "li": false}, {"t": "例：使用电动车可以减少空气污染和碳排放，有助于缓解气候变化。", "bp": "例", "b": false, "li": false}], "oex": "使用电动车可以减少空气污染和碳排放，有助于缓解气候变化。", "q": "电动车"}, {"term": "绿色建筑", "paras": [{"t": "11. 绿色建筑（Green Building）：在设计、建造和使用过程中尽量节约能源、减少污染、保护环境的建筑，例如使用可再生能源、节能设备和环保材料。", "bp": "11. 绿色建筑", "b": false, "li": false}, {"t": "例：新加坡鼓励建造绿色建筑，以减少能源消耗和碳排放。", "bp": "例", "b": false, "li": false}], "oex": "新加坡鼓励建造绿色建筑，以减少能源消耗和碳排放。", "q": "绿色建筑"}, {"term": "能源消耗", "paras": [{"t": "12. 能源消耗（Energy Consumption）：指人类生活、生产或交通等活动使用的能源总量，包括电力、燃料、天然气等。", "bp": "12. 能源消耗", "b": false, "li": false}, {"t": "例：通过使用节能灯和高效电器，可以显著降低能源消耗。", "bp": "例", "b": false, "li": false}], "oex": "通过使用节能灯和高效电器，可以显著降低能源消耗。", "q": "能源消耗"}]}], "arts": [{"title": "《联合早报》社论：全球与净零排放的距离", "paras": [{"t": "    向清洁能源过渡不仅是一项技术挑战，也是一项复杂的经济和政治博弈。在发展中国家，这种博弈更艰难，既要推动清洁能源的发展，又不能忽视经济增长与社会稳定。发展中国家需要大规模的基础设施投资，才能摆脱对碳密集型能源的依赖，然而成本通常比发达国家更高；与此同时，许多发展中国家依赖煤炭等廉价能源支撑经济发展，如果过快推动清洁能源政策，可能导致经济增长乏力，甚至引发社会问题。", "bp": "", "b": false, "li": false}, {"t": "    虽然世界各地在清洁能源方面的投资不断增加，但仍高度依赖传统化石燃料。东南亚地区的能源结构较为复杂，许多国家依赖化石燃料来维持电力供应，在推行区域清洁能源合作计划时，须充分考虑不同国家的经济发展阶段和现实状况，以促进协同发展。国际能源署（IEA）在新加坡设立区域合作中心，便是希望促进各国之间更紧密协调，实现区域脱碳目标。", "bp": "", "b": false, "li": false}, {"t": "    这也意味着新加坡将在区域的能源转型中发挥关键作用。新加坡本身也在积极探索有效降低碳排放的解决方案，以期在2030年将温室气体排放量，降至约6000万吨二氧化碳当量，并在2050年实现净零排放。", "bp": "", "b": false, "li": false}, {"t": "    新加坡为实现净零排放的目标，同时又不阻碍经济发展，我国在清洁能源领域采取好些措施，例如，发展太阳能和绿色氢能技术、推广电动汽车、增加从外地进口低碳电力、加强电网基础设施等，尽可能在经济发展与绿色之间取得平衡。", "bp": "", "b": false, "li": false}, {"t": "新加坡作为小国的总碳排量微不足道，无法凭一己之力改变对环境的影响。全球须要在2030 年之前加快可再生能源的部署，提高电网的灵活性并整合先进的能源系统，否则能源网络将难以处理额外的可再生能源容量，在能源转型中造成瓶颈。全球能源转型之路漫长，要在预定期限达到净零排放的目标，恐怕不容易。", "bp": "", "b": false, "li": false}]}, {"title": "《联合早报》调研报告：若开销不大 年长者更愿采取环保行动（删减版）", "paras": [{"t": "       多数新加坡人支持我国要在2050年达到净零排放的目标。只要涉及的开销低，年长者比年轻人更愿意采取环保行动，改变长期生活习惯。", "bp": "", "b": false, "li": false}, {"t": "       新加坡国立大学、新加坡科技设计大学和永续发展与环境部联合发布有关新加坡人对净零排放理解度的调研报告。65%的受访者对新加坡要在2050年达到净零排放的目标表示支持，有另外17%甚至认为应该更早实现净零排放。不过，只有15％知道政府定下2050年的承诺。　　　", "bp": "", "b": false, "li": false}, {"t": "       报告用从低到高的意愿程度衡量不同年龄层采取环保行动的可能性。结果显示，年龄在55岁或以上的受访者，相较于34岁以下者，更愿意采取开销不大的环保措施，譬如减少使用塑料袋、合理设置室内冷气温度等。", "bp": "", "b": false, "li": false}, {"t": "       同时，年长者也更愿意改变长期生活习惯，在减少肉食、减少搭乘飞机出行等方面做出努力。据联合国统计，肉类生产所倚靠的畜牧业产生了全球约五分之一的二氧化碳排放调查项目负责人告诉《联合早报》，此次调查结果让她颇感意外。“根据我们的固有观念，年轻人更可能大胆改变生活方式，这和我们的调查结果有些相悖。”", "bp": "", "b": false, "li": false}, {"t": "        在她看来，相悖的原因可能是年长者习惯于生活节俭，怀念过去更加贴近自然的乡村生活。不过，此次研究的目的并非给国人制定统一生活准则。而是鼓励人们在生活中做出选择和适当的妥协，为减少碳排放出一分力。“我们并不是要剥夺人们享受生活的权利，而是希望让他们意识到‘碳足迹’的存在，鼓励他们在生活中做出选择和适当的妥协，为减少碳排放出一分力。”", "bp": "", "b": false, "li": false}, {"t": "        国大高级副校长刘德成教授在接受早报采访时也指出，此次调查结果源于不同年龄层的价值观。年长者经历生活坎坷，崇尚节俭且持有更多情怀；而年轻人一般出生在富裕年代，他们在考虑问题时比较以自我为中心，消费时也比较随性。", "bp": "", "b": false, "li": false}, {"t": "     “不过，我也看到越来越多的青年学生对于未来充满期待，他们希望通过科技让世界变得可持续发展。”", "bp": "", "b": false, "li": false}, {"t": "        此次调查还显示，阻碍国人改变长期饮食习惯和出行习惯的主要因素包括：不愿改变现状、生活不便，以及认为改变饮食习惯对减排无济于事。", "bp": "", "b": false, "li": false}]}]}], "dict": [{"w": "燃烧", "py": "rán shāo", "cn": "物体着火、烧起来。", "en": "to burn; combustion", "ex": "燃烧煤炭和石油会释放大量二氧化碳。"}, {"w": "化石燃料", "py": "huà shí rán liào", "cn": "煤、石油、天然气等由古代生物变成的燃料。", "en": "fossil fuels", "ex": "发电厂燃烧化石燃料，是温室气体的主要来源。"}, {"w": "工业生产", "py": "gōng yè shēng chǎn", "cn": "工厂制造产品的活动。", "en": "industrial production", "ex": "工业生产排放的废气加剧了全球变暖。"}, {"w": "全球变暖", "py": "quán qiú biàn nuǎn", "cn": "地球的平均气温不断上升。", "en": "global warming", "ex": "全球变暖导致北极冰川迅速融化。"}, {"w": "海平面上升", "py": "hǎi píng miàn shàng shēng", "cn": "海水的高度不断升高。", "en": "sea-level rise", "ex": "新加坡四面环海，海平面上升对我们威胁很大。"}, {"w": "减排", "py": "jiǎn pái", "cn": "减少排放（温室气体）。", "en": "to cut emissions", "ex": "各国必须加快减排，才能减缓气候变化。"}, {"w": "生态", "py": "shēng tài", "cn": "生物和环境之间的关系。", "en": "ecology", "ex": "海水变暖破坏了珊瑚礁的生态。"}, {"w": "灾害", "py": "zāi hài", "cn": "自然或人为造成的严重损害。", "en": "disaster", "ex": "气候变化让水灾、旱灾等灾害更常发生。"}, {"w": "承诺", "py": "chéng nuò", "cn": "答应会做到。", "en": "to pledge", "ex": "强行夺走。", "en": "to deprive", "ex": "环保不是要剥夺人们享受生活的权利。"}, {"w": "坎坷", "py": "kǎn kě", "cn": "比喻经历曲折，很不顺利。", "en": "full of hardships", "ex": "年长者经历过坎坷的生活，所以特别珍惜资源。"}, {"w": "崇尚", "py": "chóng shàng", "cn": "尊重，推崇。", "en": "to uphold; to advocate", "ex": "老一辈崇尚节俭，从不浪费食物。"}, {"w": "情怀", "py": "qíng huái", "cn": "心中的感情和心境。", "en": "sentiment", "ex": "年长者对自然有深厚的情怀。"}, {"w": "随性", "py": "suí xìng", "cn": "随自己的心意，不加约束。", "en": "casual; impulsive", "ex": "有些年轻人消费比较随性，看到喜欢的就买。"}, {"w": "无济于事", "py": "wú jì yú shì", "cn": "对事情没有帮助。", "en": "of no help; futile", "ex": "有人认为个人改变饮食习惯对减排无济于事。"}, {"w": "现状", "py": "xiàn zhuàng", "cn": "目前的情况。", "en": "status quo", "ex": "不愿改变现状，是阻碍人们实践环保的原因之一。"}], "quiz": [{"q": "“净零排放”是什么意思？", "o": ["温室气体排放量与吸收量平衡，不再增加大气中的温室气体", "完全不排放任何温室气体", "只减少一半的温室气体排放", "只在工厂减少排放"], "a": 0, "why": "重点：许多国家承诺2050年实现净零排放，以避免气温升高超过1.5°C；新加坡也承诺最迟在2050年实现。"}, {"q": "下列哪一项【不是】新加坡在气候方面面临的挑战？", "o": ["地震和火山爆发越来越频繁", "气温持续上升，高温、暴雨和雷暴更频繁", "海平面上升增加沿海洪水风险", "城市热岛效应导致能源消耗增加"], "a": 0, "why": "重点：四类挑战——气候与天气、城市与基础设施、生态与环境、经济与社会。"}, {"q": "为什么全球气候变化会影响新加坡的经济？", "o": ["新加坡高度依赖进口食物和能源，气候变化可能影响供应链", "新加坡的工厂全部使用煤炭", "新加坡没有任何港口", "新加坡的旅游业完全依靠下雪"], "a": 0, "why": "重点：企业与居民若不调整生活和生产方式，会影响减排成效和生活质量。"}, {"q": "新加坡向联合国承诺在2035年前把温室气体总排放量减少到多少？", "o": ["4500至5000万吨", "1000万吨以下", "1亿吨", "完全不排放"], "a": 0, "why": "重点：这为2050年实现净零排放打下基础。"}, {"q": "政府推出哪项政策，用经济方法鼓励企业减少排放？", "o": ["提高碳税", "免费发放汽油", "降低电费", "取消所有工厂"], "a": 0, "why": "重点：碳税激励企业减排与创新，同时发展可再生能源与减碳技术。"}, {"q": "在交通方面，新加坡有什么减排措施？", "o": ["从2030年起，新登记的车辆必须为清洁能源车型；未来港口船只和拖轮也要实现净零排放", "全面禁止私人汽车", "只允许电动巴士上路", "关闭所有加油站"], "a": 0, "why": "重点：交通和港口都是减排的重点领域。"}, {"q": "为什么说实现净零排放对国家层面很重要？", "o": ["能强化能源安全、创造绿色就业机会，并提升新加坡在国际气候行动中的地位", "能让新加坡完全不需要进口食物", "能让新加坡的气温立刻下降", "能让国人不再需要用电"], "a": 0, "why": "重点：个人层面——减少空气污染；城市层面——更绿色、更能抵抗气候风险；全球层面——与他国合作缓解全球变暖。"}, {"q": "个人可以怎样为净零排放出力？", "o": ["节约用电、使用公共交通或骑行、把传统汽车换成电动车", "多搭飞机出国旅行", "把冷气温度调到最低", "每天开车上学"], "a": 0, "why": "重点：社区层面——太阳能板、绿色建筑、自行车道；国家层面——碳税与研发；全球层面——区域能源网络。"}, {"q": "为什么发展中国家推动清洁能源特别困难？", "o": ["需要大规模投资基础设施、成本较高，又依赖煤炭等廉价能源支撑经济", "发展中国家没有阳光和风", "发展中国家已经完全使用清洁能源", "发展中国家不排放温室气体"], "a": 0, "why": "重点：能源转型是复杂的经济和政治博弈；过快推行可能导致经济乏力、引发社会问题。"}, {"q": "社论为什么说新加坡“无法凭一己之力”改变环境影响？", "o": ["新加坡是小国，总碳排量微不足道，全球必须一起加快部署可再生能源", "新加坡的排放量是全世界最高的", "新加坡没有任何减碳政策", "新加坡已经实现净零排放"], "a": 0, "why": "重点：全球须在2030年前加快部署可再生能源、提高电网灵活性，否则会在能源转型中造成瓶颈。"}, {"q": "调研报告发现，哪个年龄层更愿意采取开销不大的环保行动？", "o": ["55岁或以上的年长者", "34岁以下的年轻人", "小学生", "各年龄层完全一样"], "a": 0, "why": "重点：65%受访者支持2050净零目标，但只有15%知道这项承诺；年长者更愿意减少塑料袋、减少肉食和搭飞机。"}, {"q": "学者认为年长者更愿意改变生活习惯的原因是什么？", "o": ["年长者习惯节俭、经历生活坎坷，怀念贴近自然的生活", "年长者更富有", "年长者不需要上班", "年长者更懂科技"], "a": 0, "why": "重点：年轻人多出生在富裕年代，消费较随性；阻碍改变的因素包括不愿改变现状、生活不便、认为改变无济于事。"}]}, "t6": {"parts": [{"bg": [{"t": "人工智能（AI）正以惊人的速度发展，从ChatGPT到DeepSeek等大语言模型异军突起，其推理和分析能力已接近人类，迅速渗透到我们的生活、学习与工作之中。然而，AI的无限可能也带来了深刻的顾虑：人们担心工作被取代、社会面临假信息威胁、以及过度依赖机器所引发的人际情感疏离。迈入人工智能时代，我们所抱持的态度绝不是恐惧或排斥，而是必须建立“人机共构”的时代。我们应将AI视为强大的工具和“副驾驶”，由人类来定义其发展与使用，让人机优势互补，从而将AI转化为国家与个人的战略优势。", "bp": "", "b": false, "li": false}], "rows": [{"label": "现象与挑战", "kind": "challenge", "paras": [{"t": "社会现象：", "bp": "", "b": true, "li": true}, {"t": "引发就业焦虑： AI正快速取代一些基础的“入门级工作”，这让许多准备踏入社会的年轻人感到焦虑，担心未来找不到工作。", "bp": "引发就业焦虑：", "b": false, "li": true}, {"t": "过度依赖导致情感疏离：很多人过度依赖AI（比如让AI代写情书、用表情包代替真实情绪），这让我们躲在屏幕背后，变得更加孤独，忽略了现实中面对面的交流和真实的感情", "bp": "过度依赖导致情感疏离：", "b": false, "li": true}, {"t": "潜在的社会与经济风险： AI如果不受约束地发展，可能导致数以百万计的工作面临风险，进而引发社会动荡和贫富差距扩大。", "bp": "潜在的社会与经济风险：", "b": false, "li": true}, {"t": "学习现象：", "bp": "", "b": true, "li": true}, {"t": "专注力下降与信息过载：在科技与AI充斥的环境中，学生容易受到干扰导致专注力下降；同时面对海量碎片化信息，有些甚至虚实难分，难以筛选出真正有用的内容。", "bp": "专注力下降与信息过载：", "b": false, "li": true}, {"t": "单纯应试教育的失效： AI能轻易完成常规知识的输出，若学生仍局限于传统的死读书而缺乏批判性思维与创新能力，未来将面临被淘汰的风险。", "bp": "单纯应试教育的失效：", "b": false, "li": true}, {"t": "引发学术诚信危机：部分学生因缺乏自律，直接抄袭人工智能生成的内容来应付作业，削弱学习的真实性，并引发学术诚信问题。", "bp": "引发学术诚信危机", "b": false, "li": true}]}, {"label": "政府政策与社会支援", "kind": "action", "paras": [{"t": "国家战略：总理在2026年宣布财政预算案时宣布成立全国人工智能理事会，制定战略方向，推动先进制造、金融、医疗等四大领域率先落实AI转型，并制定明确规则以确保安全负责任地使用AI。", "bp": "国家战略：", "b": false, "li": true}, {"t": "重构青年职业阶梯：提倡企业设立“融合人工智能的学徒制”；探讨提前让年轻人在职业生涯早期动用技能创前程（SkillsFuture）补贴，并扩大入职培训计划，降低年轻人转行的财务风险。", "bp": "重构青年职业阶梯：", "b": false, "li": true}, {"t": "教育升级：政府为报名指定AI课程的国人提供免费优质AI工具服务", "bp": "教育升级：", "b": false, "li": true}]}, {"label": "为何要打造“人机共构”的时代？", "kind": "impact", "paras": [{"t": "实现优势互补与协同作用： AI没有偏见和情绪，能快速处理海量数据；而人类拥有情商、创造力和复杂的判断力。人类和AI一起工作能创造出有效的协同作用，做出最佳决策。", "bp": "实现优势互补与协同作用：", "b": false, "li": true}, {"t": "突破结构性局限（填补劳动力缺口）：新加坡步入“超老龄社会”，面临天然资源匮乏和劳动力市场紧缩。AI不仅不会抢走饭碗，反而是弥补劳动力不足、提高生产力的关键工具。", "bp": "突破结构性局限（填补劳动力缺口）：", "b": false, "li": true}, {"t": "AI无法完全取代人类： AI只是机械算法，没有真实的生命体验，体会不到失败的苦涩；它无法取代人类深层的技能、经验和复杂的判断力。此外，在许多物理操作中，人力成本目前仍远低于AI系统的安装成本。", "bp": "AI无法完全取代人类： AI只是机械算法，没有真实的生命体验", "b": false, "li": true}]}, {"label": "如何积极拥抱人工智能？", "kind": "action", "paras": [{"t": "教育/技能层面（培养AI素养与核心能力）：", "bp": "", "b": true, "li": true}, {"t": " 人工智能素养（如掌握提示词工程、道德评估）必须成为所有毕业生的基础能力。同时，更要强化机器无法复制的人类核心能力（如沟通、协作、领导力及道德推理）。", "bp": "", "b": false, "li": true}, {"t": "学校应在品德与公民教育课程中加强人工智能使用规范的教育，引导学生建立负责任与诚信使用人工智能的正确价值观。", "bp": "", "b": false, "li": true}, {"t": "企业/岗位层面（岗位转型）：未来的入门级雇员，其核心价值应从单纯的“执行”转向对AI的“监督、整合与判断”。企业应将AI视为辅助员工的“副驾驶”，借此延长年长雇员的职业寿命并提升效率。", "bp": "企业/岗位层面（岗位转型）：", "b": false, "li": true}, {"t": "个人/心态层面（坚守人性）： ", "bp": "", "b": true, "li": true}, {"t": "我们不应被时间控制或陷入焦虑，而应“活得更像人”。在现实中放下手机，多进行面对面的交流，珍视人类独有的情感、思想与充满缺憾却真实的生命状态，才不会被机器取代", "bp": "", "b": false, "li": true}, {"t": "具备AI素养：秉持负责任且诚信的态度善用科技辅助日常工作", "bp": "", "b": false, "li": true}]}, {"label": "参考词语", "kind": "ref", "paras": [{"t": "异军突起：指原本不被注意的新力量突然迅速崛起。在人工智能时代，常指如DeepSeek等新兴AI技术迅速发展，震撼全球科技与产业界。", "bp": "异军突起：", "b": false, "li": true}, {"t": "例：近年来，中国研发的人工智能模型异军突起，不仅降低训练成本，也改变了全球科技竞争格局。", "bp": "", "b": false, "li": true}, {"t": "日新月异：形容发展变化极快，每天每月都有新的进步。在人工智能时代，指AI技术不断突破，迅速改变人类生活与工作方式。", "bp": "日新月异：", "b": false, "li": true}, {"t": "例：人工智能技术日新月异，从自动翻译到智能驾驶，正深刻影响我们的日常生活。", "bp": "", "b": false, "li": true}, {"t": "瞬息万变：形容事物变化非常迅速，难以预测。在人工智能时代，常指科技发展速度极快，使未来充满不确定性。", "bp": "瞬息万变：", "b": false, "li": true}, {"t": "例：在这个瞬息万变的人工智能时代，若不持续学习新技能，就可能被时代淘汰。", "bp": "", "b": false, "li": true}, {"t": "不绝于耳：形容声音不断出现，经常听到。在人工智能时代，常指人们对“AI取代人类工作”的担忧频繁出现。", "bp": "不绝于耳：", "b": false, "li": true}, {"t": "例：随着人工智能的发展，“机器将抢走人类饭碗”的担忧不绝于耳，引发社会广泛讨论。", "bp": "", "b": false, "li": true}, {"t": "束手无策：形容面对问题时毫无办法。在人工智能时代，常指人类若只是一味恐惧而不作改变，便无法应对科技带来的挑战。", "bp": "束手无策：", "b": false, "li": true}, {"t": "例：如果人们面对人工智能的发展只知恐惧而束手无策，最终只会被时代远远抛在后头。", "bp": "", "b": false, "li": true}, {"t": "“副驾驶”：比喻辅助驾驶的人。在人工智能时代，常把AI比喻为协助人类完成任务的帮手，而非取代人类的主导者。", "bp": "“副驾驶”", "b": false, "li": true}, {"t": "例：人工智能更像是人类的“副驾驶”，帮助我们提高效率，而不是完全取代人类。", "bp": "", "b": false, "li": true}, {"t": "双刃剑：比喻事物同时具有好处和坏处。在人工智能时代，指AI既能提高效率，也可能带来失业或假信息等问题。", "bp": "双刃剑：", "b": false, "li": true}, {"t": "例：人工智能是一把双刃剑，既能促进社会发展，也可能对就业市场造成冲击。", "bp": "", "b": false, "li": true}, {"t": "“输入—输出”的机械反应：比喻机器根据指令作出固定反应。在人工智能时代，指AI本质上只是程序运算，缺乏真实情感与思考。", "bp": "“输入—输出”的机械反应", "b": false, "li": true}, {"t": "例：人工智能的回答本质上只是“输入—输出”的机械反应，并不具备真正的理解能力。", "bp": "", "b": false, "li": true}, {"t": "与时俱进：指随着时代发展不断进步。在人工智能时代，指人类必须持续学习新技能，以适应科技变化。", "bp": "与时俱进：", "b": false, "li": true}, {"t": "例：面对人工智能的挑战，人类必须与时俱进，不断提升自身能力。", "bp": "", "b": false, "li": true}, {"t": "协同作用：指不同事物互相配合，产生更大效果。在人工智能时代，指人类与AI合作可创造更大的价值。", "bp": "协同作用：", "b": false, "li": true}, {"t": "例：当人类的创造力与人工智能的数据分析能力产生协同作用时，便能创造更大的成果。", "bp": "", "b": false, "li": true}], "items": [{"term": "异军突起", "en": "a new force suddenly rising to prominence", "paras": [{"t": "异军突起：指原本不被注意的新力量突然迅速崛起。在人工智能时代，常指如DeepSeek等新兴AI技术迅速发展，震撼全球科技与产业界。", "bp": "异军突起：", "b": false, "li": true}, {"t": "例：近年来，中国研发的人工智能模型异军突起，不仅降低训练成本，也改变了全球科技竞争格局。", "bp": "", "b": false, "li": true}], "oex": "近年来，中国研发的人工智能模型异军突起，不仅降低训练成本，也改变了全球科技竞争格局。", "q": "异军突起"}, {"term": "日新月异", "en": "changing and improving with each passing day", "paras": [{"t": "日新月异：形容发展变化极快，每天每月都有新的进步。在人工智能时代，指AI技术不断突破，迅速改变人类生活与工作方式。", "bp": "日新月异：", "b": false, "li": true}, {"t": "例：人工智能技术日新月异，从自动翻译到智能驾驶，正深刻影响我们的日常生活。", "bp": "", "b": false, "li": true}], "oex": "人工智能技术日新月异，从自动翻译到智能驾驶，正深刻影响我们的日常生活。", "q": "日新月异"}, {"term": "瞬息万变", "en": "changing rapidly from moment to moment", "paras": [{"t": "瞬息万变：形容事物变化非常迅速，难以预测。在人工智能时代，常指科技发展速度极快，使未来充满不确定性。", "bp": "瞬息万变：", "b": false, "li": true}, {"t": "例：在这个瞬息万变的人工智能时代，若不持续学习新技能，就可能被时代淘汰。", "bp": "", "b": false, "li": true}], "oex": "在这个瞬息万变的人工智能时代，若不持续学习新技能，就可能被时代淘汰。", "q": "瞬息万变"}, {"term": "不绝于耳", "en": "to be heard constantly; never-ending", "paras": [{"t": "不绝于耳：形容声音不断出现，经常听到。在人工智能时代，常指人们对“AI取代人类工作”的担忧频繁出现。", "bp": "不绝于耳：", "b": false, "li": true}, {"t": "例：随着人工智能的发展，“机器将抢走人类饭碗”的担忧不绝于耳，引发社会广泛讨论。", "bp": "", "b": false, "li": true}], "oex": "随着人工智能的发展，“机器将抢走人类饭碗”的担忧不绝于耳，引发社会广泛讨论。", "q": "不绝于耳"}, {"term": "束手无策", "en": "to be at a complete loss; helpless", "paras": [{"t": "束手无策：形容面对问题时毫无办法。在人工智能时代，常指人类若只是一味恐惧而不作改变，便无法应对科技带来的挑战。", "bp": "束手无策：", "b": false, "li": true}, {"t": "例：如果人们面对人工智能的发展只知恐惧而束手无策，最终只会被时代远远抛在后头。", "bp": "", "b": false, "li": true}], "oex": "如果人们面对人工智能的发展只知恐惧而束手无策，最终只会被时代远远抛在后头。", "q": "束手无策"}, {"term": "副驾驶", "en": "co-pilot — AI as an assistant, not the one in charge", "paras": [{"t": "“副驾驶”：比喻辅助驾驶的人。在人工智能时代，常把AI比喻为协助人类完成任务的帮手，而非取代人类的主导者。", "bp": "“副驾驶”", "b": false, "li": true}, {"t": "例：人工智能更像是人类的“副驾驶”，帮助我们提高效率，而不是完全取代人类。", "bp": "", "b": false, "li": true}], "oex": "人工智能更像是人类的“副驾驶”，帮助我们提高效率，而不是完全取代人类。", "q": "副驾驶"}, {"term": "双刃剑", "en": "a double-edged sword", "paras": [{"t": "双刃剑：比喻事物同时具有好处和坏处。在人工智能时代，指AI既能提高效率，也可能带来失业或假信息等问题。", "bp": "双刃剑：", "b": false, "li": true}, {"t": "例：人工智能是一把双刃剑，既能促进社会发展，也可能对就业市场造成冲击。", "bp": "", "b": false, "li": true}], "oex": "人工智能是一把双刃剑，既能促进社会发展，也可能对就业市场造成冲击。", "q": "双刃剑"}, {"term": "输入—输出", "en": "mechanical \"input–output\" response", "paras": [{"t": "“输入—输出”的机械反应：比喻机器根据指令作出固定反应。在人工智能时代，指AI本质上只是程序运算，缺乏真实情感与思考。", "bp": "“输入—输出”的机械反应", "b": false, "li": true}, {"t": "例：人工智能的回答本质上只是“输入—输出”的机械反应，并不具备真正的理解能力。", "bp": "", "b": false, "li": true}], "oex": "人工智能的回答本质上只是“输入—输出”的机械反应，并不具备真正的理解能力。", "q": "输入—输出"}, {"term": "与时俱进", "en": "to keep pace with the times", "paras": [{"t": "与时俱进：指随着时代发展不断进步。在人工智能时代，指人类必须持续学习新技能，以适应科技变化。", "bp": "与时俱进：", "b": false, "li": true}, {"t": "例：面对人工智能的挑战，人类必须与时俱进，不断提升自身能力。", "bp": "", "b": false, "li": true}], "oex": "面对人工智能的挑战，人类必须与时俱进，不断提升自身能力。", "q": "与时俱进"}, {"term": "协同作用", "en": "synergy; working together to achieve a greater effect", "paras": [{"t": "协同作用：指不同事物互相配合，产生更大效果。在人工智能时代，指人类与AI合作可创造更大的价值。", "bp": "协同作用：", "b": false, "li": true}, {"t": "例：当人类的创造力与人工智能的数据分析能力产生协同作用时，便能创造更大的成果。", "bp": "", "b": false, "li": true}], "oex": "当人类的创造力与人工智能的数据分析能力产生协同作用时，便能创造更大的成果。", "q": "协同作用"}]}], "arts": [{"title": "《联合早报》新闻：我国推出全球首个由政府主导代理式人工智能监管模式框架 (删减版)", "paras": [{"t": "    我国推出全球首个由政府主导的代理式人工智能监管模式框架，协助企业和机构采取措施降低应用风险，并确保人工智能的运作最终必须由人来负责。", "bp": "", "b": false, "li": false}, {"t": "    数码发展及新闻部长杨莉明在在接受新加坡媒体访问时指出，这项框架旨在为人工智能技术开发商，以及正在探索如何使用代理式人工智能的机构，提供更明确的指引，让他们了解应该注意哪些事项，才能负责任地采用这项技术。", "bp": "", "b": false, "li": false}, {"t": "    代理式人工智能（Agentic AI）是过去两年加速发展起来的一项新兴技术，在这之前全球并没有任何由政府推出，专门为这个领域制定的权威性指导原则。", "bp": "", "b": false, "li": false}, {"t": "    有别于传统的人工智能，代理式人工智能能主动判断和行动，代替用户完成任务。这能帮助机构把一些重复的工作自动化，以让员工腾出时间执行较高价值的任务，由此推动领域转型。", "bp": "", "b": false, "li": false}, {"t": "    一些较常见的应用场景包括智能客服代理、自动处理邮件，以及在物流领域自动优化排班与库存。", "bp": "", "b": false, "li": false}, {"t": "    资媒局指出，人工智能代理可能可获取一些敏感资料，并且有能力对所处的环境做出改变，例如更新顾客资料库或执行付款，因此采用这项技术可能带来一些潜在风险。人工智能可能执行错误的行动，使用者也可能因系统的能力和自主性增加而过度依赖自动化系统，导致难以对系统使用者落实有效的问责制。", "bp": "", "b": false, "li": false}, {"t": "    我国是较早采取行动管理人工智能的国家之一，2020年已就人工智能推出监管模式框架（Model AI Governance Framework），2022年推出全球首个人工智能治理测试框架和工具箱（AI Verify）。", "bp": "", "b": false, "li": false}, {"t": "    目前代理式人工智能在本地处于初步发展阶段，杨莉明指出，民众在日常生活中应该多少已和一些简单的代理式人工智能有所接触，例如聊天机器人。随着下来很可能有更多机构采用这项技术，“政府有必要尽快制定相关的管理框架”。她解释说：“尽早推出框架，由此可以更好地提早说明我们的期许，考虑发展和采用代理式人工智能的机构也能了解，我们从管理的角度认为什么是良好的代理式人工智能设计。”", "bp": "", "b": false, "li": false}]}, {"title": "《联合早报》新闻：新加坡全国人工智能理事会成立 要驾驭AI打造战略优势（删减版）", "paras": [{"t": "    新加坡将成立全国人工智能理事会，为我国人工智能化进程制定战略方向；同时推出一系列全新的人工智能发展愿景，推动四大关键领域率先落实人工智能转型，分别是先进制造业、互联互通、金融和医疗保健。", "bp": "", "b": false, "li": false}, {"t": "    黄循财总理宣布这项计划时指出，面对世界变化的新格局，如何驾驭新科技尤其人工智能（AI），将是我国的致胜关键。", "bp": "", "b": false, "li": false}, {"t": "    他说，AI正以惊人的速度发展，展现了庞大潜力：能提高生产力、解锁新发现，并以人们才刚开始理解的方式彻底改变生活。", "bp": "", "b": false, "li": false}, {"t": "    然而，无限可能也带来深刻隐忧：员工担心工作被取代，社会为假信息、偏颇观点、使用强大科技的道德问题而深感焦虑。", "bp": "", "b": false, "li": false}, {"t": "    黄总理说：“这些焦虑是真实存在的，我们必须正视。但新加坡的反应不能是恐惧。如果我们面对种种不确定因素而束手无策，终会在迅速发展的世界进程中被抛在后头。”", "bp": "", "b": false, "li": false}, {"t": "    黄总理吁请全国上下清晰而坚决地采取行动。“人工智能固然强大，但充其量也只是个工具。我们必须让这个工具符合国家和人民利益，它在新加坡如何发展使用得由我们来定义。我们必须制定明确规则、确保负责任并安全使用AI，确保能广泛惠及社会各阶层。”", "bp": "", "b": false, "li": false}, {"t": "    黄总理强调，一旦驾驭得当，AI会转化为新加坡的战略优势，帮助我国突破天然资源匮乏、人口快速老龄化、劳动力市场紧缩等结构性局限。但是要做到这一点，我国就得有意识且自律地投入资源，发挥新加坡的优势，而不是一味地只追随别人的做法。", "bp": "", "b": false, "li": false}, {"t": "   “我国的优势不在于建立最大的前沿模型，而是有效、负责任且快速地部署AI。新加坡可以成为一个值得信赖的人工智能枢纽，汇聚企业与研究员，一同开发、测试并部署有影响力的AI解决方案，而且要比许多大国做得更快、更能整合一体。” ", "bp": "", "b": false, "li": false}, {"t": "    目前，已有超过60家公司，包括谷歌和微软，在本地设立AI卓越中心。这些投资为新加坡人在AI研究、工程等方面创造更多好工作。", "bp": "", "b": false, "li": false}, {"t": "    黄总理说：“但要充分实现AI潜力，我国必须超越个别试点计划和独立实验。我们必须从国家层面组织，以速度和规模推进。”", "bp": "", "b": false, "li": false}]}]}], "dict": [{"w": "惊人", "py": "jīng rén", "cn": "使人吃惊的。", "en": "astonishing", "ex": "人工智能正以惊人的速度发展。"}, {"w": "大语言模型", "py": "dà yǔ yán mó xíng", "cn": "用大量文字训练、能理解和生成语言的人工智能。", "en": "large language model (LLM)", "ex": "ChatGPT是一种大语言模型，能回答各种问题。"}, {"w": "推理", "py": "tuī lǐ", "cn": "根据已知推出新的结论。", "en": "reasoning", "ex": "新一代AI的推理能力已接近人类。"}, {"w": "渗透", "py": "shèn tòu", "cn": "逐渐进入到各个方面。", "en": "to permeate", "ex": "人工智能已渗透到我们的学习和工作中。"}, {"w": "无限可能", "py": "wú xiàn kě néng", "cn": "有很多很多的机会和发展方向。", "en": "limitless possibilities", "ex": "AI带来无限可能，也带来深刻的顾虑。"}, {"w": "顾虑", "py": "gù lǜ", "cn": "担心，有所忧虑。", "en": "concern; worry", "ex": "许多家长对孩子使用AI做功课有顾虑。"}, {"w": "取代", "py": "qǔ dài", "cn": "代替别人的位置。", "en": "to replace", "ex": "有人担心自己的工作会被AI取代。"}, {"w": "假信息", "py": "jiǎ xìn xī", "cn": "不真实的、误导人的消息。", "en": "disinformation; fake news", "ex": "AI可以快速制造假信息，我们要学会分辨。"}, {"w": "过度依赖", "py": "guò dù yī lài", "cn": "太过依靠，失去自己的能力。", "en": "over-reliance", "ex": "过度依赖AI写作文，写作能力就会退步。"}, {"w": "疏离", "py": "shū lí", "cn": "关系变得疏远。", "en": "estranged; distant", "ex": "只和聊天机器人说话，会让人与人之间的感情疏离。"}, {"w": "恐惧", "py": "kǒng jù", "cn": "害怕。", "en": "fear", "ex": "面对AI，我们不应恐惧，而应学会善用。"}, {"w": "排斥", "py": "pái chì", "cn": "不接受，排除。", "en": "to reject", "ex": "一味排斥新科技，只会被时代抛在后头。"}, {"w": "人机共构", "py": "rén jī gòng gòu", "cn": "人类与人工智能一起合作、共同建构的时代。", "en": "human–AI co-creation", "ex": "在人机共构的时代，人类负责判断，AI负责处理数据。"}, {"w": "优势互补", "py": "yōu shì hù bǔ", "cn": "双方用自己的长处弥补对方的短处。", "en": "complementary strengths", "ex": "人类的创造力和AI的运算能力可以优势互补。"}, {"w": "战略优势", "py": "zhàn lüè yōu shì", "cn": "在长远发展上占有的有利条件。", "en": "strategic advantage", "ex": "善用AI能成为新加坡的战略优势。"}, {"w": "入门级", "py": "rù mén jí", "cn": "最基础、刚开始工作的级别。", "en": "entry-level", "ex": "一些入门级工作正被AI取代。"}, {"w": "焦虑", "py": "jiāo lǜ", "cn": "心里着急、不安。", "en": "anxiety", "ex": "即将毕业的学生对找工作感到焦虑。"}, {"w": "情书", "py": "qíng shū", "cn": "表达爱意的信。", "en": "love letter", "ex": "让AI代写情书，失去了真情实感。"}, {"w": "表情包", "py": "biǎo qíng bāo", "cn": "网络聊天时用来表达情绪的图片。", "en": "stickers; memes", "ex": "用表情包代替真实的情绪表达，交流就变得表面。"}, {"w": "屏幕", "py": "píng mù", "cn": "电脑、手机显示画面的部分。", "en": "screen", "ex": "我们不应躲在屏幕背后，忽略面对面的交流。"}, {"w": "约束", "py": "yuē shù", "cn": "限制，管束。", "en": "to restrain", "ex": "AI若不受约束地发展，可能带来社会风险。"}, {"w": "数以百万计", "py": "shù yǐ bǎi wàn jì", "cn": "数量多到要用百万来计算。", "en": "millions of", "ex": "数以百万计的工作可能受到AI冲击。"}, {"w": "动荡", "py": "dòng dàng", "cn": "不安定，不平静。", "en": "turmoil; unrest", "ex": "大规模失业可能引发社会动荡。"}, {"w": "贫富差距", "py": "pín fù chā jù", "cn": "富人与穷人之间的差别。", "en": "wealth gap", "ex": "若只有少数人懂得用AI致富，贫富差距就会扩大。"}, {"w": "干扰", "py": "gān rǎo", "cn": "打扰，影响正常进行。", "en": "to disturb; distraction", "ex": "手机通知不断，干扰了学生的学习。"}, {"w": "专注力", "py": "zhuān zhù lì", "cn": "集中精神的能力。", "en": "ability to focus", "ex": "在科技充斥的环境中，学生的专注力容易下降。"}, {"w": "信息过载", "py": "xìn xī guò zài", "cn": "信息太多，让人处理不过来。", "en": "information overload", "ex": "每天接收太多资讯，造成信息过载。"}, {"w": "海量", "py": "hǎi liàng", "cn": "数量多得像海一样。", "en": "massive amount", "ex": "AI能在几秒钟内处理海量数据。"}, {"w": "碎片化", "py": "suì piàn huà", "cn": "零零碎碎，不完整。", "en": "fragmented", "ex": "面对碎片化的信息，学生更难深入思考。"}, {"w": "虚实难分", "py": "xū shí nán fēn", "cn": "真的假的很难分辨。", "en": "hard to tell real from fake", "ex": "AI生成的图片逼真得虚实难分。"}, {"w": "筛选", "py": "shāi xuǎn", "cn": "挑出合用的，去掉不合用的。", "en": "to filter", "ex": "学生要学会筛选可靠的资料。"}, {"w": "应试教育", "py": "yìng shì jiào yù", "cn": "只以考试为目标的教育。", "en": "exam-oriented education", "ex": "在AI时代，单纯的应试教育已经不够用。"}, {"w": "常规", "py": "cháng guī", "cn": "平常的、一般的做法。", "en": "routine", "ex": "AI能轻易完成常规知识的输出。"}, {"w": "局限", "py": "jú xiàn", "cn": "限制在一定的范围内。", "en": "to be confined to", "ex": "学生若只局限于背课本，就难以应对未来的挑战。"}, {"w": "死读书", "py": "sǐ dú shū", "cn": "只会背书，不会思考和应用。", "en": "rote studying", "ex": "死读书的学生，很容易被AI比下去。"}, {"w": "批判性思维", "py": "pī pàn xìng sī wéi", "cn": "会分析、质疑和判断的思考能力。", "en": "critical thinking", "ex": "批判性思维能帮助我们判断AI的答案是否正确。"}, {"w": "淘汰", "py": "táo tài", "cn": "去除不合适的，被时代抛弃。", "en": "to be eliminated; to become obsolete", "ex": "不持续学习新技能，就可能被淘汰。"}, {"w": "学术诚信", "py": "xué shù chéng xìn", "cn": "在学习和研究中诚实、不作弊。", "en": "academic integrity", "ex": "直接抄袭AI的答案，违反了学术诚信。"}, {"w": "自律", "py": "zì lǜ", "cn": "自己约束自己。", "en": "self-discipline", "ex": "使用AI做功课需要自律，不能直接照抄。"}, {"w": "抄袭", "py": "chāo xí", "cn": "把别人的作品当作自己的。", "en": "to plagiarise", "ex": "抄袭AI生成的作文是不诚实的行为。"}, {"w": "削弱", "py": "xuē ruò", "cn": "使变弱。", "en": "to weaken", "ex": "过度使用AI会削弱学生的思考能力。"}, {"w": "真实性", "py": "zhēn shí xìng", "cn": "真实的程度。", "en": "authenticity", "ex": "抄袭会削弱学习的真实性。"}, {"w": "财政预算案", "py": "cái zhèng yù suàn àn", "cn": "政府每年公布的收入和开支计划。", "en": "Budget statement", "ex": "总理在财政预算案中宣布了多项AI计划。"}, {"w": "理事会  "政府提早说明对AI开发者的期许。"}, {"w": "驾驭", "py": "jià yù", "cn": "掌握，控制。", "en": "to harness; to master", "ex": "能否驾驭人工智能，是新加坡的致胜关键。"}, {"w": "致胜关键", "py": "zhì shèng guān jiàn", "cn": "取得成功最重要的因素。", "en": "key to winning", "ex": "持续学习是AI时代的致胜关键。"}, {"w": "解锁", "py": "jiě suǒ", "cn": "打开；比喻获得新的可能。", "en": "to unlock", "ex": "AI能帮助科学家解锁新发现。"}, {"w": "隐忧", "py": "yǐn yōu", "cn": "藏在心里的忧虑。", "en": "underlying worry", "ex": "AI带来便利，也带来隐忧。"}, {"w": "偏颇", "py": "piān pō", "cn": "偏向一方，不公正。", "en": "biased", "ex": "AI有时会给出偏颇的观点。"}, {"w": "正视", "py": "zhèng shì", "cn": "认真面对，不逃避。", "en": "to face squarely", "ex": "我们必须正视AI带来的焦虑。"}, {"w": "坚决", "py": "jiān jué", "cn": "态度坚定，不犹豫。", "en": "resolutely", "ex": "政府坚决推动AI转型。"}, {"w": "充其量", "py": "chōng qí liàng", "cn": "最多，至多。", "en": "at most", "ex": "AI再强大，充其量也只是个工具。"}, {"w": "惠及", "py": "huì jí", "cn": "使得到好处。", "en": "to benefit", "ex": "AI的发展应惠及社会各阶层。"}, {"w": "阶层", "py": "jiē céng", "cn": "社会上地位、收入相近的一群人。", "en": "social class", "ex": "政府希望AI的好处惠及不同阶层的国人。"}, {"w": "追随", "py": "zhuī suí", "cn": "跟在后面，照着做。", "en": "to follow", "ex": "新加坡不应一味追随别人的做法。"}, {"w": "前沿模型", "py": "qián yán mó xíng", "cn": "最先进、最新的AI模型。", "en": "frontier model", "ex": "新加坡的优势不在于建立最大的前沿模型。"}, {"w": "部署", "py": "bù shǔ", "cn": "安排和使用。", "en": "to deploy", "ex": "新加坡要有效、负责任且快速地部署AI。"}, {"w": "值得信赖", "py": "zhí dé xìn lài", "cn": "可以信任和依靠。", "en": "trustworthy", "ex": "新加坡希望成为值得信赖的人工智能枢纽。"}, {"w": "枢纽", "py": "shū niǔ", "cn": "事物的重要中心。", "en": "hub", "ex": "新加坡是亚洲的交通和金融枢纽。"}, {"w": "汇聚", "py": "huì jù", "cn": "聚集在一起。", "en": "to gather", "ex": "AI枢纽能汇聚世界各地的企业和研究员。"}, {"w": "卓越中心", "py": "zhuó yuè zhōng xīn", "cn": "专门研究和发展某项技术的中心。", "en": "centre of excellence", "ex": "谷歌和微软在新加坡设立AI卓越中心。"}, {"w": "试点", "py": "shì diǎn", "cn": "先在小范围里试做。", "en": "pilot", "ex": "新加坡必须超越个别试点计划，全面推动AI。"}, {"w": "规模", "py": "guī mó", "cn": "范围的大小。", "en": "scale", "ex": "政府要以速度和规模推进AI发展。"}, {"w": "互联互通", "py": "hù lián hù tōng", "cn": "各地交通、通讯互相连接。", "en": "connectivity", "ex": "互联互通是AI转型的四大关键领域之一。"}], "quiz": [{"q": "人工智能带来了哪些社会顾虑？", "o": ["担心工作被取代、假信息威胁，以及过度依赖机器引起人际情感疏离", "担心电费太贵", "担心手机电池不够用", "担心考试太难"], "a": 0, "why": "重点：面对AI，我们不应恐惧或排斥，而要建立“人机共构”的时代，把AI视为工具和“副驾驶”。"}, {"q": "下列哪一项【不是】资料提到的AI带来的学习现象？", "o": ["学生的阅读量大幅增加", "专注力下降与信息过载", "单纯应试教育失效", "引发学术诚信危机"], "a": 0, "why": "重点：三大学习现象——专注力下降与信息过载、单纯应试教育失效、学术诚信危机（直接抄袭AI内容）。"}, {"q": "为什么AI会让年轻人感到就业焦虑？", "o": ["AI正快速取代一些基础的“入门级工作”", "AI让工资大幅提高", "AI只取代高级管理职位", "AI让工作时间变长"], "a": 0, "why": "重点：政府提倡“融合人工智能的学徒制”，并探讨提早动用技能创前程补贴、扩大入职培训，降低年轻人转行的财务风险。"}, {"q": "总理在2026年财政预算案中宣布了什么？", "o": ["成立全国人工智能理事会，推动四大领域率先落实AI转型", "禁止学生使用人工智能", "取消所有入门级工作", "只发展最大的前沿模型"], "a": 0, "why": "重点：四大关键领域——先进制造业、互联互通、金融、医疗保健；同时制定明确规则确保安全负责任地使用AI。"}, {"q": "为什么说人类与AI可以“优势互补”？", "o": ["AI没有偏见和情绪、能快速处理海量数据；人类拥有情商、创造力和复杂的判断力", "AI比人类更有创造力", "人类处理数据比AI更快", "AI和人类的能力完全一样"], "a": 0, "why": "重点：人机合作能产生协同作用，做出最佳决策。"}, {"q": "为什么资料认为AI“不会抢走饭碗”，反而对新加坡有利？", "o": ["新加坡步入超老龄社会、劳动力紧缩，AI能弥补劳动力不足、提高生产力", "新加坡人口太多，需要减少工作", "新加坡天然资源丰富", "AI在新加坡不需要人来操作"], "a": 0, "why": "重点：AI帮助新加坡突破天然资源匮乏、人口快速老龄化、劳动力市场紧缩等结构性局限。"}, {"q": "为什么说AI无法完全取代人类？", "o": ["AI只是机械算法，没有真实的生命体验，无法取代人类深层的技能、经验和判断力", "AI的电力供应不稳定", "AI不会说华语", "AI只能在晚上工作"], "a": 0, "why": "重点：此外，许多物理操作的人力成本目前仍远低于AI系统的安装成本。"}, {"q": "在AI时代，所有毕业生都需要具备哪些能力？", "o": ["AI素养（如提示词工程、道德评估），以及沟通、协作、领导力和道德推理等人类核心能力", "只需要会背诵课本", "只需要会打字", "只需要会编程"], "a": 0, "why": "重点：学校也应在品德与公民教育中加强AI使用规范的教育，引导学生诚信使用AI。"}, {"q": "未来入门级员工的核心价值应从“执行”转向什么？", "o": ["对AI的“监督、整合与判断”", "更快地打字", "完全依赖AI完成工作", "只做重复性的工作"], "a": 0, "why": "重点：企业应把AI视为辅助员工的“副驾驶”，借此延长年长雇员的职业寿命并提升效率。"}, {"q": "什么是“代理式人工智能”（Agentic AI）？", "o": ["能主动判断和行动、代替用户完成任务的人工智能，如智能客服、自动处理邮件", "只能回答简单问题的计算器", "一种新型的智能手机", "由人类代理商操作的电脑"], "a": 0, "why": "重点：新加坡推出全球首个由政府主导的代理式AI监管框架，确保AI的运作最终必须由人来负责。"}, {"q": "资媒局指出代理式AI有什么潜在风险？", "o": ["可能获取敏感资料、执行错误行动，使用者也可能过度依赖而难以问责", "会让电脑变得更慢", "会让员工工资减少一半", "会让手机无法上网"], "a": 0, "why": "重点：新加坡是较早管理AI的国家——2020年推出监管模式框架，2022年推出全球首个AI治理测试工具箱（AI Verify）。"}, {"q": "黄总理认为新加坡在AI领域的优势是什么？", "o": ["有效、负责任且快速地部署AI，成为值得信赖的人工智能枢纽", "建立全世界最大的前沿模型", "拥有最多的天然资源", "完全模仿大国的做法"], "a": 0, "why": "重点：“AI充其量只是个工具”，新加坡要定义它如何发展；已有超过60家公司（包括谷歌、微软）在本地设立AI卓越中心。"}]}, "t7": {"parts": [{"bg": [{"t": "在新加坡高度竞争且快节奏的社会中，培养青少年的心理韧性至关重要。强大的心理韧性是维持身心健康的基石，能让青少年从容应对繁重的学业压力与未来的未知挑战。相反，若缺乏这种韧性，青少年在遭遇考试失利或人际挫折时，极易陷入自我怀疑，甚至引发焦虑、抑郁等心理危机，难以在逆境中重新振作。因此，强化心理韧性是确保年轻一代不被高压击垮，并能将挑战转化为成长动力的关键。", "bp": "", "b": false, "li": false}], "rows": [{"label": "青少年具备心理韧性的重要性", "kind": "impact", "paras": [{"t": "青少年需要以心理韧性面对当代生活中的挑战：", "bp": "", "b": true, "li": false}, {"t": "高压的竞争环境：在快节奏的社会中，激烈的学业竞争与高期望极易引发青少年的焦虑与心理疲惫。", "bp": "高压的竞争环境", "b": false, "li": true}, {"t": "数字时代的冲击：社交媒体上的过度攀比与潜在的网络霸凌，加剧了年轻一代的心理脆弱性。", "bp": "数字时代的冲击", "b": false, "li": true}, {"t": "未来的不确定性：面对全球化变局与经济转型，未来的挑战更加复杂多变。", "bp": "未来的不确定性", "b": false, "li": true}]}, {"label": "青少年缺乏心理韧性的后果", "kind": "impact", "paras": [{"t": "青少年时期是性格塑造和面对复杂社会交集的重要阶段。若缺乏心理韧性，遭遇挫折或高压时，往往会产生一系列负面的连锁反应。主要后果包括：", "bp": "", "b": false, "li": false}, {"t": "陷入情绪与心理危机：面对考试失利或他人批评时，他们极易陷入深度的自我怀疑和情绪崩溃中，难以进行自我疏导。长此以往，这种脆弱极易演变为长期的焦虑、抑郁等心理健康问题。", "bp": "陷入情绪与心理危机： ", "b": false, "li": true}, {"t": "习惯性逃避与“输不起”：因为极其害怕失败，他们会倾向于待在绝对安全的舒适区，遇到稍有挑战的任务就选择放弃。这不仅会导致学业或技能上的停滞，更会让他们错失发掘自身潜能的机会。", "bp": "习惯性逃避与“输不起”： ", "b": false, "li": true}, {"t": "人际关系脆弱与社交孤立：缺乏韧性的青少年往往过度在意他人的评价（即“玻璃心”），难以妥善处理正常的社交摩擦。他们可能会因为小冲突而全面封闭自我，导致缺乏同伴支持，加剧内心的孤独感。", "bp": "人际关系脆弱与社交孤立： ", "b": false, "li": true}, {"t": "采取破坏性的应对机制：为了逃避无法承受的现实压力，他们更容易寻找病态的“避风港”，例如严重沉迷于网络游戏、虚拟社交，甚至可能诉诸不良嗜好来麻痹自己。", "bp": "采取破坏性的应对机制： ", "b": false, "li": true}, {"t": "心理韧性就像肌肉，缺乏锻炼就会变得软弱无力，但通过科学的引导是完全可以后天增强的。", "bp": "", "b": false, "li": false}]}, {"label": "家长如何培养孩子的心理韧性", "kind": "action", "paras": [{"t": "家长培养孩子的韧性（逆商）的关键在于营造安全温暖的家庭环境，鼓励孩子正视挫折、独立解决问题，并进行情绪管理训练。核心方式包括允许失败、引导总结经验、给予无条件支持、培养独立性及通过体育运动增强心理承受力。 ", "bp": "", "b": false, "li": false}, {"t": "营造安全感与归属感：提供温暖、接纳的家庭环境，让孩子在遇到挫折时知道“有人支持我”，从而敢于面对挑战。", "bp": "营造安全感与归属感：", "b": false, "li": true}, {"t": "重塑失败观与归因训练：引导孩子将失败视为成长的契机，而非能力不足。教导孩子从可控因素（如努力程度、方法）分析原因，避免自我攻击。", "bp": "重塑失败观与归因训练：", "b": false, "li": true}, {"t": "引导解决问题 (LEAD法)：", "bp": "", "b": true, "li": true}, {"t": "Listen（倾听）：聆听孩子的情绪与需求。", "bp": "", "b": true, "li": true}, {"t": "Explore（界定）：一起探究问题本质。", "bp": "", "b": true, "li": true}, {"t": "Analysis（分析）：帮助分析解决方案的利弊。", "bp": "", "b": true, "li": true}, {"t": "Do（行动）：鼓励孩子自主行动。", "bp": "", "b": true, "li": true}, {"t": "鼓励独立与适当冒险：不要过早介入孩子的问题，允许他们尝试、犯错并自行修复，培养自主解决问题的能力。", "bp": "鼓励独立与适当冒险：", "b": false, "li": true}, {"t": "提升情绪管理能力：教导孩子表达情绪（如记日记、倾诉），并通过运动（如打球、跑步）释放压力。", "bp": "提升情绪管理能力：", "b": false, "li": true}, {"t": "以身作则：父母在面对自身挫折时的积极表现是孩子最好的榜样。 ", "bp": "以身作则：", "b": false, "li": true}, {"t": "总结来说，韧性教育不是让孩子避免困难，而是教会他们在困难中寻找自我修复的力量。 ", "bp": "", "b": false, "li": false}]}, {"label": "学校如何培养学生的心理韧性", "kind": "action", "paras": [{"t": "新加坡学校通过系统化的品德与公民教育课程、全方位的课程辅助活动（CCA）、鼓励“试错”的教学理念以及构建学校与家庭的心理支持体系，培养学生的心理韧性。重点在于教会学生应对失败、建立积极心态、提升社交情绪能力，并在不确定中勇于尝试。", "bp": "", "b": false, "li": false}, {"t": "课程融合与心智建设：", "bp": "课程融合与心智建设", "b": false, "li": true}, {"t": "心理健康教育：教育部将心理健康教育纳入“品德与公民教育”（CCE）课程，从小培养健康心态和心理韧性。", "bp": "心理健康教育", "b": false, "li": true}, {"t": "培养韧性关键因素：研究表明，新加坡的学校注重培养学生的自我信念、努力实践和面对挑战的应对方法。", "bp": "培养韧性关键因素", "b": false, "li": true}, {"t": "通过活动与体验培养：", "bp": "通过活动与体验培养", "b": false, "li": true}, {"t": "CCA（课程辅助活动）：学生从小学二年级起参加CCA，在体育、艺术、制服团体等活动中学习面对竞争、挫折与团队协作，直接锻炼心理韧性。", "bp": "CCA（课程辅助活动）", "b": false, "li": true}, {"t": "提供试错空间：学校鼓励学生在尝试和失败中学习，培养面对挫折、承担责任的习惯。", "bp": "提供试错空间", "b": false, "li": true}, {"t": "心理支持与辅导体系：", "bp": "心理支持与辅导体系", "b": false, "li": true}, {"t": "生态支持体系：学校打造涵盖辅导员、教师和同侪支持的健康生态，帮助学生处理压力。", "bp": "生态支持体系", "b": false, "li": true}, {"t": "同侪互助文化：推广朋辈互助，让学生相互鼓励和扶持，增强适应能力。", "bp": "同侪互助文化", "b": false, "li": true}, {"t": "与家庭合作：", "bp": "与家庭合作", "b": false, "li": true}, {"t": "家长教育：教育部门引导家长减少“直升机式”的过度保护，鼓励孩子在家庭环境中独立解决问题。", "bp": "家长教育", "b": false, "li": true}]}, {"label": "参考词语、熟语", "kind": "ref", "paras": [{"t": "逆境不顺利、充满困难的境遇。", "bp": "逆境", "b": false, "li": true}, {"t": "应用语境：描述新加坡青少年在升学或人际交往中遇到的挑战。",
