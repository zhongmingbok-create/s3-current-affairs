知重构能力——教导学生面对考试失利等挫折时，学会换个角度看问题，将其视为成长的契机。", "bp": "", "b": false, "li": true}], "items": [{"term": "逆境", "en": "adversity; difficult circumstances", "ex": "升上中学后功课突然变重，他身处逆境，却没有放弃。", "paras": [{"t": "逆境不顺利、充满困难的境遇。", "bp": "逆境", "b": false, "li": true}, {"t": "应用语境：描述新加坡青少年在升学或人际交往中遇到的挑战。", "bp": "", "b": false, "li": true}], "q": "逆境"}, {"term": "抗压能力", "en": "ability to cope with pressure", "ex": "参加外展训练营后，她的抗压能力明显提高，考试前不再那么紧张。", "paras": [{"t": "抗压能力面对压力时能够自我调节并保持心理平衡的能力。", "bp": "抗压能力", "b": false, "li": true}, {"t": "应用语境：可作为“心理韧性”的同义替换词，使行文更富变化。", "bp": "", "b": false, "li": true}], "q": "抗压能力"}, {"term": "触底反弹", "en": "to bounce back after hitting rock bottom", "ex": "中三年中考不及格后，他调整学习方法，年终考试触底反弹，成绩大有进步。", "paras": [{"t": "触底反弹原为经济学术语，现常指人在遭遇极大挫折（跌入谷底）后，凭借内心的力量重新振作并取得更好的成绩。", "bp": "触底反弹 ", "b": false, "li": true}, {"t": "应用语境：论述心理韧性带来的积极结果。", "bp": "", "b": false, "li": true}], "q": "触底反弹"}, {"term": "心理防线", "en": "psychological defence; emotional barrier", "ex": "连续几次失败后，他的心理防线全面崩溃，幸好辅导老师及时开导他。", "paras": [{"t": "心理防线人们在面对精神打击时，内心抵御负面情绪的自我保护机制。", "bp": "心理防线", "b": false, "li": true}, {"t": "应用语境：分析缺乏韧性的后果（如“心理防线全面崩溃”）。", "bp": "", "b": false, "li": true}], "q": "心理防线"}, {"term": "玻璃心", "en": "\"glass heart\" — overly fragile, easily hurt", "ex": "被老师批评几句就哭了一整天，这种“玻璃心”需要慢慢锻炼。", "paras": [{"t": "玻璃心网络流行语，指内心过于脆弱，极易受到伤害或打击。", "bp": "玻璃心", "b": false, "li": true}, {"t": "应用语境：可以在反面论证时使用，指出过度保护带来的弊端，但建议加引号。", "bp": "", "b": false, "li": true}], "q": "玻璃心"}, {"term": "百折不挠", "en": "to remain unbending despite repeated setbacks", "ex": "他参加了三次歌唱比赛都落选，仍百折不挠地练习，第四次终于获奖。", "paras": [{"t": "百折不挠无论受到多少次挫折，都毫不动摇退缩。形容意志极其坚强。", "bp": "百折不挠", "b": false, "li": true}, {"t": "论证角度：强调心理韧性中“坚持”的特质。", "bp": "", "b": false, "li": true}], "q": "百折不挠"}, {"term": "迎难而上", "en": "to face difficulties head-on", "ex": "面对困难的数学题，她选择迎难而上，而不是直接抄答案。", "paras": [{"t": "迎难而上就算知道前方有困难，依然勇敢地迎着困难前进。", "bp": "迎难而上", "b": false, "li": true}], "q": "迎难而上"}, {"term": "千锤百炼", "en": "to be tempered through countless trials", "ex": "心理韧性不是天生的，而是在一次次挫折中千锤百炼出来的。", "paras": [{"t": "千锤百炼 (qiān chuí bǎi liàn)：比喻经历多次艰苦斗争的锻炼和考验。", "bp": "千锤百炼 ", "b": false, "li": true}, {"t": "论证角度：论述心理韧性并非天生，而是后天在一次次挫折中锻炼出来的。", "bp": "", "b": false, "li": true}], "q": "千锤百炼"}, {"term": "越挫越勇", "en": "to grow braver with every setback", "ex": "队长带领球队越挫越勇，输了两场后反而赢得冠军。", "paras": [{"t": "越挫越勇遭受的打击和失败越多，反而激发出更强大的勇气和斗志。", "bp": "越挫越勇 ", "b": false, "li": true}, {"t": "论证角度：描绘拥有高度心理韧性的最高境界，把危机化为转机。", "bp": "", "b": false, "li": true}], "q": "越挫越勇"}, {"term": "宝剑锋从磨砺出", "en": "A sword's edge comes from grinding (and plum blossoms' fragrance from bitter cold).", "ex": "宝剑锋从磨砺出，梅花香自苦寒来，这次比赛的失败正是我成长的磨砺。", "paras": [{"t": "“宝剑锋从磨砺出", "bp": "", "b": true, "li": true}, {"t": "解释：宝剑的锋利和梅花的清香都是经过艰苦磨炼才得来的。", "bp": "", "b": false, "li": true}, {"t": "作文应用：常适合放在段落首尾，比喻青少年必须经历挫折的打磨，才能培养出强大的心理韧性并走向成功。", "bp": "", "b": false, "li": true}]}, {"term": "疾风知劲草", "en": "Strong grass is known in a fierce wind — true strength shows in hard times.", "ex": "疾风知劲草，会考的压力正好检验出谁真正具备心理韧性。", "paras": [{"t": "“疾风知劲草", "bp": "", "b": true, "li": true}, {"t": "解释：在猛烈的大风中才能看出什么样的草是强劲的。", "bp": "", "b": false, "li": true}, {"t": "作文应用：用于说明高压的新加坡社会（疾风）正是检验青少年心理承受能力（劲草）的最佳试金石。", "bp": "", "b": false, "li": true}], "q": "疾风知劲草"}, {"term": "温室里的花朵经不起风雨", "en": "Flowers raised in a greenhouse cannot withstand wind and rain.", "ex": "父母若事事替孩子解决，孩子就会像温室里的花朵经不起风雨。", "paras": [{"t": "“温室里的花朵经不起风雨", "bp": "", "b": true, "li": true}, {"t": "解释：在过度保护环境下成长的植物，一旦暴露在自然环境中极易夭折。", "bp": "", "b": false, "li": true}, {"t": "作文应用：绝佳的反面论证素材。用来呼吁家长和学校不要过度溺爱，应放手让孩子经历风雨，培养韧性。", "bp": "", "b": false, "li": true}]}, {"term": "塞翁失马焉知非福", "en": "A loss may turn out to be a blessing in disguise.", "ex": "没进入理想的学校，他却在新学校找到了兴趣，真是塞翁失马焉知非福。", "paras": [{"t": "“塞翁失马焉知非福。”", "bp": "", "b": true, "li": true}, {"t": "解释：比喻一时虽然受到损失，也许反而因此能得到好处。", "bp": "", "b": false, "li": true}, {"t": "作文应用：强调心理韧性中的认知重构能力——教导学生面对考试失利等挫折时，学会换个角度看问题，将其视为成长的契机。", "bp": "", "b": false, "li": true}]}]}], "arts": [{"title": "《联合早报》社论：强化青少年心理韧性乃当务之急", "paras": [{"t": "心理卫生学院的调查显示，本地有约三成青年面对严重或极度严重的抑郁、焦虑或压力症状，患精神疾病的风险较高。那些遭受网络霸凌、对身材焦虑或每天上网超过三小时的青年，较可能出现这些症状。虽然这似乎是发达富裕社会常见的情况，调查结果仍然非常让人担忧。按理说，在衣食无忧，安全有序的社会环境里，不应该出现这个现象；但事实往往存在物极必反的吊诡——或许过度安逸的环境，反而容易产生大规模的心理问题。这必须受到社会各界的共同关注。", "bp": "", "b": false, "li": false}, {"t": "调查发现，长时间使用社交媒体或是罪魁祸首.每天花超过三个小时浏览社媒平台内容的青年，出现严重或极度严重心理健康症状的概率，是一般人的一倍多。随着人工智能科技一日千里，虚拟世界和现实世界的界限越来越模糊，青少年流连在虚拟世界的时间日益增加。人们有限的注意力，已经成为流量经济激烈争夺的宝贵稀缺品；社媒算法因而反复强化刺激用户上瘾的内容推送模式。长此以往，青少年的心理健康必然受到伤害。", "bp": "", "b": false, "li": false}, {"t": "青少年心理健康是重要的课题，也是复杂的社会现象，肇因多重。除了社媒的巨大影响，青少年个人缺乏人生具体方向和目标所导致的生命意义迷惑、流行意识形态以关爱之名倡导受害者心态之实、社会物质富裕造成生活安逸和心理脆弱等，都起到推波助澜的作用。人在本性上是须要挑战的物种，如果基本生活无忧，不必为生存奋斗，个人又没有立志确定努力的目标，就容易屈服于满足短期欲望并随波逐流，甚而陷入自艾自怜或自以为是的两极病态心理，一旦遭遇挫折便轻易放弃。", "bp": "", "b": false, "li": false}, {"t": "心病还需心药医，既然青少年心理健康肇因错综复杂，药方必然就不会简单。适当地回归传统生活价值观，如重视家庭完整、建立良好的日常社交网络、寻求超越个人的宗教信仰，以获得心灵寄托等，都有助于强化自我身份意识，摆脱习得性失助等心理障碍。沉迷虚拟世界，其实意在逃避现实担当。如果现实世界有值得关注的事物，就不易出现网络成瘾的问题。这并非否认现实的苦难容易让人气馁，也并不否定青少年面对的生命彷徨，但选择面对或逃避，往往就在一念之间。", "bp": "心病还需心药医", "b": false, "li": false}, {"t": "历史表明，建国时期要求青少年成为“刚强勇猛”的新国民，一两代国人在动荡年代反而展现坚韧心理，迎难而上，成功克服困难，建设国家。这一经验值得参照。当然，当下青少年身处全然迥异的环境，所须超越的挑战具有时代的独特性，但每一代人都有自身时代的挑战要克服，因此没有理由不用普遍的标准来自我要求。在经历罕见的和平岁月后，国际社会正出现回返丛林法则的势头。在未来可能出现的弱肉强食世界里，不轻言放弃的心理韧性，或许就是决定成败存亡的关键。", "bp": "", "b": false, "li": false}, {"t": "社会对于青少年的态度，也应当从过度的关爱适当调整。成人的世界充满残酷和美好，唯有正视生活残酷的一面，才能享受美好的那一面。一些青少年宁愿固守在自己所营造的安全环境里，失去培养应对生命挑战的身心能力的机会。社会大环境强调什么价值观，对于还在探索阶段的青少年有强烈的暗示和指引作用。在富裕社会，激烈的物质竞争无关生存，更多在于名誉、权力和地位；但生命意义的全部还攸关心灵层面的修养精进。越早让青少年明白这些道理，越有助于他们建立自信。", "bp": "", "b": false, "li": false}, {"t": "心理学认为，过度重视自我，容易导致焦虑和抑郁；关心旁人和社会，有助改善这类心理状况。在当下权利意识过度膨胀的条件下，时刻聚焦“小我”自然要挤压“大我”，并衍生各类个人的心理问题。鼓励青少年从自我意识（self conscious）成长为自我觉察（self aware）——前者使得个人过于关注旁人评价，容易异化为自恋；后者使得个人培养反省能力，不断自我完善，改短期享乐为长期目标，焦虑不药自愈——能让他们蜕变为成熟有用的公民。", "bp": "心理学认为，过度重视自我，容易导致焦虑和抑郁；关心旁人和社会，有助改善这类心理状况", "b": false, "li": false}]}, {"title": "《联合早报》:培养学生心理韧性家长师长应言行身教", "paras": [{"t": "要让学生培养心理韧性，建立从失败中重新站起来的能力，家长和师长等也要透过言行身教，展现面对失败或压力时的适当反应和态度。", "bp": "", "b": false, "li": false}, {"t": "飞跃社区服务青少年部门主管及资深社工林丽萍观察到，因课业压力寻求辅导的学生有上升趋势。这除了与课业的繁重和复杂程度加剧，也可能是不少学生不再将寻求辅导视为禁忌。", "bp": "", "b": false, "li": false}, {"t": "“家长如今对孩子细心栽培，从小让他们上增益课学习‘十八般武艺’。在这样的大环境中，不少孩子的压力从学前就开始。很多因课业压力前来寻求辅导的学生，除了担心赶不上学习进度，他们主要害怕让父母失望。他们明白父母花不少金钱栽培他们……父母的失望对他们的震撼很大。”", "bp": "", "b": false, "li": false}, {"t": "林丽萍认为，心理韧性仿佛是一块“肌肉”，需要时间来锻炼，必须靠人生经历的累积磨炼出来。", "bp": "", "b": false, "li": false}, {"t": "她指出，家长应适当地让孩子了解，人生不会永远顺遂成功，而不顺遂的时候，父母的反应对培养孩子日后的韧性也很重要。", "bp": "", "b": false, "li": false}, {"t": "“当孩子表现不好，家长第一反应若是：怎么这么没用？孩子就会觉得失败是很糟糕的事，父母应该对孩子付出的努力多加肯定。”", "bp": "", "b": false, "li": false}, {"t": "此外，林丽萍建议，家长也应让孩子明白每个人的天赋不同，不要对成功做过分狭隘的定义。", "bp": "", "b": false, "li": false}, {"t": "Etern Hope辅导中心创办人李素萍认为，成年人应让孩童和青少年知道，无论他们犯错或表现不好，他们始终有安全的避风港，可寻求帮助和引导，这对他们培养心理韧性有一定帮助。", "bp": "", "b": false, "li": false}, {"t": "她指出，成人也应教导孩童加强情绪素养，包括如何抒发、缓解和表达情绪等。但成人也应言行一致，如果自己承受压力时有过度负面的情绪反应，孩子或学生都会看在眼里。", "bp": "", "b": false, "li": false}, {"t": "她强调，培养韧性不是指要孩子成为“不倒翁”。“韧性的一个核心定义是反弹的能力。也就是面对挑战时有足够心理资源去应对，即使跌倒，也能重新站起来。”", "bp": "", "b": false, "li": false}]}, {"title": "《联合早报》:科尼岛外展训练中心启用后 训练人数可增三倍", "paras": [{"t": "科尼岛外展训练中心在2020年启用后，每年为4万5000名青少年提供训练名额，这意味着每一名青少年在求学时期至少能经历一次五天的外展训练营，不再只是学生领袖才有机会参加这类活动。", "bp": "", "b": false, "li": false}, {"t": "傅海燕昨晚出席新加坡外展训练中心的庆贺晚宴时指出，外展训练营往后将成为我国年轻一代的共同经历。她坚信外展训练营的经历，能帮助年轻一代在毕业后，掌握必要技能和价值观来面对充满挑战的大环境。", "bp": "", "b": false, "li": false}, {"t": "她表示自己也对去年的外展训练营经历念念不忘。她当时和一名15岁的女生搭档，一起攀爬20米高的倒转塔。她意识到要爬到顶端，就一定要依靠伙伴，而她发现自己的小伙伴经过几天培训后，变得比自己冷静和有自信，不断指导她如何往上攀爬。", "bp": "", "b": false, "li": false}, {"t": "傅海燕说，过去50年，外展训练营对于培养年轻一代的坚韧性和吃苦精神，可说功不可没。外展训练营是在新加坡独立后不久，由当时的国防部长吴庆瑞博士提出设立。", "bp": "", "b": false, "li": false}, {"t": "国际外展训练中心当时派了两名新西兰人托马斯（Hamish Thomas）和卡梅伦（Al Cameron）协助新加坡设立外展训练营。早期的外展训练中心，是在乌敏岛废弃石场的一所小学运作，设备非常简陋。", "bp": "", "b": false, "li": false}, {"t": "傅海燕说，今天的新加坡外展训练中心，已是首屈一指的。它不仅是世界上最大的外展训练中心，还拥有最先进的设备。重要的是，参加外展训练能在很多方面改变一个人，它教人们超越极限，克服恐惧和发现潜能。", "bp": "", "b": false, "li": false}, {"t": "新加坡外展训练中心走过50个年头后即将迈入新发展阶段。傅海燕指出，50年后的今天，我们生活在一个充满不确定性，日益动荡不安的世界。新加坡的年轻一代必须能吃得起苦和具有韧性，社会也必须保持团结和有凝聚力，才能有信心面对各种挑战，为国家打造光明未来。", "bp": "", "b": false, "li": false}]}]}, {"bg": [{"t": "生活中充满各种挑战，而对于青少年而言，学习正是培养责任与担当的关键阶段。学习成果并非偶然，而是取决于个人是否愿意为自己的学习负责，例如认真听课、主动复习以及坚持克服困难。然而，有些学生却把失败归咎于环境或他人，而不愿承担责任，最终错失进步的机会。由此可见，学习不仅是获取知识的过程，更是培养责任感与担当精神的重要途径，而唯有勇于承担责任，青少年才能真正掌握自己的未来。", "bp": "", "b": false, "li": false}], "rows": [{"label": "责任的内涵", "kind": "impact", "paras": [{"t": "权责统一：选择是一种自主行为，但自由是有边界的。做出选择，就意味着必须承诺为所产生的后果负责。", "bp": "权责统一", "b": false, "li": true}, {"t": "贯穿始终的担当：责任不只是盯着光鲜的“终极结果”，它贯穿于事情的始终——始于权衡，行于决断，终于承受。", "bp": "贯穿始终的担当", "b": false, "li": true}, {"t": "过程的坚持：责任也体现在对艰难过程的坚持与承担上，即便逃避选择或不作决定，这本身也是一种消极的选择，同样无法免除责任", "bp": "过程的坚持", "b": false, "li": true}]}, {"label": "社会问题", "kind": "challenge", "paras": [{"t": "网络言论失范：在社交媒体时代，部分青少年面对令人愤怒的新闻时顺从本能宣泄情绪，充当“键盘侠”，甚至参与“网络公审”、传播虚假信息或仇恨言论，缺乏数字公民的责任感。", "bp": "网络言论失范", "b": false, "li": true}, {"t": "“躺平”心态蔓延：部分青少年面对压力时选择回避选择、放弃努力。这种看似轻松的态度实则是将人生的主导权拱手让出，不仅导致个人发展停滞、竞争力下降，还会加剧社会问题。", "bp": "“躺平”心态蔓延", "b": false, "li": true}, {"t": "缺乏公共与环保意识：例如在小贩中心用餐后将收拾托盘的责任推给清洁工，导致卫生恶化；或为了贪图方便拒绝自备环保袋，忽视了保护环境的长远社会责任。", "bp": "缺乏公共与环保意识", "b": false, "li": true}, {"t": "盲从与逃避：在面临升学或人生方向的选择时随波逐流、听天由命，不愿意思考自身志向，将责任推给运气或他人的期待", "bp": "盲从与逃避", "b": false, "li": true}]}, {"label": "为何要培养青少年的责任心？", "kind": "impact", "paras": [{"t": "对个人的意义（促进成长与成熟）：持续的自我负责是成长的关键。未来的表现不取决于过去的成绩或出身，而取决于个人的素质、贡献与当下的努力。培养责任心能让青少年懂得选择“艰难但正确的道路”，这不仅是心智成熟的标志，更能让他们不被一张成绩单定义，真正掌握人生的方向盘。", "bp": "对个人的意义（促进成长与成熟）", "b": false, "li": true}, {"t": "对社会的意义（维系和谐与活力）：社会是一个责任共同体，个人的选择会波及身边的人。只有当每个人（包括青少年）都担负起应有的责任——无论是清理餐桌维持环境优雅，还是投身社区服务照顾弱势群体，社会才能保持秩序、和谐发展并充满活力。", "bp": "对社会的意义（维系和谐与活力）", "b": false, "li": true}]}, {"label": "如何培养青少年的责任感？", "kind": "action", "paras": [{"t": "引导青少年在关键时刻做出负责任的正确抉择：教导青少年明白做出明智的选择是负责任的表现。责任贯穿于事情的始终——始于权衡，行于决断，终于承受。在人生的分岔路口，应引导他们保持清醒，看重选择所体现的价值取向，勇于选择“艰难但正确的道路”。同时要让他们明白，即使现在的选择并不完美，但只要是经过深思熟虑、符合自身实际情况的决定，并愿意承担后果，便是一种成熟与负责任的体现。", "bp": "引导青少年在关键时刻做出负责任的正确抉择", "b": false, "li": true}, {"t": "培养独立思考与理性判断的能力：引导青少年在面临升学（如选择初级学院或理工学院）或人生规划时，不随波逐流盲从主流期待，而是根据自身兴趣、特长及实际情况进行深思熟虑的抉择。", "bp": "培养独立思考与理性判断的能力", "b": false, "li": true}, {"t": "鼓励迎难而上，勇敢走出舒适圈：在面对疲惫、自我怀疑或未来的不确定性时，教导青少年学会坚持，敢于主动出击、调整方向，承担起改变与挑战带来的不确定性。", "bp": "鼓励迎难而上，勇敢走出舒适圈", "b": false, "li": true}, {"t": "从日常小事中践行利他行为：责任感建立在微小的日常选择中。鼓励青少年在网络上克制情绪以维护网络秩序，在生活中自备环保袋、主动归还托盘，将社群福祉置于个人偏好之上。", "bp": "从日常小事中践行利他行为", "b": false, "li": true}]}, {"label": "参考词语", "kind": "ref", "paras": [{"t": "1. 分水岭：比喻不同事物或同一事物不同阶段的分界。", "bp": "1. 分水岭", "b": false, "li": false}, {"t": "例：水准会考不仅是一场考试，更是学习生涯的一道分水岭，承载着未来的选择。", "bp": "例", "b": false, "li": true}, {"t": "2. 权责统一：指权利和责任是不可分割的，行使权利的同时必须承担相应的责任。", "bp": "2. 权责统一", "b": false, "li": false}, {"t": "例：在享受选择自由的同时，我们必须坚持权责统一的原则，为自己的决定承担后果。", "bp": "例", "b": false, "li": true}, {"t": "3. 随波逐流：比喻没有主见，随着潮流走。", "bp": "3. 随波逐流", "b": false, "li": false}, {"t": "例：面对未来，我们不应随波逐流，将人生的主导权交给环境或他人，而应主动做出负责任的选择。", "bp": "例", "b": false, "li": true}, {"t": "4. 迎难而上：形容不怕困难，向着困难冲上去。", "bp": "4. 迎难而上", "b": false, "li": false}, {"t": "例：真正的强者在面对人生的挑战时，会选择迎难而上，在困境中磨炼自己的意志。", "bp": "例", "b": false, "li": true}, {"t": "5. 饮水思源（引申）：比喻不忘本。在选择时考虑到社群福祉。", "bp": "5. 饮水思源", "b": false, "li": false}, {"t": "例：在做个人选择时，我们也应懂得饮水思源，考虑自己的决定对家庭和社会的影响。", "bp": "例", "b": false, "li": true}, {"t": "6. 听天由命：听任命运的摆布，不作主观努力。", "bp": "6. 听天由命", "b": false, "li": false}, {"t": "例：把未来完全交给运气是一种听天由命的消极态度，我们应该握紧人生的方向盘。", "bp": "例", "b": false, "li": true}], "items": [{"term": "分水岭", "en": "watershed; dividing line", "paras": [{"t": "1. 分水岭：比喻不同事物或同一事物不同阶段的分界。", "bp": "1. 分水岭", "b": false, "li": false}, {"t": "例：水准会考不仅是一场考试，更是学习生涯的一道分水岭，承载着未来的选择。", "bp": "例", "b": false, "li": true}], "oex": "水准会考不仅是一场考试，更是学习生涯的一道分水岭，承载着未来的选择。", "q": "分水岭"}, {"term": "权责统一", "en": "rights and responsibilities go together", "paras": [{"t": "2. 权责统一：指权利和责任是不可分割的，行使权利的同时必须承担相应的责任。", "bp": "2. 权责统一", "b": false, "li": false}, {"t": "例：在享受选择自由的同时，我们必须坚持权责统一的原则，为自己的决定承担后果。", "bp": "例", "b": false, "li": true}], "oex": "在享受选择自由的同时，我们必须坚持权责统一的原则，为自己的决定承担后果。", "q": "权责统一"}, {"term": "随波逐流", "en": "to drift with the tide; to follow the crowd without a mind of one's own", "paras": [{"t": "3. 随波逐流：比喻没有主见，随着潮流走。", "bp": "3. 随波逐流", "b": false, "li": false}, {"t": "例：面对未来，我们不应随波逐流，将人生的主导权交给环境或他人，而应主动做出负责任的选择。", "bp": "例", "b": false, "li": true}], "oex": "面对未来，我们不应随波逐流，将人生的主导权交给环境或他人，而应主动做出负责任的选择。", "q": "随波逐流"}, {"term": "迎难而上", "en": "to face difficulties head-on", "paras": [{"t": "4. 迎难而上：形容不怕困难，向着困难冲上去。", "bp": "4. 迎难而上", "b": false, "li": false}, {"t": "例：真正的强者在面对人生的挑战时，会选择迎难而上，在困境中磨炼自己的意志。", "bp": "例", "b": false, "li": true}], "oex": "真正的强者在面对人生的挑战时，会选择迎难而上，在困境中磨炼自己的意志。", "q": "迎难而上"}, {"term": "饮水思源", "en": "when drinking water, remember its source — never forget one's roots", "paras": [{"t": "5. 饮水思源（引申）：比喻不忘本。在选择时考虑到社群福祉。", "bp": "5. 饮水思源", "b": false, "li": false}, {"t": "例：在做个人选择时，我们也应懂得饮水思源，考虑自己的决定对家庭和社会的影响。", "bp": "例", "b": false, "li": true}], "oex": "在做个人选择时，我们也应懂得饮水思源，考虑自己的决定对家庭和社会的影响。", "q": "饮水思源"}, {"term": "听天由命", "en": "to leave everything to fate", "paras": [{"t": "6. 听天由命：听任命运的摆布，不作主观努力。", "bp": "6. 听天由命", "b": false, "li": false}, {"t": "例：把未来完全交给运气是一种听天由命的消极态度，我们应该握紧人生的方向盘。", "bp": "例", "b": false, "li": true}], "oex": "把未来完全交给运气是一种听天由命的消极态度，我们应该握紧人生的方向盘。", "q": "听天由命"}]}, {"label": "相关佳句", "kind": "ref", "paras": [{"t": "一念之差，天壤之别。", "bp": "", "b": true, "li": true}, {"t": "种什么因，得什么果。", "bp": "", "b": true, "li": true}, {"t": "路是自己选的，跪着也要走完。", "bp": "", "b": true, "li": true}, {"t": "选择即承担。", "bp": "", "b": true, "li": true}, {"t": "自由并非没有代价。", "bp": "", "b": true, "li": true}, {"t": "今日的决定，塑造明日的人生。", "bp": "", "b": true, "li": true}, {"t": "人可以选择方向，却无法掌控其结果。", "bp": "", "b": true, "li": true}], "items": [{"term": "一念之差", "en": "A single thought can make a world of difference.", "ex": "考试时想作弊还是坚持诚实，一念之差，天壤之别。", "box": "一念之差，天壤之别", "paras": [{"t": "一念之差，天壤之别。", "bp": "", "b": true, "li": true}]}, {"term": "种什么因", "en": "You reap what you sow.", "ex": "平时不复习，考试就考不好，种什么因，得什么果。", "box": "种什么因，得什么果", "paras": [{"t": "种什么因，得什么果。", "bp": "", "b": true, "li": true}]}, {"term": "路是自己选的", "en": "You chose this road, so finish it even on your knees.", "ex": "既然选择了理工学院的工程课程，就要坚持到底，路是自己选的，跪着也要走完。", "box": "路是自己选的，跪着也要走完", "paras": [{"t": "路是自己选的，跪着也要走完。", "bp": "", "b": true, "li": true}]}, {"term": "选择即承担", "en": "To choose is to take responsibility.", "ex": "选了自己喜欢的科目，就不能抱怨功课多，因为选择即承担。", "paras": [{"t": "选择即承担。", "bp": "", "b": true, "li": true}], "q": "选择即承担"}, {"term": "自由并非没有代价", "en": "Freedom does not come without a price.", "ex": "居家学习日可以自己安排时间，但自由并非没有代价，偷懒的后果要自己承担。", "paras": [{"t": "自由并非没有代价。", "bp": "", "b": true, "li": true}]}, {"term": "今日的决定", "en": "Today's decisions shape tomorrow's life.", "ex": "今天选择每晚读书一小时，十年后会感谢自己，因为今日的决定，塑造明日的人生。", "box": "今日的决定，塑造明日的人生", "paras": [{"t": "今日的决定，塑造明日的人生。", "bp": "", "b": true, "li": true}]}, {"term": "人可以选择方向", "en": "We can choose the direction, but not control the outcome.", "ex": "我们尽力备考，但成绩未必如愿，人可以选择方向，却无法掌控其结果。", "box": "人可以选择方向，却无法掌控其结果", "paras": [{"t": "人可以选择方向，却无法掌控其结果。", "bp": "", "b": true, "li": true}]}]}], "arts": [{"title": "《联合早报》交流站：选择是一种责任", "paras": [{"t": "     2025年剑桥O水准会考成绩将于1月14日放榜，相信不少同学和我一样，都怀揣着忐忑不安的心情。在会考成绩尚未揭晓之前，我们只能被迫学会与“不确定”共处。", "bp": "", "b": false, "li": false}, {"t": "    对许多中四学生而言，O水准考试不只是一场考试，更像是学习生涯的一道分水岭，它会总结过去的努力，也承载着未来的选择。回望过去四年，许多中四学生都会有一种“轻舟已过万重山”的感触，心中的焦虑随着会考的结束而消散，付出的心血化成释然的感慨。　　", "bp": "", "b": false, "li": false}, {"t": "    然而，仅以成绩来衡量这段艰辛的历程，未免过于单一。相信许多同学和我一样，在这段求学历程中受益匪浅。在备考的过程中，我们每天面对无数次的选择——是否在疲惫时坚持，是否在动摇时继续向前冲刺，是否在怀疑自己时咬牙前进。这些选择，未必立刻带来回报，却塑造我们面对挑战的态度和方式。选择之所以重要，不在于它是否换来理想的结果，而在于它所体现的价值取向。选择迎难而上，意味着愿意承担不确定；选择调整方向，意味着对现实作出理性判断；选择逃避，看似轻松，却往往让人生的主导权悄然旁落。即便朝着相同的终点迈进，不同的选择，会让人踏上不同的道路。", "bp": "", "b": false, "li": false}, {"t": "    会考并非终点，而是新的起点。成绩公布后，真正须要面对的，是升学方向的抉择、人生规划的思考，以及对自身能力与志向的重新认识。此时此刻，我们的选择不只是下一步的去向，更是我们是否愿意为自己的人生负责。把未来完全交给成绩、外在环境或他人的期待，或许能减轻压力或暂时逃避，却让人失去成长的机会和掌控自己人生的主导权。即使现在的选择并不完美，但只要是经过思考、符合自身实际情况的决定，它便是一种成熟的体现。", "bp": "", "b": false, "li": false}, {"t": "    成绩终会成为过去，而选择所带来的影响甚远。愿我们在分岔路口勇敢作出选择，既不被一张成绩单定义，也不逃避作出决定的责任。因为真正塑造未来的，并不是考试本身，而是我们在关键时刻，是否愿意清醒地作出选择，并承担后果。", "bp": "", "b": false, "li": false}]}]}], "dict": [{"w": "心理韧性", "py": "xīn lǐ rèn xìng", "cn": "遇到挫折后能重新站起来的心理力量。", "en": "psychological resilience", "ex": "心理韧性让她在考试失利后很快重新振作。"}, {"w": "至关重要", "py": "zhì guān zhòng yào", "cn": "非常重要。", "en": "crucial", "ex": "对青少年来说，培养心理韧性至关重要。"}, {"w": "快节奏", "py": "kuài jié zòu", "cn": "速度很快的生活方式。", "en": "fast-paced", "ex": "在快节奏的新加坡，学生每天都很忙碌。"}, {"w": "基石", "py": "jī shí", "cn": "基础，最重要的部分。", "en": "cornerstone", "ex": "心理韧性是维持身心健康的基石。"}, {"w": "从容", "py": "cóng róng", "cn": "不慌不忙，很镇定。", "en": "calm and composed", "ex": "有心理韧性的学生能从容面对考试。"}, {"w": "繁重", "py": "fán zhòng", "cn": "又多又重。", "en": "heavy; burdensome", "ex": "中三的功课很繁重，学生要学会管理时间。"}, {"w": "未知", "py": "wèi zhī", "cn": "还不知道的。", "en": "unknown", "ex": "面对未知的挑战，我们要勇敢尝试。"}, {"w": "失利", "py": "shī lì", "cn": "失败，没有成功。", "en": "to suffer a setback", "ex": "一次考试失利不代表人生失败。"}, {"w": "挫折", "py": "cuò zhé", "cn": "失败，不顺利。", "en": "setback", "ex": "成长路上难免遇到挫折。"}, {"w": "自我怀疑", "py": "zì wǒ huái yí", "cn": "不相信自己的能力。", "en": "self-doubt", "ex": "几次失败后，他陷入了自我怀疑。"}, {"w": "焦虑", "py": "jiāo lǜ", "cn": "心里着急、紧张不安。", "en": "anxiety", "ex": "考试前感到焦虑时，可以做深呼吸放松。"}, {"w": "抑郁", "py": "yì yù", "cn": "心情长期低落、不快乐。", "en": "depression", "ex": "长期的压力若得不到疏导，可能导致抑郁。"}, {"w": "危机", "py": "wēi jī", "cn": "危险的关头。", "en": "crisis", "ex": "学校及早发现学生的心理危机，提供辅导。"}, {"w": "振作", "py": "zhèn zuò", "cn": "使精神重新振奋起来。", "en": "to pull oneself together", "ex": "输了比赛后，队员们很快振作起来，继续练习。"}, {"w": "击垮", "py": "jī kuǎ", "cn": "打败，使崩溃。", "en": "to crush; to break", "ex": "强大的心理韧性让我们不被压力击垮。"}, {"w": "动力", "py": "dòng lì", "cn": "推动人前进的力量。", "en": "motivation", "ex": "把挑战转化为成长的动力。"}, {"w": "期望", "py": "qī wàng", "cn": "对未来的希望和要求。", "en": "expectation", "ex": "父母的高期望有时会给孩子带来压力。"}, {"w": "疲惫", "py": "pí bèi", "cn": "非常累。", "en": "exhausted", "ex": "连续几天熬夜温习，她感到身心疲惫。"}, {"w": "攀比", "py": "pān bǐ", "cn": "和别人比较，不肯落后。", "en": "to compare oneself with others", "ex": "在社交媒体上过度攀比，让年轻人更不快乐。"}, {"w": "网络霸凌", "py": "wǎng luò bà líng", "cn": "在网上欺负、羞辱别人。", "en": "cyberbullying", "ex": "遭受网络霸凌的学生应及时向老师求助。"}, {"w": "脆弱性", "py": "cuì ruò xìng", "cn": "容易受伤害、不够坚强的程度。", "en": "vulnerability", "ex": "网络攀比加剧了年轻一代的心理脆弱性。"}, {"w": "变局", "py": "biàn jú", "cn": "发生变化的局面。", "en": "changing situation", "ex": "面对全球化变局，年轻人要做好准备。"}, {"w": "复杂多变", "py": "fù zá duō biàn", "cn": "又复杂又经常变化。", "en": "complex and ever-changing", "ex": "未来的世界复杂多变，需要强大的适应能力。"}, {"w": "塑造", "py": "sù zào", "cn": "培养、形成（性格）。", "en": "to shape", "ex": "青少年时期是性格塑造的重要阶段。"}, {"w": "连锁反应", "py": "lián suǒ fǎn yìng", "cn": "一件事引起一连串的后果。", "en": "chain reaction", "ex": "一次失败若处理不好，可能引发一连串负面的连锁反应。"}, {"w": "情绪崩溃", "py": "qíng xù bēng kuì", "cn": "情绪完全失控。", "en": "emotional breakdown", "ex": "被批评后，他一时情绪崩溃，哭了起来。"}, {"w": "疏导", "py": "shū dǎo", "cn": "引导，使通畅；这里指调节情绪。", "en": "to channel; to relieve", "ex": "学会自我疏导，才能管理好负面情绪。"}, {"w": "长此以往", "py": "cháng cǐ yǐ wǎng", "cn": "一直这样下去。", "en": "if this goes on", "ex": "每天熬夜玩手机，长此以往，身体一定会出问题。"}, {"w": "演变", "py": "yǎn biàn", "cn": "慢慢变成。", "en": "to evolve into", "ex": "小小的误会可能演变成严重的冲突。"}, {"w": "逃避", "py": "táo bì", "cn": "躲开，不敢面对。", "en": "to escape; to avoid", "ex": "遇到问题时逃避，问题不会自己消失。"}, {"w": "舒适区", "py": "shū shì qū", "cn": "让人觉得安全、轻松、不必挑战的环境。", "en": "comfort zone", "ex": "参加演讲比赛让我走出了舒适区。"}, {"w": "停滞", "py": "tíng zhì", "cn": "停下来，不再前进。", "en": "to stagnate", "ex": "害怕失败而不敢尝试，学业就会停滞不前。"}, {"w": "错失", "py": "cuò shī", "cn": "错过，失去。", "en": "to miss (an opportunity)", "ex": "因为害怕失败而放弃，他错失了展现才华的机会。"}, {"w": "潜能", "py": "qián néng", "cn": "还没有发挥出来的能力。", "en": "potential", "ex": "挑战能帮助我们发掘自身潜能。"}, {"w": "妥善", "py": "tuǒ shàn", "cn": "妥当完善。", "en": "properly", "ex": "学会妥善处理同学之间的摩擦。"}, {"w": "封闭", "py": "fēng bì", "cn": "关起来，不与外界接触。", "en": "to close off", "ex": "受到挫折后，他把自己封闭起来，不和人说话。"}, {"w": "孤独感", "py": "gū 局与经济转型带来的不确定性。"}, {"q": "缺乏心理韧性的青少年可能出现哪些后果？", "o": ["陷入情绪危机、习惯逃避“输不起”、人际关系脆弱、采取破坏性的应对方式", "成绩一定会变得更好", "变得更喜欢挑战", "更容易交到朋友"], "a": 0, "why": "重点：心理韧性就像肌肉，缺乏锻炼会软弱无力，但可以通过科学引导后天增强。"}, {"q": "家长培养孩子心理韧性的“LEAD法”指的是什么？", "o": ["倾听、界定、分析、行动", "学习、考试、补习、休息", "领导、教育、帮助、决定", "聆听、等待、批评、处罚"], "a": 0, "why": "重点：Listen倾听情绪与需求，Explore一起探究问题本质，Analysis分析方案利弊，Do鼓励孩子自主行动。"}, {"q": "“重塑失败观与归因训练”教孩子怎样看待失败？", "o": ["把失败视为成长的契机，从努力程度、方法等可控因素分析原因", "把失败怪在运气不好", "失败说明自己能力不足", "失败了就应该马上放弃"], "a": 0, "why": "重点：避免自我攻击；韧性教育不是让孩子避免困难，而是教会他们在困难中寻找自我修复的力量。"}, {"q": "教育部门希望家长减少哪种教养方式？", "o": ["“直升机式”的过度保护", "鼓励孩子独立解决问题", "陪孩子做运动", "让孩子记日记表达情绪"], "a": 0, "why": "重点：学校通过CCE课程、CCA、试错空间、辅导员和同侪支持体系，与家庭合作培养学生心理韧性。"}, {"q": "社工林丽萍发现，很多因课业压力寻求辅导的学生最害怕什么？", "o": ["让父母失望", "没有朋友", "老师太严格", "功课太少"], "a": 0, "why": "重点：家长应肯定孩子付出的努力，让孩子明白每个人天赋不同，不要对成功做过分狭隘的定义。"}, {"q": "李素萍说韧性的核心定义是什么？", "o": ["反弹的能力——面对挑战有足够心理资源应对，即使跌倒也能重新站起来", "永远不跌倒，像“不倒翁”一样", "不让孩子遇到任何困难", "让孩子永远成功"], "a": 0, "why": "重点：成人要让孩子知道始终有安全的避风港；成人也应言行一致，自己面对压力时不要有过度负面的反应。"}, {"q": "科尼岛外展训练中心启用后带来什么改变？", "o": ["每年为4万5000名青少年提供名额，每名青少年求学时期至少能参加一次五天的外展训练营", "只让学生领袖参加外展训练", "外展训练营改为在课室里进行", "外展训练营从五天缩短为一天"], "a": 0, "why": "重点：外展训练营将成为年轻一代的共同经历，培养坚韧性和吃苦精神；由吴庆瑞博士在独立后不久提出设立。"}, {"q": "资料指出“躺平”心态有什么问题？", "o": ["看似轻松，实则把人生主导权拱手让出，导致个人发展停滞、竞争力下降", "能让人更快成功", "能增加社会活力", "能让人更有责任感"], "a": 0, "why": "重点：其他社会问题包括网络言论失范（键盘侠）、缺乏公共与环保意识、盲从与逃避。"}, {"q": "“责任贯穿于事情的始终”指的是什么？", "o": ["始于权衡，行于决断，终于承受", "始于考试，行于补习，终于放榜", "始于父母，行于老师，终于学生", "始于成功，行于失败，终于放弃"], "a": 0, "why": "重点：选择是自主行为，但自由有边界（权责统一）；逃避选择本身也是一种消极的选择，同样无法免除责任。"}, {"q": "《选择是一种责任》的作者认为会考成绩公布后，最重要的是什么？", "o": ["愿意为自己的人生负责，在分岔路口清醒地作出选择并承担后果", "把未来完全交给成绩决定", "听从别人的期待，减轻压力", "暂时逃避，不作决定"], "a": 0, "why": "重点：会考并非终点，而是新的起点；既不被一张成绩单定义，也不逃避作出决定的责任。"}]}}};

let DICT = {}, DRE = null;
function setDict(list){
  DICT = {}; list.forEach(d => DICT[d.w] = d);
  const ws = Object.keys(DICT).sort((a,b)=>b.length-a.length).map(w=>w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'));
  DRE = ws.length ? new RegExp(ws.join('|'),'g') : null;
}
function rich(t, dict=true){
  let h = esc(t);
  if (dict && DRE) h = h.replace(DRE, m => `<span class="w" role="button" tabindex="0" data-w="${m}">${m}</span>`);
  return h.replace(/\n\s*/g,'<br>');
}
function boxEx(ex, w){ const h = esc(ex), k = esc(w); return h.includes(k) ? h.replace(k, `<span class="box">${k}</span>`) : h; }
function para(p, dict=true){
  if (p.bp && p.t.startsWith(p.bp) && p.bp.trim()){
    const lead = p.t.slice(0, p.bp.length), rest = p.t.slice(p.bp.length);
    if (!lead.trim()) return rich(p.t, dict);
    return `<mark>${rich(lead.trim(), dict)}</mark>${rich(rest, dict)}`;
  }
  if (p.b) return `<mark>${rich(p.t, dict)}</mark>`;
  return rich(p.t, dict);
}
function paras(list, opts={}){
  // consecutive bullet-like paragraphs become a list
  const isHead = p => (p.b && !/[。！？.]\s*$/.test(p.t)) || (p.bp && p.bp.trim() && p.t.startsWith(p.bp) && (/^[\s：:]*$/.test(p.t.slice(p.bp.length)) || /^\s*\d+[\.．\s]/.test(p.t)));
  const isPt = p => p.li || p.b || (p.bp && p.bp.trim());
  let out = '', buf = [];
  const flush = () => { if (buf.length){ out += `<ul class="pts">${buf.map(p=>`<li>${para(p)}</li>`).join('')}</ul>`; buf = []; } };
  list.forEach(p => {
    if (!opts.flat && isHead(p)) { flush(); out += `<h3 class="sub">${rich(p.t.trim())}</h3>`; }
    else if (!opts.flat && isPt(p)) buf.push(p);
    else { flush(); out += `<p>${para(p)}</p>`; }
  });
  flush();
  return out;
}

const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
function vocabPool(th){
  const pool = [];
  th.parts.forEach(pt => pt.rows.forEach(r => (r.items||[]).forEach(it => { const e = it.ex||it.oex; if (it.q && e && e.includes(it.q)) pool.push({w:it.q, ex:e, cn:it.paras[0].t.replace(/^[\s\d\.．、]+/,'').trim(), raw:true}); })));
  th.dict.forEach(d => pool.push({w:d.w, ex:d.ex, cn:d.cn}));
  const seen = new Set();
  return pool.filter(x => !seen.has(x.w) && seen.add(x.w));
}
function buildQuiz(th){
  const A = shuffle(th.quiz).map(q => {
    const order = shuffle(q.o.map((t,i)=>i));
    return {part:'A', q:q.q, o:order.map(i=>q.o[i]), a:order.indexOf(q.a), why:q.why};
  });
  const pool = vocabPool(th);
  const B = shuffle(pool).slice(0,8).map(it => {
    const others = shuffle(pool.filter(x=>x.w!==it.w)).slice(0,3).map(x=>x.w);
    const o = shuffle([it.w, ...others]);
    return {part:'B', q:it.ex.replace(it.w,'＿＿＿＿'), o, a:o.indexOf(it.w), why: it.raw ? `答案是「${it.w}」。${it.cn}` : `答案是「${it.w}」：${it.cn}`, w:it.w};
  });
  return A.concat(B);
}

function answer(i){

  Q.ans.push({ok, pick:it.o[i]});

  $('#qfb').innerHTML = `<div class="why">${ok?'<b>✔ 答对了！</b>':`<b class="x">✘ 正确答案是 ${'ABCD'[it.a]}。</b>`}<br>${esc(it.why)}</div>

function quizDone(){
  const its = Q.items, A = its.filter(x=>x.part==='A'), B = its.filter(x=>x.part==='B');
  const sc = part => its.reduce((s,x,i)=>s+(x.part===part&&Q.ans[i].ok?1:0),0);
  const wrong = its.map((x,i)=>({x,a:Q.ans[i]})).filter(z=>!z.a.ok).map(z=>({part:z.x.part,q:z.x.q,pick:z.a.pick,right:z.x.o[z.x.a],why:z.x.why}));
  const res = {a:sc('A'), na:A.length, b:sc('B'), nb:B.length, wrong, date:new Date().toISOString(), secs:Math.round((Date.now()-Q.t0)/1000)};
  store.set('res_'+Q.id, res);

let h2cP = null;
const loadJS = src => new Promise((ok, no) => { const sc = document.createElement('script'); sc.src = src; sc.onload = ok; sc.onerror = no; document.head.appendChild(sc); });
function loadH2C(){
  if (window.html2canvas && window.jspdf) return Promise.resolve();
  return h2cP ||= Promise.all([
    window.html2canvas ? 0 : loadJS('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js'),
    window.jspdf ? 0 : loadJS('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js')
  ]);
}
function canvasToPDF(cv){
  const pdf = new window.jspdf.jsPDF({orientation:'p', unit:'mm', format:'a4'});
  const M = 10, W = 210 - M*2, H = 297 - M*2;
  const pxPerMm = cv.width / W, pageH = Math.floor(H * pxPerMm);
  // break pages on white rows so text lines are not cut
  const ctx = cv.getContext('2d');
  const x0 = Math.round(cv.width*0.08), xw = Math.round(cv.width*0.84);
  const isBlank = y => { const d = ctx.getImageData(x0, y, xw, 1).data; for (let i = 0; i < d.length; i += 16) if (d[i] < 245 || d[i+1] < 245 || d[i+2] < 245) return false; return true; };
  let y = 0, first = true;
  while (y < cv.height){
    let end = Math.min(y + pageH, cv.height);
    if (end < cv.height){ let k = end; while (k > y + pageH*0.6 && !isBlank(k)) k--; if (k > y + pageH*0.6) end = k; }
    const part = document.createElement('canvas'); part.width = cv.width; part.height = end - y;
    part.getContext('2d').drawImage(cv, 0, y, cv.width, end - y, 0, 0, cv.width, end - y);
    if (!first) pdf.addPage();
    pdf.addImage(part.toDataURL('image/jpeg', 0.92), 'JPEG', M, M, W, (end - y) / pxPerMm);
    first = false; y = end;
  }
  return pdf.output('blob');
}

  const me = store.get('me',{name:'',cls:''});
  if (!me.name){ msgEl.innerHTML = '<p class="note" style="color:var(--bad);font-weight:700">请先填写姓名，再下载报告。</p>'; return; }
  msgEl.innerHTML = '<p class="note">正在生成 PDF 报告……</p>';
  let blob;
  try{
    await loadH2C();
    const box = document.createElement('div');
    box.style.cssText = 'position:fixed;left:-10000px;top:0;z-index:-1';
    box.innerHTML = cardHTML(ids); document.body.appendChild(box);
    await new Promise(r => setTimeout(r, 120));
    const cv = await html2canvas(box.firstElementChild, {scale:2, backgroundColor:'#ffffff'});
    box.remove();
    blob = canvasToPDF(cv);
  }catch(e){ msgEl.innerHTML = '<p class="note">报告生成失败，请把成绩画面截图交给老师。</p>'; return; }
  const fn = `${me.cls||''}${me.name}_${label}_学习报告.pdf`;
  try{
    const dl = window.claude?.use ? await window.claude.use('downloads') : null;
    if (dl){ await dl.save({filename:fn, data:blob}); msgEl.innerHTML = '<p class="toast">✔ 已下载 PDF 报告，可以上载给老师了。</p>'; return; }
  }catch(e){ if (e && e.code === 'declined'){ msgEl.innerHTML = '<p class="note">已取消下载。</p>'; return; } }
  try{
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = fn; document.body.appendChild(a); a.click(); a.remove();
    msgEl.innerHTML = `<p class="note">✔ 报告已开始下载。如果没有反应，<a href="${url}" target="_blank" rel="noopener" download="${esc(fn)}" style="color:var(--tc);font-weight:700">点这里打开 PDF</a>，再用“分享／存储”保存。</p>`;
  }catch(e){ msgEl.innerHTML = '<p class="note">这个环境不支持下载，请把成绩画面截图交给老师。</p>'; }
}
function nameFields(pre){
  const me = store.get('me',{name:'',cls:''});
  return `<div class="row"><label class="field">姓名<input id="${pre}Name" value="${esc(me.name)}" autocomplete="name"></label><label class="field">班级<input id="${pre}Cls" value="${esc(me.cls)}" placeholder="如 3A3"></label></div>`;
}
function bindName(pre){
  const save = () => store.set('me', {name:$('#'+pre+'Name').value.trim(), cls:$('#'+pre+'Cls').value.trim()});
  $('#'+pre+'Name').oninput = save; $('#'+pre+'Cls').oninput = save;
}

/* ---------- router ---------- */
function route(){
  $('#sheet').classList.remove('on');
  const h = location.hash.slice(1);
  if (h === 'report') viewReport();
  else if (DATA.themes[h]) viewTheme(h);
  else viewHome();
}
$('#goHome').onclick = () => { location.hash = 'home'; };
$('#goReport').onclick = () => { location.hash = 'report'; };
addEventListener('hashchange', route);
route();
</script>
