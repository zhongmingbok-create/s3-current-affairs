<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>[hidden]{display:none!important}img{max-width:100%}body{margin:0}</style>
<title>假期时事阅读网站</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@700;900&display=swap">
<style>
/* Layout: phone-first single column; home = poster hero + 7 colour tiles; theme page = coloured hero, sticky chip nav, role-coloured sections, quiz at the end */
:root{
  --bg:#F3F5FA; --card:#FFFFFF; --ink:#161A24; --muted:#586074; --line:#E1E5EE;
  --mark:#FFF06A; --mark-ink:#161A24; --soft:#EEF1F7;
  --c-bg:#3B6FD8; --c-ch:#E0362C; --c-im:#E08A00; --c-ac:#0E9F6E; --c-ref:#8B3FD9; --c-art:#3D4558;
  --ok:#0E9F6E; --bad:#E0362C;
  --serif:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
  --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --tc:#F2690D;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10131A; --card:#1A1F2B; --ink:#EDF0F6; --muted:#A4ACBD; --line:#2A3142; --soft:#222838;
  --mark:#7A6A00; --mark-ink:#FFF8C4;
  --c-bg:#6E9BFF; --c-ch:#FF6B60; --c-im:#FFB43D; --c-ac:#3DD39A; --c-ref:#B784FF; --c-art:#B8C0D2;
  --ok:#3DD39A; --bad:#FF6B60; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10131A; --card:#1A1F2B; --ink:#EDF0F6; --muted:#A4ACBD; --line:#2A3142; --soft:#222838;
  --mark:#7A6A00; --mark-ink:#FFF8C4;
  --c-bg:#6E9BFF; --c-ch:#FF6B60; --c-im:#FFB43D; --c-ac:#3DD39A; --c-ref:#B784FF; --c-art:#B8C0D2;
  --ok:#3DD39A; --bad:#FF6B60; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:19px;line-height:1.9;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--card)}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--serif);text-wrap:balance;line-height:1.3;margin:0}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--tc);outline-offset:2px}
mark{background:linear-gradient(transparent 12%,var(--mark) 12%,var(--mark) 92%,transparent 92%);color:var(--mark-ink);font-weight:700;padding:0 2px;border-radius:2px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--card);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:10px;padding-block:10px}
.brand{font-family:var(--serif);font-weight:900;font-size:19px;display:flex;align-items:center;gap:8px;background:none;border:0;color:var(--ink);padding:0}
.brand img{width:32px;height:32px;object-fit:contain}
.dlbox{border:2px dashed var(--tc);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.dlbox>b{font-size:19px;color:var(--tc)}
.hero .eyebrow{display:flex;align-items:center;gap:8px}
.hero .eyebrow img{width:26px;height:26px}
.brand-i-unused{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:8px;background:conic-gradient(#F2690D 0 14%,#2563EB 0 28%,#0D9488 0 42%,#DB2777 0 57%,#16A34A 0 71%,#7C3AED 0 85%,#E11D48 0);color:#fff;font-style:normal;font-size:15px}
.top .sp{flex:1}
.pill{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:5px 14px;font-size:16px;font-weight:700}

/* home */
.hero{padding-block:28px 8px}
.hero .eyebrow{font-size:15px;letter-spacing:.12em;color:var(--muted);font-weight:700}
.hero h1{font-size:clamp(34px,9vw,54px);font-weight:900;margin-top:6px;letter-spacing:.02em}
.hero h1 span{background:linear-gradient(90deg,#F2690D,#DB2777 35%,#7C3AED 65%,#2563EB);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--muted);margin:10px 0 0;font-size:18px}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:20px 0 6px}
.steps div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 8px;text-align:center;font-size:15px;line-height:1.4;color:var(--muted)}
.steps b{display:block;font-family:var(--serif);font-size:18px;color:var(--ink);margin-bottom:2px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding-block:18px 40px}
@media (min-width:640px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tile{position:relative;border:0;border-radius:18px;padding:0;text-align:left;color:#fff;background:var(--c);overflow:hidden;display:flex;flex-direction:column;min-height:220px;box-shadow:0 6px 18px -10px var(--c);transition:transform .15s}
.tile:hover{transform:translateY(-3px)}
.tile .art{height:118px;display:grid;place-items:center;background:rgba(255,255,255,.14)}
.tile .art svg{width:104px;height:104px}
.tile .tx{padding:10px 14px 14px;display:flex;flex-direction:column;gap:4px;flex:1}
.tile .no{font-size:14px;font-weight:700;letter-spacing:.1em;opacity:.85}
.tile h2{font-size:25px;font-weight:900}
.tile .st{margin-top:auto;font-size:14px;font-weight:700;background:rgba(0,0,0,.18);border-radius:999px;padding:2px 10px;align-self:flex-start}
.tile.off{filter:saturate(.35);opacity:.75;cursor:default}
.tile.off:hover{transform:none}

/* theme page */
.thero{background:var(--tc);color:#fff}
.thero .wrap{display:flex;gap:14px;align-items:center;padding-block:22px 24px}
.thero .art svg{width:110px;height:110px;flex:none}
.thero .eyebrow{font-size:15px;font-weight:700;letter-spacing:.12em;opacity:.9}
.thero h1{font-size:clamp(34px,10vw,52px);font-weight:900;margin:2px 0 6px}
.thero ul{margin:0;padding:0;list-style:none;font-size:16px;line-height:1.6}
.thero li::before{content:"📰 ";}
.chips{position:sticky;top:calc(env(safe-area-inset-top,0px) + 53px);z-index:15;background:var(--bg);border-bottom:1px solid var(--line)}
.chips .wrap{display:flex;gap:8px;overflow-x:auto;padding-block:9px;scrollbar-width:none}
.chips .wrap::-webkit-scrollbar{display:none}
.chips a{flex:none;text-decoration:none;font-size:16px;font-weight:700;color:var(--k);border:1.5px solid var(--k);border-radius:999px;padding:3px 12px;background:var(--card)}
.prog{height:3px;background:var(--tc);width:0;transition:width .1s}
main.theme{padding-block:18px 60px;display:flex;flex-direction:column;gap:22px}
.partlabel{font-family:var(--serif);font-weight:900;font-size:18px;color:var(--tc);letter-spacing:.08em;border-top:2px dashed var(--line);padding-top:16px}
.sec{background:var(--card);border-radius:16px;border:1px solid var(--line);overflow:hidden;scroll-margin-top:120px}
.sec>header{background:var(--k);color:#fff;padding:12px 18px;display:flex;align-items:center;gap:10px}
.sec>header .ic{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.22);display:grid;place-items:center;font-size:16px;flex:none}
.sec>header h2{font-size:24px;font-weight:900}
.sec>header h2{min-width:0}
.sec>header small{white-space:nowrap;margin-left:auto;font-size:12px;font-weight:700;opacity:.9;letter-spacing:.06em}
.sec .bd{padding:14px 18px 18px}
.sec .bd p{margin:0 0 10px}
.sec .bd p:last-child{margin-bottom:0}
.sec h3.sub{font-family:var(--serif);font-size:20px;font-weight:900;color:var(--k);margin:16px 0 8px;padding-left:10px;border-left:5px solid var(--k);line-height:1.45}
.sec .bd>h3.sub:first-child{margin-top:0}
.sec h3.sub+p,.sec h3.sub+ul{margin-top:0}
.sec ul.pts+p,.sec ul.pts+ul{margin-top:12px}
.sec ul.pts{margin-bottom:10px!important;margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:12px}
.sec ul.pts li{position:relative;padding-left:22px}
.sec ul.pts li::before{content:"";position:absolute;left:3px;top:.62em;width:9px;height:9px;border-radius:3px;background:var(--k);transform:rotate(45deg)}
.k-bg{--k:var(--c-bg)} .k-challenge{--k:var(--c-ch)} .k-impact{--k:var(--c-im)} .k-action{--k:var(--c-ac)} .k-ref{--k:var(--c-ref)} .k-art{--k:var(--c-art)} .k-info{--k:var(--c-bg)} .k-quiz{--k:var(--tc)}
.k-art>header{background:var(--soft);color:var(--ink);border-bottom:3px solid var(--tc)}
.k-art>header .ic{background:var(--tc);color:#fff}
.k-art .bd p{text-indent:2em}
.k-art header h2{font-size:21px}
/* ref cards */
.refs{display:flex;flex-direction:column;gap:12px}
.ref{border:1.5px solid var(--line);border-left:5px solid var(--c-ref);border-radius:12px;padding:12px 14px;background:var(--card)}
.ref .orig{margin:0}
.ref .orig b{font-family:var(--serif);font-size:22px;color:var(--c-ref)}
.ref .en{margin:6px 0 0;font-size:17px;color:var(--muted);font-style:italic;line-height:1.55}
.ref .en::before{content:"EN  ";font-style:normal;font-weight:700;font-size:11px;letter-spacing:.08em;color:var(--c-ref)}
.ref .ex{margin:8px 0 0;background:var(--soft);border-radius:8px;padding:8px 12px;font-size:18px}
.ref .ex::before{content:"例句｜";font-weight:700;color:var(--c-ref)}
/* dictionary words */
.w{border-bottom:2px dotted var(--tc);cursor:pointer;border-radius:2px}
.w:hover{background:color-mix(in srgb,var(--tc) 12%,transparent)}
.box{display:inline-block;border:2px solid var(--tc);border-radius:5px;padding:0 4px;margin:0 2px;font-weight:700;line-height:1.45}
.ref .box{border-color:var(--c-ref)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:40;padding:0 max(12px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));pointer-events:none}
.sheet .in{max-width:520px;margin:0 auto;background:var(--card);border:2px solid var(--tc);border-radius:18px;box-shadow:0 18px 40px -12px rgba(0,0,0,.45);padding:14px 16px 16px;pointer-events:auto;transform:translateY(130%);transition:transform .22s ease}
.sheet:not(.on) .in{visibility:hidden}
.sheet.on .in{transform:none}
.sheet .hd{display:flex;align-items:baseline;gap:10px}
.sheet .hd b{font-family:var(--serif);font-size:30px;font-weight:900;color:var(--tc)}
.sheet .hd span{color:var(--muted);font-size:17px}
.sheet .x{margin-left:auto;border:0;background:var(--soft);color:var(--ink);width:32px;height:32px;border-radius:50%;font-size:18px;line-height:1}
.sheet dl{margin:8px 0 0;display:grid;grid-template-columns:auto 1fr;gap:6px 10px;font-size:18px;line-height:1.6}
.sheet dt{font-weight:700;color:var(--tc);font-size:15px;padding-top:3px;white-space:nowrap}
.sheet dd{margin:0;min-width:0}
/* quiz */
.qbox .bd{display:flex;flex-direction:column;gap:12px}
.qmeta{display:flex;justify-content:space-between;font-size:15px;font-weight:700;color:var(--muted)}
.qbar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden}
.qbar i{display:block;height:100%;background:var(--tc);border-radius:99px;transition:width .2s}
.qtag{display:inline-block;font-size:14px;font-weight:700;color:#fff;background:var(--tc);border-radius:6px;padding:1px 8px;margin-bottom:4px}
.qq{font-weight:700;font-size:20px;line-height:1.6}
.qq .blank{display:inline-block;min-width:4.2em;border-bottom:3px solid var(--tc);text-align:center;color:var(--tc)}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{text-align:left;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:10px 12px;line-height:1.55;display:flex;gap:10px}
.opt .l{flex:none;width:26px;height:26px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-weight:700;font-size:14px}
.opt:hover:not(:disabled){border-color:var(--tc)}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--card))}
.opt.ok .l{background:var(--ok);color:#fff}
.opt.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--card))}
.opt.no .l{background:var(--bad);color:#fff}
.opt:disabled{cursor:default}
.why{border-radius:12px;padding:12px 14px;background:var(--soft);font-size:17.5px;line-height:1.7}
.why b{color:var(--ok)} .why b.x{color:var(--bad)}
.btn{border:0;border-radius:12px;padding:12px 20px;font-weight:700;background:var(--tc);color:#fff;font-size:18px;transition:transform .12s}
.btn:active{transform:scale(.96)}
.btn.ghost{background:var(--card);color:var(--ink);border:2px solid var(--line)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.score{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.score div{border-radius:14px;background:var(--soft);padding:12px;text-align:center}
.score b{display:block;font-family:var(--serif);font-size:34px;font-weight:900;color:var(--tc);font-variant-numeric:tabular-nums;line-height:1.2}
.score span{font-size:15px;color:var(--muted);font-weight:700}
.field{display:flex;flex-direction:column;gap:4px;font-size:16px;font-weight:700;color:var(--muted);flex:1;min-width:140px}
.field input{font:inherit;font-size:18px;border:2px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--card);color:var(--ink)}
.note{font-size:16px;color:var(--muted);margin:0}
.toast{font-size:14px;font-weight:700;color:var(--ok)}
table.rep{width:100%;border-collapse:collapse;font-size:17px}
table.rep th,table.rep td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left}
table.rep td.n{font-variant-numeric:tabular-nums;font-weight:700}
.top-btn{position:fixed;right:max(14px,env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:25;width:44px;height:44px;border-radius:50%;border:0;background:var(--tc);color:#fff;font-size:20px;box-shadow:0 6px 16px -6px rgba(0,0,0,.4)}
@keyframes pop{from{transform:translateY(22px) scale(.94);opacity:.2}to{transform:none;opacity:1}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes rise{from{transform:translateY(26px);opacity:.25}to{transform:none;opacity:1}}
@keyframes shake{0%,100%{transform:none}20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
@keyframes good{0%{transform:scale(1)}40%{transform:scale(1.04)}100%{transform:scale(1)}}
@keyframes slideL{from{transform:translateX(30px);opacity:.2}to{transform:none;opacity:1}}
@keyframes grad{0%{background-position:0% 50%}100%{background-position:200% 50%}}
.tile{animation:pop .55s cubic-bezier(.2,.9,.3,1.3) both;animation-delay:calc(var(--i)*70ms)}
.tile .art svg,.thero .art svg{animation:float 3.6s ease-in-out infinite}
.hero h1 span{background-size:200% 100%;animation:grad 6s linear infinite}
.thero h1{animation:slideL .5s ease-out both}
.sec.in{animation:rise .55s ease-out both}
.qcard{animation:slideL .35s ease-out both}
.opt.ok{animation:good .4s ease}
.opt.no{animation:shake .4s ease}
.score b{animation:pop .5s cubic-bezier(.2,.9,.3,1.3) both}
.w{transition:background .15s}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:420px){.thero .art svg{width:84px;height:84px}.steps{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>

<div class="top"><div class="wrap">
  <button class="brand" id="goHome" aria-label="回到首页"><img id="logoTop" alt="华中校徽">假期时事阅读网站</button>
  <span class="sp"></span>
  <button class="pill" id="goReport">学习报告</button>
</div></div>
<div id="app"></div>
<div class="sheet" id="sheet" aria-live="polite"><div class="in" role="dialog" aria-label="小词典">
  <div class="hd"><b id="sw"></b><span id="spy"></span><button class="x" id="sx" aria-label="关闭">×</button></div>
  <dl><dt>中文意思</dt><dd id="scn"></dd><dt>English</dt><dd id="sen"></dd><dt>例句</dt><dd id="sex"></dd></dl>
</div></div>

<script>
const DATA = {"meta": [{"id": "t1", "name": "老龄化社会", "color": "#F2690D", "arts": ["正视老有所终挑战", "激活老龄实现银发红利"], "en": "Ageing Society"}, {"id": "t2", "name": "阅读文化", "color": "#2563EB", "arts": ["培养阅读成为生活习惯", "重塑深度阅读的生态"], "en": "Reading Culture"}, {"id": "t3", "name": "全面教育", "color": "#0D9488", "arts": ["教育改革须有思维转变配合", "允许孩子失败 全人教育培养好情商"], "en": "Holistic Education"}, {"id": "t4", "name": "优雅社会", "color": "#DB2777", "arts": ["从地铁风波看公共教养", "从家里开始培养正确价值观"], "en": "Gracious Society"}, {"id": "t5", "name": "环境保护", "color": "#16A34A", "arts": ["全球与净零排放的距离", "若开销不大 年长者更愿采取环保行动"], "en": "Environment"}, {"id": "t6", "name": "人工智能", "color": "#7C3AED", "arts": ["我国推出全球首个由政府主导代理式人工智能监管模式框架", "新加坡要驾驭AI打造战略优势"], "en": "Artificial Intelligence"}, {"id": "t7", "name": "心智教育", "color": "#E11D48", "arts": ["强化青少年心理韧性乃当务之急", "培养学生心理韧性 家长师长应言行身教", "科尼岛外展训练中心启用", "选择是一种责任"], "en": "Mental Wellness"}], "themes": {"t1": {"parts": [{"bg": [{"t": "过去，人们普遍把“老”与“退出职场、依赖照护”画上等号；但在新加坡，寿命延长、家庭结构变小、独居情况增多，让“如何健康、体面、持续参与社会”成为每个人都会面对的新课题。近年人口数据也显示，65岁及以上公民比例持续上升，80岁及以上人数增幅更明显，老龄化速度加快。", "bp": "", "b": false, "li": false}, {"t": "与此同时，政府也在国庆群众大会等场合强调：要让年长者不只“活得久”，更要“活得好”，并推出乐龄SG等计划，与健康SG互相配合，推动预防保健、社区联系与更适老的生活环境。", "bp": "", "b": false, "li": false}], "rows": [{"label": "老龄化社会面临的挑战：", "kind": "challenge", "paras": [{"t": "医疗与长期照护需求上升：高龄人口增加，失能、慢性病与失智症风险更高；若照护资源跟不上，医院与护理体系会承压。（例如早报社论曾引述：60岁及以上年长者中，有一定比例出现失智症症状，并强调预防与社交联系的重要。） ", "bp": "医疗与长期照护需求上升", "b": false, "li": true}, {"t": "住房房适老化：许多长者希望留在熟悉社区，但需要更安全的居家环境、紧急支援与邻里照护网络；因此出现把住宅与看护服务结合的新选项，如社区关爱组屋，提供24小时应急服务等配套。 ", "bp": "住房房适老化", "b": false, "li": true}, {"t": "劳动力与企业适应：随着社会迈向“超老龄”，单靠年轻劳动力难以支撑；企业需要重新设计岗位与工作流程，让年长员工能以更灵活方式继续工作。政府也通过提升灵活工作与兼职重雇等安排来支持年长者就业。 ", "bp": "劳动力与企业适应", "b": false, "li": true}, {"t": "数码鸿沟与社会孤立：服务与资讯越来越数码化，部分长者若缺乏数码能力，容易在日常事务、社交联系与求助渠道上“被落下”；政府早在2020年就推动“数码乐龄计划”等，帮助银发族掌握基本数码技能。 ", "bp": "数码鸿沟与社会孤立", "b": false, "li": true}, {"t": "个人与家庭的财务与照护压力：长寿意味着退休期更长；一旦出现重度失能，长期护理开销可能巨大。全国性重度残障保险“终身护保”（CareShield Life）正是为了应对长期护理风险，并在近年的检讨中调整赔付增幅等设计以维持可持续。", "bp": "个人与家庭的财务与照护压力", "b": false, "li": true}]}, {"label": "老龄化社会的影响与意义：", "kind": "impact", "paras": [{"t": "重新定义“老”的角色：年长者不只是被照护者，也可以是经验与技能的贡献者。随着退休与重雇年龄逐步上调，越来越多55岁以上居民继续在职场发挥所长。 ", "bp": "重新定义“老”的角色", "b": false, "li": true}, {"t": "推动社会从“治病”转向“预防+社区”：乐龄SG与健康SG强调让人们更早介入健康管理，把支持网络迁移到社区与日常生活。 ", "bp": "推动社会从“治病”转向“预防+社区”", "b": false, "li": true}, {"t": "银发不是“负担”，也可能是“红利”：关键在于让长者保持健康、参与与连结，把经验、消费与志愿力量转化为社会动能（早报亦有相关社论讨论“银发红利”的思路）。", "bp": "银发不是“负担”，也可能是“红利”", "b": false, "li": true}]}, {"label": "如何应对老龄化社会：", "kind": "action", "paras": [{"t": "建立“社区为本”的乐龄网络（活跃、联系、可求助）：扩大活跃乐龄中心与社区活动，让长者更容易社交、运动、学习，降低孤立与身心退化风险；乐龄SG也通过跨部门方式优化社区设施与服务。 ", "bp": "建立“社区为本”的乐龄网络", "b": false, "li": true}, {"t": "让住房与社区空间更适老：推广适老化住宅与配套服务，例如社区关爱组屋，把“住家+照护+紧急支援”结合，减少独居风险与家庭照护压力。", "bp": "让住房与社区空间更适老", "b": false, "li": true}, {"t": "让工作制度“对年龄更友好”：继续推动岗位再设计、灵活工时与兼职重雇，配合退休与重雇年龄调整，让有意愿、有能力的长者继续工作，同时缓解人力紧张。 ", "bp": "让工作制度“对年龄更友好”", "b": false, "li": true}, {"t": "补上数码能力缺口：通过“数码乐龄计划”等，让长者能使用电子服务、与家人朋友保持联系，也更容易获得社区与政府支援。 ", "bp": "补上数码能力缺口", "b": false, "li": true}, {"t": "提前分担长期护理风险：提高公众对长期护理与失能风险的意识，善用终身护保等制度安排，把“突然需要照护”带来的财务冲击降到最低。 ", "bp": "提前分担长期护理风险", "b": false, "li": true}, {"t": "强化医疗—社区—照护的协作：通过更顺畅的信息与转介机制，让需要帮助的年长者更快被社区伙伴接住，减少“没人发现、没人跟进”的断层。", "bp": "强化医疗—社区—照护的协作", "b": false, "li": true}]}, {"label": "参考词句：", "kind": "ref", "paras": [{"t": "银发浪潮：形容人口结构快速迈向高龄化。", "bp": "银发浪潮", "b": false, "li": true}, {"t": "未雨绸缪：及早为退休、健康与长期护理做准备。", "bp": "未雨绸缪", "b": false, "li": true}, {"t": "在地养老：尽量让长者在熟悉社区生活，并获得所需支援。", "bp": "在地养老", "b": false, "li": true}, {"t": "老有所为／老有所用：强调年长者持续参与、贡献社会。", "bp": "老有所为／老有所用", "b": false, "li": true}, {"t": "延年益寿不如“健康长寿”：活得久，更要活得有质量。", "bp": "延年益寿不如“健康长寿”", "b": false, "li": true}], "items": [{"term": "银发浪潮", "en": "silver tsunami — a rapid rise in the share of older people in a population", "ex": "面对银发浪潮，新加坡必须及早增设社区护理设施，让更多长者在熟悉的环境中安享晚年。", "q": "银发浪潮", "paras": [{"t": "银发浪潮：形容人口结构快速迈向高龄化。", "bp": "银发浪潮", "b": false, "li": true}]}, {"term": "未雨绸缪", "en": "to prepare in advance; to plan ahead before problems arrive", "ex": "年轻人应未雨绸缪，及早为退休储蓄，并了解终身护保等长期护理保障。", "q": "未雨绸缪", "paras": [{"t": "未雨绸缪：及早为退休、健康与长期护理做准备。", "bp": "未雨绸缪", "b": false, "li": true}]}, {"term": "在地养老", "en": "ageing in place — growing old in one's own home and community", "ex": "社区关爱组屋提供24小时应急服务，让独居长者也能在地养老，不必搬进养老院。", "q": "在地养老", "paras": [{"t": "在地养老：尽量让长者在熟悉社区生活，并获得所需支援。", "bp": "在地养老", "b": false, "li": true}]}, {"term": "老有所为／老有所用", "en": "older people can still contribute and remain useful to society", "ex": "许多乐龄人士退休后到活跃乐龄中心当义工，教导年轻人传统手艺，真正做到老有所为。", "q": "老有所为", "box": "老有所为", "paras": [{"t": "老有所为／老有所用：强调年长者持续参与、贡献社会。", "bp": "老有所为／老有所用", "b": false, "li": true}]}, {"term": "延年益寿不如“健康长寿”", "en": "living a long life matters less than living a long and healthy life", "ex": "政府推动健康SG，鼓励长者定期运动和检查身体，因为延年益寿不如“健康长寿”，活得久更要活得好。", "paras": [{"t": "延年益寿不如“健康长寿”：活得久，更要活得有质量。", "bp": "延年益寿不如“健康长寿”", "b": false, "li": true}]}]}], "arts": [{"title": "《联合早报》社论：正视老有所终挑战 （删减版）", "paras": [{"t": "“家庭是我国社会的基石”；让更多年长者能如愿地安心原地养老，是新加坡即将迈入超老龄化社会最迫在眉睫的挑战。", "bp": "", "b": false, "li": false}, {"t": "无论是否有子女或孤苦伶仃，让年长者在养老设施终老，毕竟还是无奈之举。相信很多人都会同意，自己的家才是最温暖的。因此，原地养老的好处在于熟悉的居家环境，为适应新环境能力减弱的年长者带来安全感，维持生活品质所需的心理因素。所以，政府通过组屋屋契回购计划，让年长者有足够的经济条件，满足原地养老的愿望。此外，社区关爱组屋等结合住宅和看护模式的新类别组屋，则进一步为有需要的年长者提供基本的照顾护理服务，让晚年家居生活更有保障。", "bp": "", "b": false, "li": false}, {"t": "但是，独居老人日益普遍化的现象，依然是现代城市居住环境相对棘手的难题。一是不婚不育的单身群体日益增多，使得独居老人的数量势必增加。二是现代小家庭结构的现实，以及组屋居住空间的限制，孩子长大成家后大多分开独立生活，年长者丧偶后必然要面对独居的困扰。所以，减少年长者独居的挑战，恐怕须要从改变既有的家庭观念，以及住房政策入手。", "bp": "", "b": false, "li": false}, {"t": "       如何让年长者形成互助社群，为他们提供及时的护理，降低孤独死的隐患，必须集思广益，从多层面入手寻找应对方案。至今的讨论，基本还是按照现有的社会现状谋求答案，比如养老院、聘请女佣在家陪伴，或设立社区关爱组屋以及垂直甘榜等设施。旧有的三代同堂组屋虽然能部分解答这一难题，然而家庭代际关系要克服“相处易，同住难”的障碍，毕竟不简单。科技如人工智能等对社会乃至人际关系的冲击，可能潜藏破局的密码。", "bp": "", "b": false, "li": false}, {"t": "釜底抽薪之道，必须着眼于从扭转社会对现有家庭的观念，强化亲子甚而家庭三代人的关系，探讨如何在新科技使得人际情感越来越疏离的当下，审视家庭内部的责任分工和互动模式。用更多的时间和关注，维系家人之间的情谊。", "bp": "釜底抽薪", "b": false, "li": false}, {"t": "     《礼记》所描绘的“老有所终，壮有所用，幼有所长，鳏寡孤独废疾者皆有所养”理想社会，不必然是空中楼阁，特别是在拥有更多资源的富裕社会，只要有认识、有决心，老年生活依然能够丰富多彩，充满人生意义。", "bp": "", "b": false, "li": false}]}, {"title": "《联合早报》社论：激活老龄实现银发红利（删减版）", "paras": [{"t": "    新加坡人口老龄化加速，社会越来越关注如何让年长者过上有尊严、有意义的晚年生活。据调查显示，许多乐龄人士对衰老并不抗拒，明白身体不可避免会退化，他们更担心的是，有朝一日失去在生活中维持财务、工作和社交等方面的自主能力。", "bp": "", "b": false, "li": false}, {"t": "    调查发现，不同性别的乐龄人士在退休后，面临不同需求与挑战。男性的身份认同往往与工作紧密相连，一旦退出职场，容易因面子或不善表达而陷入社交孤立；相较之下，女性较能通过宗教团体、邻里网络或社区活动维持联系。这意味着，政府在设计政策和措施时不能一刀切，而须认清不同性别的行为模式与心理动因，回应不同群体的现实需求。", "bp": "", "b": false, "li": false}, {"t": "    人类寿命不断在延长，1974年新加坡人的预期寿命仅为73.3岁，2024年已升至约83.5岁，社会因此必须重新思考“老”的定义，法定退休年龄不应被视作人生分界点。事实上，年长者依然能享受有姿彩的生活，他们同时也是宝贵社会资源而非负担，不仅能够缓解劳动力短缺，还可以将丰富的行业经验、职业技能和社会资本，传递给年轻一代。", "bp": "", "b": false, "li": false}, {"t": "    许多六七十岁的乐龄人士不再把自己视为“退休者”，而是积极寻找继续贡献、学习和参与社会的空间。他们的观念与上一代截然不同，更愿意保持生产力、维持社交圈、追求个人兴趣和自我价值。在这样的趋势下，企业与政府应顺势而为，扩大选择、降低门槛，让愿意继续发挥所长的年长者，有机会继续参与。例如，提供更多弹性工作、再培训渠道、阶段性退休模式，以及多样化的社区与跨代活动，让不同能力、性格的年长者都能找到适合自己发挥的角色。", "bp": "", "b": false, "li": false}, {"t": "    对于一些年长者而言，工作可维持生活目标感和自我价值感，新加坡在这方面已有实践探索：未来几个月，将有32家机构试行针对年长员工的解决方案，包括根据兴趣安排岗位、将工作调整为二至四小时的兼职或“微型工作”，并提供重回职场的培训机会。这些试点方案体现“以人为本”的设计理念，既满足年长者自主选择的需求，也帮助企业保留宝贵的人才经验。", "bp": "", "b": false, "li": false}, {"t": "    社区活动同样要“因人设计”。乐龄人士的兴趣和需求各不相同，活动不应仅限于唱歌、跳舞或手工，活跃乐龄中心应提供更多元化的选择。例如慈济基金会日前开幕的悦活坊（南洋），便设有健身房、茶室、中医室、烹饪空间和咖啡馆等，甚至提供音乐拳击机、战绳与悬挂训练器等新颖健身设备。这样的设计能帮助不同性格的乐龄人士，以最自然、最符合自身习惯的方式，重新建立自信与社会联系。", "bp": "", "b": false, "li": false}]}]}], "dict": [{"w": "普遍", "py": "pǔ biàn", "cn": "存在的面很广，很多人都这样。", "en": "common; widespread", "ex": "在新加坡，乐龄人士到社区中心做运动已经很普遍。"}, {"w": "画上等号", "py": "huà shàng děng hào", "cn": "认为两件事完全一样。", "en": "to equate two things", "ex": "我们不应把年老和没有用画上等号。"}, {"w": "退出职场", "py": "tuì chū zhí chǎng", "cn": "离开工作岗位，不再上班。", "en": "to leave the workforce", "ex": "陈伯伯退出职场后，每天到社区中心教人下棋。"}, {"w": "依赖", "py": "yī lài", "cn": "依靠别人或别的事物，自己不能独立。", "en": "to depend on; to rely on", "ex": "不少长者行动不便，必须依赖家人接送去看医生。"}, {"w": "照护", "py": "zhào hù", "cn": "照顾和护理。", "en": "care; ity", "ex": "长者在活跃乐龄中心组成新的社群，互相关心。"}, {"w": "隐患", "py": "yǐn huàn", "cn": "潜藏着的危险或祸患。", "en": "hidden danger", "ex": "独居长者在家跌倒无人发现，是很大的安全隐患。"}, {"w": "集思广益", "py": "jí sī guǎng yì", "cn": "集中众人的智慧，吸收有益的意见。", "en": "to pool everyone's ideas", "ex": "政府与社区团体集思广益，推出多项帮助长者的活动。"}, {"w": "层面", "py": "céng miàn", "cn": "事物的某个方面或范围。", "en": "level; aspect", "ex": "照顾长者需要从家庭、社区和国家多个层面入手。"}, {"w": "谋求", "py": "móu qiú", "cn": "设法寻找、争取。", "en": "to seek", "ex": "政府不断谋求更好的方法照顾独居长者。"}, {"w": "垂直甘榜", "py": "chuí zhí gān bǎng", "cn": "把住宅、医疗、社区设施集中在一栋高楼里，像以前的甘榜（乡村）一样邻里互助。", "en": "vertical kampung", "ex": "海军部村庄是新加坡第一个垂直甘榜，长者在楼里就能看病、买菜。"}, {"w": "三代同堂", "py": "sān dài tóng táng", "cn": "祖父母、父母、孙子女三代人住在一起。", "en": "three generations under one roof", "ex": "三代同堂的家庭，长者随时有家人照顾。"}, {"w": "代际", "py": "dài jì", "cn": "不同年代的人之间。", "en": "intergenerational", "ex": "学校邀请祖父母到校一起种菜，促进代际交流。"}, {"w": "潜藏", "py": "qián cáng", "cn": "隐藏在里面。", "en": "to lie hidden", "ex": "科技虽然带来冲击，但也潜藏着帮助长者的机会。"}, {"w": "破局", "py": "pò jú", "cn": "打破困难的局面，找到出路。", "en": "to break a deadlock", "ex": "善用科技，可能是解决独居老人问题的破局之道。"}, {"w": "釜底抽薪", "py": "fǔ dǐ chōu xīn", "cn": "把锅底下的柴火抽掉，比喻从根本上解决问题。", "en": "to solve a problem at its root", "ex": "要减少独居老人，釜底抽薪的做法是重建家人之间的联系。"}, {"w": "扭转", "py": "niǔ zhuǎn", "cn": "改变事情原来的方向或情况。", "en": "to reverse; to turn around", "ex": "我们要扭转“年老就没用”的错误观念。"}, {"w": "观念", "py": "guān niàn", "cn": "对事物的看法和想法。", "en": "mindset; concept", "ex": "年轻一代应改变观念，多花时间陪伴祖父母。"}, {"w": "审视", "py": "shěn shì", "cn": "仔细地看，认真检查。", "en": "to examine closely", "ex": "每个家庭都应审视自己如何分担照顾长辈的责任。"}, {"w": "疏离", "py": "shū lí", "cn": "关系变得疏远，不亲近。", "en": "estranged; distant", "ex": "大家只顾看手机，家人之间的感情越来越疏离。"}, {"w": "维系", "py": "wéi xì", "cn": "维持并联系，使不分散。", "en": "to maintain (ties)", "ex": "每周一起吃饭，有助维系祖孙三代的感情。"}, {"w": "情谊", "py": "qíng yì", "cn": "人与人之间的感情。", "en": "bond; friendship", "ex": "邻居多年的情谊，让独居的王婆婆不感到孤单。"}, {"w": "鳏寡孤独", "py": "guān guǎ gū dú", "cn": "指失去妻子、丈夫、父母或子女的人，泛指没有依靠的人。", "en": "the widowed, orphaned and childless; those with no one to depend on", "ex": "一个理想的社会，应让鳏寡孤独的人都得到照顾。"}, {"w": "空中楼阁", "py": "kōng zhōng lóu gé", "cn": "比喻脱离现实、无法实现的理想。", "en": "castle in the air", "ex": "只要全社会共同努力，“老有所终”的理想就不是空中楼阁。"}, {"w": "富裕", "py": "fù yù", "cn": "财物很多，生活充足。", "en": "affluent; wealthy", "ex": "新加坡是富裕的社会，更应该好好照顾长者。"}, {"w": "丰富多彩", "py": "fēng fù duō cǎi", "cn": "内容多，样式多。", "en": "rich and colourful", "ex": "长者参加各种兴趣班，退休生活过得丰富多彩。"}, {"w": "尊严", "py": "zūn yán", "cn": "受人尊重的地位和身份。", "en": "dignity", "ex": "让长者有尊严地生活，是社会的共同责任。"}, {"w": "抗拒", "py": "kàng jù", "cn": "抵抗，拒绝接受。", "en": "to resist", "ex": "有些长者抗拒使用助行器，担心别人觉得他们老了。"}, {"w": "衰老", "py": "shuāi lǎo", "cn": "年纪大了，身体变弱。", "en": "ageing; growing old", "ex": "衰老是自然现象，最重要的是保持健康的心态。"}, {"w": "退化", "py": "tuì huà", "cn": "身体或能力变得比以前差。", "en": "to deteriorate; to decline", "ex": "多做运动和动脑，可以减慢身体与记忆力的退化。"}, {"w": "有朝一日", "py": "yǒu zhāo yī rì", "cn": "将来有一天。", "en": "one day (in the future)", "ex": "许多长者担心有朝一日要靠子女照顾，成为家人的负担。"}, {"w": "自主", "py": "zì zhǔ", "cn": "自己做主，不受别人支配。", "en": "autonomous; independent", "ex": "长者最希望保有自主生活的能力，不必事事求人。"}, {"w": "身份认同", "py": "shēn fèn rèn tóng", "cn": "一个人怎样看待“我是谁”。", "en": "sense of identity", "ex": "对很多男性来说，工作是身份认同的重要部分。"}, {"w": "紧密相连", "py": "jǐn mì xiāng lián", "cn": "关系非常密切，连在一起。", "en": "closely linked", "ex": "长者的心理健康与社交生活紧密相连。"}, {"w": "面子", "py": "miàn zi", "cn": "在别人面前的体面、名声。", "en": "face; reputation", "ex": "有些伯伯为了面子，不愿意向别人求助。"}, {"w": "不善表达", "py": "bù shàn biǎo dá", "cn": "不擅长说出自己的想法和感受。", "en": "not good at expressing oneself", "ex": "不善表达的长者，更需要家人主动关心。"}, {"w": "社交孤立", "py": "shè jiāo gū lì", "cn": "跟别人很少来往，被隔离在社交圈外。", "en": "social isolation", "ex": "退休后不出门，很容易陷入社交孤立。"}, {"w": "一刀切", "py": "yī dāo qiē", "cn": "不考虑不同情况，用同一种办法处理所有问题。", "en": "one-size-fits-all", "ex": "乐龄活动不能一刀切，应照顾男性与女性长者的不同需要。"}, {"w": "动因", "py": "dòng yīn", "cn": "促使人去做某事的原因。", "en": "motive; driving factor", "ex": "了解长者参加活动的心理动因，才能设计出吸引他们的活动。"}, {"w": "预期寿命", "py": "yù qī shòu mìng", "cn": "一个人平均估计能活到的岁数。", "en": "life expectancy", "ex": "新加坡人的预期寿命已超过83岁。"}, {"w": "法定退休年龄", "py": "fǎ dìng tuì xiū nián líng", "cn": "法律规定的退休年龄。", "en": "statutory retirement age", "ex": "法定退休年龄上调后，长者可以工作得更久。"}, {"w": "分界点", "py": "fēn jiè diǎn", "cn": "把两个阶段分开的地方。", "en": "dividing point", "ex": "退休不应是人生的分界点，而是新生活的开始。"}, {"w": "姿彩", "py": "zī cǎi", "cn": "色彩、风采；形容生活多姿多彩。", "en": "colour; vibrancy", "ex": "学习新技能让陈安娣的退休生活更有姿彩。"}, {"w": "短缺", "py": "duǎn quē", "cn": "缺少，不够。", "en": "shortage", "ex": "长者重回职场，有助缓解劳动力短缺。"}, {"w": "社会资本", "py": "shè huì zī běn", "cn": "一个人拥有的人脉、关系和社会网络。", "en": "social capital", "ex": "长者累积的社会资本，可以帮助年轻人建立人脉。"}, {"w": "截然不同", "py": "jié rán bù tóng", "cn": "完全不一样。", "en": "completely different", "ex": "今天的乐龄人士与上一代的观念截然不同。"}, {"w": "生产力", "py": "shēng chǎn lì", "cn": "工作的效率和产出能力。", "en": "productivity", "ex": "善用长者的经验，可以提高企业的生产力。"}, {"w": "自我价值", "py": "zì wǒ jià zhí", "cn": "觉得自己有用、有意义。", "en": "self-worth", "ex": "做义工让退休长者重新找到自我价值。"}, {"w": "顺势而为", "py": "shùn shì ér wéi", "cn": "顺着事情发展的趋势采取行动。", "en": "to act in line with the trend", "ex": "越来越多长者想工作，企业应顺势而为，提供弹性工作。"}, {"w": "门槛", "py": "mén kǎn", "cn": "进入某个范围必须达到的条件或标准。", "en": "threshold; barrier to entry", "ex": "降低课程报名门槛，让更多长者可以参加。"}, {"w": "弹性工作", "py": "tán xìng gōng zuò", "cn": "上班时间和地点可以灵活调整的工作安排。", "en": "flexible work arrangement", "ex": "弹性工作让照顾孙子的长者也能上班。"}, {"w": "再培训", "py": "zài péi xùn", "cn": "重新接受训练，学习新技能。", "en": "retraining", "ex": "政府资助长者参加再培训课程，学习电脑技能。"}, {"w": "阶段性退休", "py": "jiē duàn xìng tuì xiū", "cn": "一步一步减少工作，慢慢退休。", "en": "phased retirement", "ex": "阶段性退休让员工先改做兼职，再完全退休。"}, {"w": "跨代", "py": "kuà dài", "cn": "不同世代之间的。", "en": "cross-generational", "ex": "跨代活动让学生和长者一起学习，彼此了解。"}, {"w": "目标感", "py": "mù biāo gǎn", "cn": "觉得生活有方向、有目标的感觉。", "en": "sense of purpose", "ex": "每天有事可做，让退休长者保持目标感。"}, {"w": "试行", "py": "shì xíng", "cn": "先试着实行，看看效果。", "en": "to pilot; to trial", "ex": "一些机构试行“微型工作”，让长者每天只工作几小时。"}, {"w": "微型工作", "py": "wēi xíng gōng zuò", "cn": "时间很短的小份工作，如每天两至四小时。", "en": "micro-job", "ex": "微型工作让体力有限的长者也能赚取收入。"}, {"w": "试点", "py": "shì diǎn", "cn": "先在小范围里试做的地方或计划。", "en": "pilot (project)", "ex": "这项乐龄就业试点计划成功后，将推广到更多公司。"}, {"w": "以人为本", "py": "yǐ rén wéi běn", "cn": "一切从人的需要出发。", "en": "people-centred", "ex": "以人为本的设计，让长者的需要被放在第一位。"}, {"w": "理念", "py": "lǐ niàn", "cn": "想法、信念和原则。", "en": "philosophy; concept", "ex": "这所乐龄中心的理念是让长者“活得开心、活得精彩”。"}, {"w": "因人设计", "py": "yīn rén shè jì", "cn": "根据不同的人的需要来设计。", "en": "tailored to each person", "ex": "活动要因人设计，喜欢安静的长者可以去茶室下棋。"}, {"w": "多元化", "py": "duō yuán huà", "cn": "种类多，有很多不同的选择。", "en": "diversified", "ex": "乐龄中心提供多元化的课程，有烹饪、健身和电脑课。"}, {"w": "新颖", "py": "xīn yǐng", "cn": "新鲜别致，跟以前不一样。", "en": "novel; new and original", "ex": "音乐拳击机这种新颖的健身器材，吸引了不少长者尝试。"}], "quiz": [{"q": "新加坡人口老龄化呈现什么趋势？", "o": ["65岁及以上公民比例持续上升，80岁及以上人数增幅更明显", "65岁及以上公民比例上升，但80岁及以上人数开始减少", "老龄化速度逐渐放缓，长者比例趋于稳定", "长者人数增加，主要因为出生率上升"], "a": 0, "why": "重点：65岁及以上公民比例持续上升，80岁及以上人数增幅更明显——老龄化速度正在加快。"}, {"q": "下列哪一项【不属于】老龄化社会面临的挑战？", "o": ["社会从“治病”转向“预防+社区”", "医疗与长期照护需求上升", "数码鸿沟与社会孤立", "劳动力与企业适应"], "a": 0, "why": "重点：五大挑战是①医疗与长期照护需求上升 ②住房适老化 ③劳动力与企业适应 ④数码鸿沟与社会孤立 ⑤个人与家庭的财务与照护压力。“从治病转向预防+社区”是老龄化带来的影响与意义。"}, {"q": "政府提出要让年长者不只“活得久”，更要“活得好”。为此推出的乐龄SG计划，与哪个计划互相配合？", "o": ["健康SG", "技能创前程", "数码乐龄计划", "屋契回购计划"], "a": 0, "why": "重点：乐龄SG与健康SG互相配合，推动预防保健、社区联系与更适老的生活环境。"}, {"q": "乐龄SG与健康SG共同强调的方向是什么？", "o": ["更早介入健康管理，把支持网络迁移到社区与日常生活", "兴建更多大型医院，集中治疗患病长者", "鼓励长者搬进养老院，减轻家庭负担", "提高医疗津贴，让长者生病后能免费住院"], "a": 0, "why": "重点：社会要从“治病”转向“预防+社区”——更早介入健康管理，把支持网络迁移到社区。"}, {"q": "社区关爱组屋结合了哪两样东西，帮助长者“在地养老”？", "o": ["住宅与看护服务", "养老院与医院", "学校与社区中心", "商场与诊所"], "a": 0, "why": "重点：社区关爱组屋把“住家+照护+紧急支援”结合，提供24小时应急服务，减少独居风险与家庭照护压力。"}, {"q": "哪一项安排是为了减轻长期护理带来的财务冲击？", "o": ["终身护保（CareShield Life）", "数码乐龄计划", "社区关爱组屋", "兼职重雇"], "a": 0, "why": "重点：长寿意味着退休期更长，重度失能时长期护理开销可能巨大；全国性重度残障保险“终身护保”就是为应对长期护理风险。"}, {"q": "政府早在2020年推动“数码乐龄计划”，主要想解决什么问题？", "o": ["长者缺乏数码能力，在日常事务、社交与求助上“被落下”", "长者看病的医药费太高", "企业缺乏年轻员工", "组屋居住空间不足"], "a": 0, "why": "重点：数码鸿沟会造成社会孤立。数码乐龄计划帮助银发族掌握基本数码技能，使用电子服务、与家人朋友保持联系。"}, {"q": "下列哪一项是让工作制度“对年龄更友好”的做法？", "o": ["推动岗位再设计、灵活工时与兼职重雇", "规定员工到了60岁一律退休", "只让年长员工做清洁和保安工作", "鼓励企业只聘请年轻员工以提高效率"], "a": 0, "why": "重点：岗位再设计、灵活工时、兼职重雇，配合退休与重雇年龄上调，让有意愿、有能力的长者继续工作，同时缓解人力紧张。"}, {"q": "为什么说银发不是“负担”，也可能是“红利”？", "o": ["只要长者保持健康、参与与连结，他们的经验、消费与志愿力量能转化为社会动能", "长者越多，政府能收到的税就越多", "长者退休后就不再需要任何照顾", "长者可以完全取代年轻劳动力"], "a": 0, "why": "重点：关键在于让长者保持健康、参与与连结——年长者不只是被照护者，也可以是经验与技能的贡献者。"}, {"q": "独居老人日益增多，主要原因是什么？", "o": ["不婚不育的单身群体增多，加上小家庭结构和组屋空间有限", "政府鼓励长者独居，以减轻家庭负担", "养老院收费太高，长者只好独居", "长者普遍搬到国外养老"], "a": 0, "why": "重点：一是不婚不育的单身群体增多；二是小家庭结构和组屋空间限制，子女成家后分开住，长者丧偶后便要独居。"}, {"q": "社论认为，从根本上（釜底抽薪）应对年长者独居问题，最重要的是什么？", "o": ["扭转家庭观念，强化家庭三代人的关系，多花时间维系亲情", "兴建更多三代同堂组屋", "聘请女佣在家陪伴长者", "增设更多社区关爱组屋和垂直甘榜"], "a": 0, "why": "重点：养老院、女佣、社区关爱组屋、垂直甘榜等只是现有做法；釜底抽薪之道是扭转家庭观念，强化亲子及三代人的关系。"}, {"q": "为什么政府设计乐龄政策时“不能一刀切”？", "o": ["不同性别的长者退休后需求不同，例如男性身份认同与工作紧密相连，较易社交孤立", "长者人数太多，政府资源不足", "女性长者比男性长者更需要工作", "每位长者的退休年龄都不一样"], "a": 0, "why": "重点：男性退休后容易因面子或不善表达而陷入社交孤立；女性较能通过宗教团体、邻里网络或社区活动维持联系。政策须回应不同群体的需要。"}, {"q": "从1974年到2024年，新加坡人的预期寿命大约从多少岁升至多少岁？", "o": ["73.3岁升至约83.5岁", "65岁升至约80岁", "70岁升至约90岁", "73.3岁升至约88.5岁"], "a": 0, "why": "重点：寿命不断延长，社会必须重新思考“老”的定义，法定退休年龄不应被视作人生分界点。"}, {"q": "32家机构试行的方案中，“微型工作”指的是什么？", "o": ["每天二至四小时的兼职工作", "只做义工、不拿薪水的工作", "退休前最后一年的过渡工作", "全部在家上网完成的工作"], "a": 0, "why": "重点：方案包括根据兴趣安排岗位、二至四小时的兼职或“微型工作”、重回职场培训——体现“以人为本”。"}]}, "t2": {"parts": [{"bg": [{"t": "过去，在地铁或巴士上，经常可见乘客低头翻书、静心阅读的画面。然而，随着科技迅速发展，智能手机普及，短视频与社交媒体盛行，这样的情景似乎已逐渐成为“过去式”。在资讯获取越来越便捷的今天，阅读的方式和人们的阅读习惯，正悄然发生改变。", "bp": "", "b": false, "li": false}, {"t": "一项全球学生阅读能力调查显示，新加坡小学四年级学生的阅读能力居全球之首。一方面，学生具备良好的阅读能力；另一方面，阅读逐渐变成应付考试的技能，而非发自内心的兴趣。", "bp": "", "b": false, "li": false}], "rows": [{"label": "阅读面临的挑战：", "kind": "challenge", "paras": [{"t": "阅读在众多选择中逐渐被边缘化。随着娱乐方式日益多元，人们在空闲时间更倾向于观看短视频、浏览社交媒体，而非静下心来阅读书籍。相比需要投入时间与耐心的阅读，人们更容易被带来即时感官刺激的娱乐形式吸引。", "bp": "阅读在众多选择中逐渐被边缘化。", "b": false, "li": true}, {"t": "短视频的流行，使人们习惯在极短时间内接收大量资讯。一旦内容稍长，便容易产生不耐烦情绪，不断刷新、切换内容。若从小养成这种接收信息的习惯，便难以长时间专注阅读，也不利于深入思考和系统理解。", "bp": "短视频的流行，使人们习惯在极短时间内接收大量资讯", "b": false, "li": true}]}, {"label": "阅读的重要性", "kind": "impact", "paras": [{"t": "阅读能提高认知与判断能力。阅读不仅是获取资讯的途径，更是促使人们不断更新认知、校正观点的重要方式。通过系统而持续的阅读，我们能跳脱零碎资讯的干扰，对社会现象和人生问题形成较全面、理性的理解，从而作出更周全的判断。", "bp": "阅读能提高认知与判断能力", "b": false, "li": true}, {"t": "阅读能培养专注能力。在阅读过程中，读者需要投入时间与心力，循序渐进地理解文本内容。这种心无旁骛、持续思考的过程，能有效训练专注力。专注力在当今资讯碎片化的时代显得尤为珍贵，也是学习与掌握其他技能的重要基础。", "bp": "阅读能培养专注能力。", "b": false, "li": true}, {"t": "阅读能提升语言表达能力与思维层次。长期阅读所累积的词汇量与表达方式，使人能够更准确、清晰地表达思想，并进行较高层次的抽象思考。无论在学习、工作或人际沟通中，具备良好表达能力的人，往往更容易被理解与信任，自然就更容易成功。", "bp": "阅读能提升语言表达能力与思维层次。", "b": false, "li": true}, {"t": "阅读能滋养心灵，提升个人气质。阅读对人的影响，往往不显山露水，却能在岁月中悄然塑造一个人的精神世界，长期与书籍为伴的人，在语言、举止与思考方式上，往往显得从容而有分寸，所谓“腹有诗书气自华”，这种气质并非刻意表现，而是在反复阅读与思考中自然形成的内在修养。", "bp": "阅读能滋养心灵，提升个人气质。", "b": false, "li": true}]}, {"label": "如何推广阅读", "kind": "action", "paras": [{"t": "政府与社会协力推广阅读活动。", "bp": "政府与社会协力推广阅读活动", "b": false, "li": true}, {"t": "推动阅读不能只依靠单一机构，而需政府、学校、社区与社会各界共同参与。政府可通过政策支持与公共资源投入，为阅读创造有利条件；社会组织、书店与媒体则从不同层面推广阅读活动，使阅读成为一种被看见、被鼓励的社会风气。", "bp": "", "b": false, "li": true}, {"t": "国家图书馆管理局通过举办阅读节、委派青年成为校园阅读大使，以及在社区和公共空间开展各类阅读活动，以更生活化的方式拉近大众与书籍的距离。", "bp": "", "b": false, "li": true}, {"t": "许多书店积极举办分享会、工作坊、亲子活动等，为阅读创造更生动、有趣的氛围，进一步推动阅读风气。", "bp": "", "b": false, "li": true}, {"t": "营造随处可读的环境。", "bp": "营造随处可读的环境", "b": false, "li": true}, {"t": "除了图书馆，书籍也应融入人们的日常生活。通过在社区、商场、交通枢纽等公共空间设置阅读角落或书籍贩卖点，让人们在日常生活中更容易接触到阅读资源。", "bp": "", "b": false, "li": true}, {"t": "一些本地书店开始创新，例如放置书籍自动贩卖机，精选本地文学佳作，方便大众随时选购。在樟宜机场，就能看到类似的书籍贩卖机，价格十分大众化。", "bp": "", "b": false, "li": true}, {"t": "自动贩卖机和“移动书屋”，提升购书的便利性，让更多人接触文学作品。", "bp": "", "b": false, "li": true}, {"t": "学校发挥引导作用，激发学生阅读兴趣，培养学生习惯。学校通过在教学之外设立固定阅读时段，举办阅读分享活动，扩大驻校作家计划等方式，让学生感受到阅读的多元与趣味。唯有让学生体会阅读的乐趣，阅读才不至于沦为单纯的应考工具。", "bp": "学校发挥引导作用，激发学生阅读兴趣，培养学生习惯。", "b": false, "li": true}, {"t": "家庭的引导。家庭成员以身作则，也有助于让阅读成为生活的一部分，而非单纯的学习任务。", "bp": "家庭的引导。", "b": false, "li": true}]}, {"label": "参考词句", "kind": "ref", "paras": [{"t": "腹有诗书气自华：形容人因长期读书而自然流露出涵养与气质。", "bp": "腹有诗书气自华", "b": false, "li": true}, {"t": "厚积薄发：形容阅读的长期积累，终会在关键时刻展现价值。", "bp": "厚积薄发", "b": false, "li": true}, {"t": "书到用时方恨少：意思是知识储备不足时才后悔读书太少。", "bp": "书到用时方恨少：", "b": false, "li": true}, {"t": "潜移默化：形容在不知不觉中产生深远影响。", "bp": "潜移默化", "b": false, "li": true}, {"t": "博览群书：广泛阅读各类书籍。", "bp": "博览群书", "b": false, "li": true}, {"t": "书犹药也，善读之可以医愚：意思是好书能纠正认知、启迪心智。", "bp": "书犹药也，善读之可以医愚：意思是", "b": false, "li": true}, {"t": "知之者不如好之者，好之者不如乐之者：意思是了解学习不如喜欢学习，喜欢学习不如以学习为乐。强调兴趣的重要。", "bp": "知之者不如好之者，好之者不如乐之者：", "b": false, "li": true}], "items": [{"term": "腹有诗书气自华", "en": "Someone well-read naturally carries an air of grace and refinement.", "ex": "王老师从小爱读书，谈吐温和得体，正应了“腹有诗书气自华”这句话。", "paras": [{"t": "腹有诗书气自华：形容人因长期读书而自然流露出涵养与气质。", "bp": "腹有诗书气自华", "b": false, "li": true}]}, {"term": "厚积薄发", "en": "To build up knowledge slowly and use it at the right moment.", "ex": "他坚持每天阅读半小时，写作比赛时厚积薄发，一举夺得冠军。", "paras": [{"t": "厚积薄发：形容阅读的长期积累，终会在关键时刻展现价值。", "bp": "厚积薄发", "b": false, "li": true}], "q": "厚积薄发"}, {"term": "书到用时方恨少", "en": "Only when you need knowledge do you regret not having read enough.", "ex": "写议论文时想不出例子，我才明白书到用时方恨少。", "paras": [{"t": "书到用时方恨少：意思是知识储备不足时才后悔读书太少。", "bp": "书到用时方恨少：", "b": false, "li": true}]}, {"term": "潜移默化", "en": "To influence someone quietly and gradually, without them noticing.", "ex": "父母每晚陪孩子读书，阅读的好习惯在潜移默化中养成。", "paras": [{"t": "潜移默化：形容在不知不觉中产生深远影响。", "bp": "潜移默化", "b": false, "li": true}], "q": "潜移默化"}, {"term": "博览群书", "en": "To read widely across many kinds of books.", "ex": "这位作家年轻时博览群书，所以文章内容丰富，见解独到。", "paras": [{"t": "博览群书：广泛阅读各类书籍。", "bp": "博览群书", "b": false, "li": true}], "q": "博览群书"}, {"term": "书犹药也，善读之可以医愚", "en": "Books are like medicine: read well, they cure ignorance.", "ex": "面对网上的假消息，多读好书能帮我们明辨是非，所谓书犹药也，善读之可以医愚。", "paras": [{"t": "书犹药也，善读之可以医愚：意思是好书能纠正认知、启迪心智。", "bp": "书犹药也，善读之可以医愚：意思是", "b": false, "li": true}]}, {"term": "知之者不如好之者，好之者不如乐之者", "en": "Knowing something is not as good as liking it; liking it is not as good as delighting in it.", "ex": "学校举办阅读分享会，让学生爱上读书，因为知之者不如好之者，好之者不如乐之者。", "paras": [{"t": "知之者不如好之者，好之者不如乐之者：意思是了解学习不如喜欢学习，喜欢学习不如以学习为乐。强调兴趣的重要。", "bp": "知之者不如好之者，好之者不如乐之者：", "b": false, "li": true}]}]}], "arts": [{"title": "《联合早报》社论：培养阅读成为生活习惯（删减版）", "paras": [{"t": "一项全球学生阅读能力调查显示，新加坡小学四年级学生居全球之首。不过，称“非常喜欢阅读”的本地小四学生比率降至51%，创10年来新低。这个调查结果让人喜忧参半，本地10岁孩子的阅读能力名列世界前茅，反映学校教导有方，也意味着许多家长都尽了责任。但让人担忧的是，从阅读中得到乐趣的孩子比率下降，或许代表了阅读仅是“应考能力”的另一种表现。如何让更多孩子，甚至成人乐爱阅读，应当是全国共同努力的目标。", "bp": "", "b": false, "li": false}, {"t": "对于“非常喜欢阅读”孩童比率下降，教育部的解释是这属于全球现象，因为休闲娱乐的管道增多，特别是社交媒体的普及。阅读确实是打发时间的有效方式之一，但选择多了，面对的竞争自然就大。这是鼓励培养全民阅读习惯作为一种生活方式的主要挑战。这里所指的阅读，并非一般所谓的“轻阅读”，或者通过音频“有声书”的阅读，尽管这些也能带来情感的愉悦和知识的增加。有意义的阅读应当是能吸引人集中精力，心无旁骛地长时间投身其中。这在当代尤其关键。", "bp": "", "b": false, "li": false}, {"t": "当下流行的社媒，最大的商业动机就是让消费者流连忘返，尽量多花时间和精神于其中。短视频的流行特别表现出这一特点。这种互动方式最大的弊端，就是容易导致不耐烦的心态，只要内容超过几分钟，阅听者就会有刷新内容的冲动。如果从小就形成类似接触新信息的习惯，就会难以集中精神学习或掌握技能，毕竟熟能生巧，不长时间反复练习，就不能精进有成。这是为何必须从小就培养孩童阅读习惯的原因。", "bp": "", "b": false, "li": false}, {"t": "阅读锻炼的不光是聚精会神的能力，更在于过程中养成好奇心、耐心和想象力。阅读习惯一般从文学作品开始，诗歌、散文、小说让人从阅读中触动美感，引发思考。一旦形成习惯，便能够根据不同兴趣，扩大阅读范围，从文学领域走向其他人类智慧的结晶。有阅读过原著的影视观众应当能体会，改编自小说的影视作品，往往存在不尽人意的落差。这就是阅读时所激发的想象力甚至代入感使然——编剧和导演有自己不同于其他读者的读后感。", "bp": "", "b": false, "li": false}, {"t": "好奇心、耐心和想象力，在任何时代、任何环境，这些人格品质都是人生成功的要素。阅读所累积的大量词汇，让人能够更完整地表达自己的意思，并进一步从事高难度的抽象思考活动。无论是就职、创业、社交或恋爱，能流畅自如表达自己意思的人，自然就更容易成功。善于深入思考的人，在能够轻易搜集大数据并快速分析的人工智能时代，变得更有价值。因为创意通常源自深思熟虑后的灵光一闪，这种原创能力是人工智能所难以取代的。", "bp": "", "b": false, "li": false}, {"t": "因此，培养全民阅读作为一种生活方式，应当是举国共同努力的目标。本地孩童阅读能力远高于世界平均水准，显示我们已经具备坚实的基础。如何更上层楼，让阅读成为本能兴趣，而不只是为了应考所需或其他功利性的动机，在社媒当道的时代是一大挑战。这不能只是教育部一家的事，必须是政府全体乃至全社会参与其中。除了图书馆日常的推广，各社会团体也能够以自身的方式，通过组织各种活动，乃至打造适合随时随地阅读的实体环境，让更多人体验阅读的乐趣。", "bp": "", "b": false, "li": false}]}, {"title": "陈志锐：重塑深度阅读的生态 （删减版）", "paras": [{"t": "    数码浪潮席卷的时代，阅读面临着前所未有的变革。我们既目睹信息获取的空前便利，也感受到深度思维的日渐稀缺。当刷屏成为日常，当速读成为习惯，我们不禁要问：在这场阅读方式的剧烈变迁中，我们得到什么，又失去什么？", "bp": "", "b": false, "li": false}, {"t": "    碎片化阅读，已成为越来越多人获取信息的主要方式。这种阅读模式的兴起自有其缘由：快节奏生活、碎片化时间、海量信息需求等。我们必须清醒认识碎片化阅读在便利背后隐藏着不容忽视的认知局限性。", "bp": "", "b": false, "li": false}, {"t": "    碎片化阅读主要训练的是信息筛选和快速理解能力，这在信息爆炸时代确实具有重要价值。我们须要在短时间内，灵活而有效率地接收四面八方的消息，提取关键内容，做出快速判断。但这阅读模式的问题在于它往往较浮光掠影，仅停留在信息的表面层次，缺乏深入的分析和思考。", "bp": "", "b": false, "li": false}, {"t": "    深度阅读则不同。当我们完整读一本书时，须要记住前文信息、理解复杂论证、跟随作者的思路发展。这是一个持续的、系统的认知训练过程，对于培养持续专注力、逻辑思维能力、批判分析能力，都有不可替代的作用。更重要的是，深度阅读培养的是一种思维习惯——系统思考的习惯。在碎片化信息的冲击下，我们容易形成跳跃式的思维模式，习惯于快速的刺激和反应，而缺乏深入思考的耐心，也不再懂得享受阅读的孤独。", "bp": "", "b": false, "li": false}, {"t": "    今年初报章报道，我国35岁以上成人的读写能力，低于经合组织平均水平，我认为这和我们离开学校后的阅读习惯有直接关系（我们的15岁学生可是在国际学生评估项目（PISA）里名列世界第一！）缺乏深度阅读习惯所带来的影响，远远超出读写能力下降的表面现象。读即所谓的文本输入，写则是文本的输出，两者对个人的自学能力以及终身的认知发展最为关键，读写能力降低，则终身学习成效降低。从认知层面来看，最明显的影响，是注意力持续时间的缩短。在习惯了短视频、快资讯的刺激后，会越来越难以集中精神进行长时间的阅读、沉淀和思考。这种注意力的碎片化不仅影响阅读效果，也影响工作效率、想象力和批判思维能力。若所有人只习惯接受预先包装好的“懒人包”观点和“攻略式”结论，独立思考、质疑精神、创新思维只会萎缩，长篇作品的书写也只会式微。", "bp": "    ", "b": false, "li": false}, {"t": "    或许有人会问：现时现世几乎每一个人的时间都被约束，更被挤压，能够在碎片化时间里碎片化阅读，就算不错了，怎么奢望在有限时间内实现深度阅读的可能？", "bp": "", "b": false, "li": false}, {"t": "    我们要认识到深度阅读更多是一种思维习惯。碎片化的是时间，不是阅读。方法是聚沙成塔。犹记得年少搭巴士上学的颠簸阅读，让我读完多少武侠小说。善加利用通勤、等待等日常生活中的空隙，甚至早起30分钟，可以创造阅读时间。或许最有效的是减少划手机、追视频，为深度的、无声的阅读腾出宝贵空间。当然，还要边读边思考，毕竟“学而不思则罔，思而不学则殆”。", "bp": "", "b": false, "li": false}, {"t": "    从个人经验看，主题聚焦是提高碎片化深度阅读效果的关键策略。在一个时期内专注于一个主题或作者的作品，即使是分散的阅读时间，也能够形成知识的累积效应。我就试过整个暑假只阅读白先勇的文字，结果三个月过去后，对他的遣词用字修辞手法母题深意都了然于胸；又如自己因工作关系，用了几个月时间专门阅读关于定量和定性研究方法的论文。这种主题化的阅读方式，最能在有限的时间内建立起相对完整的知识体系。", "bp": "    ", "b": false, "li": false}, {"t": "    推广深度阅读，不仅是教育问题，更是政府、学校、图书馆、出版机构、书店都应该承担起相应的责任，共同营造有利于深度阅读的社会环境。这包括创建一个亲书本、爱阅读的全生态环境和基础设施，甚至还要有创新的阅读服务模式、培养阅读推广人才、营造阅读文化氛围等。", "bp": "", "b": false, "li": false}, {"t": "    我们期许政府发放文化通行证，对阅读活动，甚至购书有积极的刺激作用。或许我们可以更进一步，效仿如英国、新西兰、马来西亚等国所发放给国民“购书券”，让大家走入书店，捧回书本，深入阅读。也可以像日本、法国、中国，甚至战火中的乌克兰那样，为书店提供租金津贴，让他们的城市有更多美丽的书店风景线。我们当然可以使用手机或平板电脑阅读，但是一本实体书所提供的触觉、嗅觉、视觉、感觉等的沉浸式体验，更有助于深入阅读。", "bp": "", "b": false, "li": false}]}]}], "dict": [{"w": "低头", "py": "dī tóu", "cn": "把头垂下。", "en": "to lower one's head", "ex": "地铁上，乘客都低头看手机，很少人翻书。"}, {"w": "静心", "py nse of touch", "ex": "翻动纸页的触觉，是电子书无法取代的。"}], "quiz": [{"q": "新加坡学生的阅读情况有什么令人“喜忧参半”的地方？", "o": ["小四学生阅读能力居全球之首，但“非常喜欢阅读”的比率降至51%，创10年新低", "小四学生阅读能力下降，但喜欢阅读的比率上升", "成人读写能力全球第一，但学生阅读能力偏低", "学生喜欢阅读的比率上升至80%，但考试成绩下降"], "a": 0, "why": "重点：喜——阅读能力名列世界前茅；忧——从阅读中得到乐趣的孩子减少，阅读可能只是“应考能力”。"}, {"q": "下列哪一项是阅读面临的挑战？", "o": ["短视频让人习惯在极短时间内接收大量资讯，内容稍长就不耐烦", "学校取消了所有阅读课", "书本价格太高，大部分人买不起", "图书馆数量太少，大众借不到书"], "a": 0, "why": "重点：两大挑战——①阅读在众多娱乐选择中被边缘化；②短视频让人习惯快速接收资讯，难以长时间专注、深入思考。"}, {"q": "社交媒体和短视频最大的商业动机是什么？", "o": ["让用户流连忘返，尽量多花时间和精神在上面", "帮助用户培养阅读习惯", "让用户学习更多知识", "减少用户使用手机的时间"], "a": 0, "why": "重点：社媒的商业动机是让人流连忘返；这容易导致不耐烦的心态，内容超过几分钟就想刷新。"}, {"q": "下列哪一项【不是】资料提到的阅读的重要性？", "o": ["阅读能让人快速取得考试高分", "阅读能提高认知与判断能力", "阅读能培养专注能力", "阅读能滋养心灵，提升个人气质"], "a": 0, "why": "重点：阅读的四大重要性——①提高认知与判断能力 ②培养专注能力 ③提升语言表达能力与思维层次 ④滋养心灵，提升个人气质。"}, {"q": "为什么说善于深入思考的人在人工智能时代更有价值？", "o": ["创意源自深思熟虑后的灵光一闪，这种原创能力是人工智能难以取代的", "因为人工智能无法搜集数据", "因为深入思考的人打字速度更快", "因为人工智能只会阅读，不会写作"], "a": 0, "why": "重点：AI能轻易搜集大数据并快速分析，但原创能力来自深思熟虑，是AI难以取代的。"}, {"q": "社论所说“有意义的阅读”指的是什么？", "o": ["能吸引人集中精力、心无旁骛地长时间投身其中的阅读", "通过有声书收听的阅读", "在社交媒体上浏览短文", "只为考试而做的阅读练习"], "a": 0, "why": "重点：社论认为“轻阅读”和有声书虽能带来愉悦与知识，但有意义的阅读应当让人集中精力、长时间投入。"}, {"q": "国家图书馆管理局用哪些方式推广阅读？", "o": ["举办阅读节、委派青年成为校园阅读大使、在社区和公共空间开展阅读活动", "向每个家庭免费派送电子书阅读器", "规定学生每周必须到图书馆", "关闭网上娱乐平台"], "a": 0, "why": "重点：以更生活化的方式拉近大众与书籍的距离；书店则举办分享会、工作坊、亲子活动。"}, {"q": "“营造随处可读的环境”的例子是什么？", "o": ["在樟宜机场等地设置书籍自动贩卖机，精选本地文学佳作", "在每个组屋楼下建一间图书馆", "要求巴士司机在车上朗读", "把所有书改成电子书"], "a": 0, "why": "重点：在社区、商场、交通枢纽设阅读角或贩卖点；书籍自动贩卖机和“移动书屋”提升购书便利性。"}, {"q": "陈志锐认为碎片化阅读的主要问题是什么？", "o": ["往往浮光掠影，只停留在信息表面，缺乏深入的分析和思考", "让人读不到任何资讯", "会让人读写能力大大提高", "会让人花太多钱买书"], "a": 0, "why": "重点：碎片化阅读训练信息筛选和快速理解，但较浮光掠影；深度阅读才能培养专注力、逻辑思维和批判分析能力。"}, {"q": "陈志锐提到我国35岁以上成人的读写能力怎么样？他认为原因是什么？", "o": ["低于经合组织平均水平，和离开学校后的阅读习惯有直接关系", "高于经合组织平均水平，因为学校教导有方", "低于经合组织平均水平，因为学校教得不好", "全球第一，因为大家都爱读书"], "a": 0, "why": "重点：我国15岁学生在PISA名列世界第一，但35岁以上成人读写能力偏低——问题出在离开学校后缺乏深度阅读习惯。"}, {"q": "陈志锐说“碎片化的是时间，不是阅读”。他建议怎样在碎片时间里深度阅读？", "o": ["善用通勤和等待的空隙、早起30分钟、少划手机，并采用主题聚焦的阅读方法", "只读懒人包和摘要", "每天只读标题", "把阅读留到长假一次完成"], "a": 0, "why": "重点：方法是聚沙成塔；主题聚焦——一段时期专注读一个主题或作者，能形成知识的累积效应。"}, {"q": "陈志锐建议政府和社会怎样推动深度阅读？", "o": ["发放文化通行证或购书券，并为书店提供租金津贴", "规定每人每月读十本书", "全面禁止短视频", "只推广电子书，减少纸本书"], "a": 0, "why": "重点：推广深度阅读是政府、学校、图书馆、出版机构、书店的共同责任；实体书的沉浸式体验更有助深入阅读。"}]}, "t3": {"parts": [{"bg": [{"t": "新加坡的教育系统长期以来以“高效率”和“精英主义”闻名，其核心是严格的分流制度（Streaming）。在过去40年中，学生在小学毕业后根据小学离校考试（PSLE）的成绩被分流到快捷（Express）、普通学术（N(A)）或普通工艺（N(T)）源流。这种“因材施教”的早期模式虽然保证了教育质量和低流失率，但也带来了显著的副作用，包括“标签化”效应、社会阶层固化，以及家长和学生面临的巨大学业竞争压力。为了适应新时代的社会需求，新加坡政府决定推行系统性的改革，从“由于成绩分流”转向“基于强项分班”。", "bp": "", "b": false, "li": false}], "rows": [{"label": "社会问题：改革旨在解决什么？", "kind": "challenge", "paras": [{"t": "标签化与社会分层：", "bp": "标签化与社会分层", "b": false, "li": true}, {"t": "学生一旦被分入“普通工艺班”，往往被贴上“不聪明”的标签，这种心理暗示限制了他们的自我发展。同时，不同源流的学生鲜少有交集，导致社会凝聚力减弱。", "bp": "", "b": false, "li": true}, {"t": "过度竞争与心理压力：", "bp": "过度竞争与心理压力", "b": false, "li": true}, {"t": "旧的PSLE总分制（T-score）精确到小数点的计分方式，让学生为了每一分而疲于奔命，形成“怕输”文化，牺牲了睡眠和心理健康。", "bp": "", "b": false, "li": true}, {"t": "唯成绩论：", "bp": "唯成绩论", "b": false, "li": true}, {"t": "过多的考试使得学习变成了“刷题”，扼杀了学生探索知识的兴趣和自主学习的能力。", "bp": "", "b": false, "li": true}]}, {"label": "政策内容与推行措施", "kind": "action", "paras": [{"t": "1. 全面科目编班 (Full Subject-Based Banding)", "bp": "1. 全面科目编班 ", "b": false, "li": false}, {"t": "内容：从2024年起，全面取消中学分流制度。不再有“快捷”、“普通”之分。", "bp": "内容：", "b": false, "li": true}, {"t": "如何推行：", "bp": "", "b": true, "li": true}, {"t": "G1/G2/G3取代源流：科目按难度分为G1（基础）、G2（标准）、G3（高级）。", "bp": "G1/G2/G3取代源流：", "b": false, "li": true}, {"t": "混合班级 (Mixed Form Classes)：来自不同积分段的学生被编入同一个班级，一起上美术、音乐、体育等共同课程，促进社交融合。", "bp": "混合班级 (Mixed Form Classes)：", "b": false, "li": true}, {"t": "灵活选科：学生根据强项修读G3科目，弱项修读G1或G2，不再受限于单一源流。", "bp": "灵活选科：", "b": false, "li": true}, {"t": "2. 统一全国考试 (Singapore-Cambridge SEC)", "bp": "", "b": true, "li": false}, {"t": "内容： 2027年起，现有的N水准和O水准考试将合并为统一的“新加坡—剑桥中学教育证书（SEC）”考试。", "bp": "内容：", "b": false, "li": true}, {"t": "如何推行：", "bp": "", "b": true, "li": true}, {"t": "所有中四学生将参加同一场全国考试。", "bp": "所有中四学生将参加同一场全国考试", "b": false, "li": true}, {"t": "学生将根据自己修读的科目水（G1/G2/G3）报考相应的试卷，证书上会列出不同科目的级别成绩。", "bp": "", "b": false, "li": true}, {"t": "3. 调整评估方式：PSLE积分等级制 (AL System)", "bp": "", "b": true, "li": false}, {"t": "内容：废除T-score（总分制），转为“成就等级制”（Achievement Level, AL）。", "bp": "内容：", "b": false, "li": true}, {"t": "如何推行：", "bp": "", "b": true, "li": true}, {"t": "将成绩分为AL1（表现最优秀）到AL8八个等级。", "bp": "", "b": false, "li": true}, {"t": "目的：模糊化分数的细微差别（例如230分和232分不再有区别），减少非必要的恶性竞争，让学生有更多择校空间。", "bp": "目的：", "b": false, "li": true}, {"t": "4. 取消年中考试：", "bp": "", "b": true, "li": false}, {"t": "内容：从2023年起，中小学全面取消年中考试（Mid-Year Exams）。", "bp": "内容：", "b": false, "li": true}, {"t": "如何推行：", "bp": "", "b": true, "li": true}, {"t": "腾出的时间不用于“填鸭式”教学，而是用于更具互动性的探究式学习。", "bp": "", "b": false, "li": true}, {"t": "目的：将焦点从“考试成绩”转移到“学习过程”，培养学生自主学习（Self-directed learning）的习惯。", "bp": "目的：", "b": false, "li": true}]}, {"label": "政策的影响与长期效益", "kind": "action", "paras": [{"t": "重塑社会契约：", "bp": "重塑社会契约", "b": false, "li": true}, {"t": "通过混合班级和取消分流，不同背景的学生从小就有机会互动，长期来看，有助于打破社会阶层壁垒，建立一个更具包容性和凝聚力的新加坡社会。", "bp": "", "b": false, "li": true}, {"t": "培养“终身学习者”：", "bp": "培养“终身学习者”", "b": false, "li": true}, {"t": "取消年中考和推行科目编班，鼓励学生根据兴趣和强项发展，保护学生的好奇心，培养他们在未来职场中所需的软技能。", "bp": "", "b": false, "li": true}, {"t": "多元的人才定义：", "bp": "多元的人才定义", "b": false, "li": true}, {"t": "随着工艺教育（ITE）升学途径的拓宽和评估方式的改革，社会对“成功”的定义将更加多元，不再仅限于学术成绩，技能型人才也将获得应有的尊重和回报。", "bp": "", "b": false, "li": true}]}, {"label": "全面发展（HolisticDevelopment）", "kind": "info", "paras": [{"t": "“全面发展”指的是一种“全人教育” (Whole Person Education)** 的理念。", "bp": "“全面发展” ", "b": false, "li": false}, {"t": "它的核心目的是：摆脱对学术成绩（智育）的过度依赖，转而培养在品格、体能、社交、审美和道德等各个方面都具备竞争力的未来公民。", "bp": "", "b": false, "li": false}, {"t": "新加坡教育部（MOE）的核心框架——“21世纪技能” (21st Century Competencies, 21CC)", "bp": "", "b": false, "li": false}, {"t": "1. 核心价值观与品格 (Character & Values) —— “德”", "bp": "1. 核心价值观与品格 ", "b": false, "li": false}, {"t": "这是新加坡教育改革的基石（Core）。“全面发展”首先要求学生做一个好人、好公民。", "bp": "", "b": false, "li": false}, {"t": "具体内容：尊重（Respect）、责任感（Responsibility）、坚毅（Resilience）、正直（Integrity）、关爱（Care）、和谐（Harmony）。", "bp": "具体内容：", "b": false, "li": true}, {"t": "如何落实：", "bp": "", "b": true, "li": true}, {"t": "品格与公民教育 (CCE) 课：不是死记硬背道德准则，而是讨论社会时事（如种族和谐、心理健康、网络霸凌）。", "bp": "品格与公民教育 ", "b": false, "li": true}, {"t": "德育在于行动 (VIA)：学生必须参与社区服务（义工），从小学到初院都有规定的工时。", "bp": "德育在于行动 ", "b": false, "li": true}, {"t": "2. 软技能与社交情感能力 (Social-Emotional Competencies) —— “群”", "bp": "2. 软技能与社交情感能力", "b": false, "li": false}, {"t": "这部分关注学生如何管理自己以及如何与他人相处。", "bp": "", "b": false, "li": false}, {"t": "具体内容：", "bp": "", "b": true, "li": true}, {"t": "自我意识：了解自己的长处和短处。", "bp": "自我意识：", "b": false, "li": true}, {"t": "社会意识：懂得换位思考，具备同理心（Empathy），能与不同种族和背景的人相处。", "bp": "社会意识：", "b": false, "li": true}, {"t": "关系管理：团队合作、冲突解决。", "bp": "关系管理：", "b": false, "li": true}, {"t": "如何落实：通过课程辅助活动 (CCA)，如体育队、制服团体（NCC, NPCC）、艺术社团，让学生在集体生活中学习领导力和团队精神。", "bp": "如何落实：", "b": false, "li": true}, {"t": "3. 思维与适应能力 (Emerging 21st Century Competencies) —— “智”的升级", "bp": "3. 思维与适应能力", "b": false, "li": false}, {"t": "传统的“智”是记忆力，“全面发展”下的“智”是思维能力。", "bp": "", "b": false, "li": false}, {"t": "具体内容：", "bp": "", "b": true, "li": true}, {"t": "批判性思维 (Critical Thinking)：能够分辨真假新闻，独立思考。", "bp": "批判性思维 ", "b": false, "li": true}, {"t": "全球意识 (Global Awareness)：了解新加坡以外的世界发生了什么。", "bp": "全球意识 ", "b": false, "li": true}, {"t": "跨文化技能 (Cross-cultural Skills)：能在全球化的环境中工作。", "bp": "跨文化技能 (", "b": false, "li": true}, {"t": "如何落实：应用学习项目 (ALP)，例如让学生通过编程解决实际问题，或者通过模拟联合国讨论国际议题。", "bp": "如何落实：", "b": false, "li": true}, {"t": "4. 身体素质与心理韧性 (Physical & Mental Health) —— “体”", "bp": "4. 身体素质与心理韧性 ", "b": false, "li": false}, {"t": "不再只是体育课跑步，而是强调身心健康和抗压能力。", "bp": "", "b": false, "li": false}, {"t": "具体内容：拥有健康的生活方式，并且在面对失败时能够“跌倒了爬起来”（Resilience）。", "bp": "具体内容：", "b": false, "li": true}, {"t": "如何落实：", "bp": "", "b": true, "li": true}, {"t": "户外探险教育：所有中三学生必须参加外展训练中心 (OBS) 的野外露营，
